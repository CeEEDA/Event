            // Synchron, blockiert. Browser stoppt den weiteren Page-Load und

            (function () {
                try {
                    var p = window.location.pathname;
                    if (p === "/einsatzzentrale" || p.indexOf("/einsatzzentrale/") === 0) {
                        if (!window.__kioskRedirected) {

                            // daher: Backend-Verfuegbarkeitscheck UEBERLASSEN wir der
                            // React-Komponente (EinsatzzentralePiPage). Hier nur den
                            // alten Hard-Redirect entfernen, damit kein JSON-Fehler
                            // angezeigt wird, falls /api/einsatzzentrale/kiosk-page
                            // auf der Server-Seite 404 gibt.
                            // Kein synchroner Redirect mehr.
                        }
                    }
                } catch (e) {}
            })();

            // KIOSK-MODE: Pre-runtime override fuer /einsatzzentrale
            // Laeuft VOR Webpack/React damit WDS-Live-Reload nicht zuschlaegt.
            (function () {
                try {
                    if (!window.location.pathname.startsWith("/einsatzzentrale")) return;
                    var noop = function () { try { console.log("[Kiosk] reload blocked"); } catch (e) {} };
                    // window.location.reload abdrehen
                    try {
                        Object.defineProperty(window.location, "reload", {
                            configurable: true, writable: false, value: noop
                        });
                    } catch (e) {}
                    // WDS-Sockets neutralisieren
                    try {
                        var OrigWS = window.WebSocket;
                        var FakeWS = function (url) {
                            if (typeof url === "string" && (url.indexOf("/ws") !== -1 || url.indexOf("sockjs") !== -1 || url.indexOf("webpack") !== -1)) {
                                try { console.log("[Kiosk] dev-server WS blocked:", url); } catch (e) {}
                                return { readyState: 3, close: function(){}, send: function(){}, addEventListener: function(){}, removeEventListener: function(){} };
                            }
                            return new OrigWS(url);
                        };
                        FakeWS.prototype = OrigWS.prototype;
                        FakeWS.CONNECTING = 0; FakeWS.OPEN = 1; FakeWS.CLOSING = 2; FakeWS.CLOSED = 3;
                        window.WebSocket = FakeWS;
                    } catch (e) {}
                    // EventSource (SSE) ebenfalls blocken falls WDS das nutzt
                    try {
                        var OrigES = window.EventSource;
                        window.EventSource = function (url) {
                            if (typeof url === "string" && (url.indexOf("/ws") !== -1 || url.indexOf("/sockjs") !== -1)) {
                                try { console.log("[Kiosk] dev-server SSE blocked:", url); } catch (e) {}
                                return { close: function(){}, addEventListener: function(){}, removeEventListener: function(){} };
                            }
                            return new OrigES(url);
                        };
                    } catch (e) {}
                    window.__kioskReloadBlocked = true;
                } catch (e) { /* niemals fail */ }
            })();
        </script>
