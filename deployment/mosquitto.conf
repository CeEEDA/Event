# ============================================================
# Mosquitto MQTT Broker - Konfiguration fuer Eventenergie
# Datei nach: C:\Program Files\mosquitto\mosquitto.conf kopieren
# Danach Dienst neustarten: Restart-Service mosquitto
# ============================================================

# Listener auf Port 1883 (alle Interfaces)
listener 1883 0.0.0.0

# Anonymen Zugang erlauben (fuer DSE WebNet Gateways)
# Spaeter kann man Benutzername/Passwort konfigurieren
allow_anonymous true

# Logging
log_dest file C:\eventenergie\logs\mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Performance
max_connections -1
message_size_limit 0

# Persistence (Nachrichten zwischen Neustarts speichern)
persistence true
persistence_location C:\eventenergie\data\mosquitto\
