<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Einsatzzentrale</title>
<style>
:root {
  --bg: #f9fafb; --card: #ffffff; --border: #e5e7eb; --border-hover: #d946ef;
  --text: #111827; --text-muted: #6b7280; --text-soft: #9ca3af;
  --fuchsia: #d946ef; --fuchsia-dark: #c026d3; --fuchsia-bg: #fdf4ff;
  --amber: #f59e0b; --amber-bg: #fffbeb;
  --emerald: #10b981; --emerald-bg: #ecfdf5;
  --red: #ef4444; --red-bg: #fef2f2;
  --blue: #3b82f6; --blue-bg: #eff6ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; }
input { font-family: inherit; }
.hidden { display: none !important; }
.kiosk-header { position: sticky; top: 0; z-index: 10; background: var(--card);
  border-bottom: 1px solid var(--border); padding: 12px 24px; }
.kiosk-header-inner { max-width: 1200px; margin: 0 auto; display: flex;
  align-items: center; justify-content: space-between; gap: 16px; }
.kiosk-brand { display: flex; align-items: center; gap: 16px; }
.kiosk-logo { height: 40px; width: auto; object-fit: contain; display: block; }
.kiosk-logo-fallback { font-weight: 800; font-size: 22px; letter-spacing: -0.5px; color: var(--fuchsia-dark); }
.kiosk-sep { width: 1px; height: 32px; background: var(--border); }
.kiosk-title { font-size: 15px; font-weight: 600; color: var(--text); }
.kiosk-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.kiosk-main { max-width: 1200px; margin: 0 auto; padding: 24px; }
.kiosk-search { position: relative; max-width: 380px; margin-bottom: 24px; }
.kiosk-search input { width: 100%; height: 52px; padding: 0 16px 0 44px;
  border: 1px solid var(--border); border-radius: 12px; font-size: 16px;
  background: var(--card); outline: none; transition: border-color .15s; }
.kiosk-search input:focus { border-color: var(--fuchsia); }
.kiosk-search svg { position: absolute; left: 14px; top: 50%;
  transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-soft); }
.kiosk-grid { display: grid; gap: 16px; }
.kiosk-grid.users { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.kiosk-grid.orders { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
.kiosk-grid.tiles  { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.kiosk-card { background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 20px; text-align: left; transition: all .15s;
  width: 100%; }
.kiosk-card:hover { border-color: var(--border-hover); box-shadow: 0 4px 12px rgba(0,0,0,.06); }
.kiosk-card.user { text-align: center; }
.avatar { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 12px;
  display: flex; align-items: center; justify-content: center; font-weight: 700;
  font-size: 24px; background: var(--fuchsia-bg); color: var(--fuchsia-dark); }
.avatar.freelancer { background: var(--amber-bg); color: var(--amber); }
.name { font-weight: 600; font-size: 15px; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.role { font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--fuchsia-dark); margin-top: 4px; }
.role.freelancer { color: var(--amber); }
.btn { display: inline-flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 16px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  font-size: 14px; font-weight: 500; }
.btn:hover { border-color: #d1d5db; background: #f9fafb; }
.btn.primary { background: var(--fuchsia); color: white; border-color: var(--fuchsia); height: 56px; font-size: 16px; padding: 0 24px; }
.btn.primary:hover { background: var(--fuchsia-dark); }
.btn.danger { color: #dc2626; border-color: var(--border); }
.btn.danger:hover { color: #b91c1c; border-color: #fecaca; background: var(--red-bg); }
.login-card { max-width: 420px; margin: 60px auto; background: var(--card);
  border: 1px solid var(--border); border-radius: 20px; padding: 32px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.login-card .avatar { width: 96px; height: 96px; font-size: 32px; }
.login-card h2 { text-align: center; margin: 0 0 4px; font-size: 24px; }
.login-card .role { text-align: center; margin-bottom: 24px; }
.login-card label { display: block; font-size: 13px; font-weight: 600;
  margin-bottom: 8px; color: var(--text); }
.login-card input[type=password] { width: 100%; height: 56px; padding: 0 16px;
  border: 1px solid var(--border); border-radius: 12px; font-size: 18px;
  text-align: center; letter-spacing: 4px; outline: none; }
.login-card input[type=password]:focus { border-color: var(--fuchsia); }
.alert { padding: 12px 14px; border-radius: 10px; margin-top: 12px;
  font-size: 14px; display: flex; gap: 8px; align-items: flex-start; }
.alert.error { background: var(--red-bg); border: 1px solid #fecaca; color: #991b1b; }
.alert.warning { background: var(--amber-bg); border: 1px solid #fde68a; color: #92400e; }
.spinner { width: 20px; height: 20px; border: 2px solid #e5e7eb;
  border-top-color: var(--fuchsia); border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.proj-header { background: linear-gradient(135deg, var(--fuchsia-bg), white);
  border: 1px solid #f5d0fe; border-radius: 20px; padding: 24px; margin-bottom: 24px; }
.proj-eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase;
  color: var(--fuchsia-dark); letter-spacing: 0.1em; }
.proj-event { font-size: 28px; font-weight: 700; margin: 4px 0 8px; }
.proj-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px;
  margin-top: 12px; font-size: 14px; color: var(--text-muted); }
.proj-meta .row { display: flex; align-items: center; gap: 6px; }
.section-title { font-size: 12px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-muted); margin: 24px 0 12px; }
.weather { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px; }
.weather .day { background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px; text-align: center; }
.weather .day .d { font-size: 12px; font-weight: 600; color: var(--text); }
.weather .day .e { font-size: 32px; margin: 4px 0; }
.weather .day .l { font-size: 10px; color: var(--text-muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.weather .day .t { font-size: 14px; font-weight: 700; margin-top: 6px; }
.weather .day .tmax { color: #ef4444; } .weather .day .tmin { color: #3b82f6; }
.weather .day .p { font-size: 10px; color: #2563eb; margin-top: 4px; }
.weather .day .w { font-size: 10px; color: var(--text-muted); }
.order-card .o-no { font-size: 11px; font-weight: 700; color: var(--fuchsia-dark);
  letter-spacing: 0.05em; }
.order-card h3 { font-size: 18px; margin: 4px 0 8px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.order-card .o-meta { font-size: 14px; color: var(--text-muted);
  display: flex; flex-direction: column; gap: 4px; }
.tile { padding: 24px; }
.tile-icon { width: 56px; height: 56px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; margin-bottom: 16px; }
.tile h3 { font-size: 18px; margin: 0 0 4px; }
.tile p { font-size: 12px; color: var(--text-muted); margin: 0; }
.empty { background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 48px; text-align: center; color: var(--text-muted); }
.user-info { display: flex; align-items: center; gap: 12px; }
.user-info .av-small { width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; background: var(--fuchsia-bg); color: var(--fuchsia-dark); }
.user-info .av-small.freelancer { background: var(--amber-bg); color: var(--amber); }
.window-badge { font-size: 11px; color: var(--text-muted); background: var(--card);
  border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 6px; }
.svg-icon { width: 16px; height: 16px; vertical-align: -2px; }
.dot-pulse { width: 8px; height: 8px; border-radius: 50%; }
.flex { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row { display: flex; align-items: center; gap: 6px; }
.icon-amber { color: var(--amber); }
.icon-fuchsia { color: var(--fuchsia); }
.icon-blue { color: var(--blue); }
.icon-emerald { color: var(--emerald); }
.tile-bg-emerald { background: var(--emerald-bg); color: var(--emerald); }
.tile-bg-slate { background: #f1f5f9; color: #475569; }
.tile-bg-blue { background: var(--blue-bg); color: var(--blue); }
.tile-bg-fuchsia { background: var(--fuchsia-bg); color: var(--fuchsia-dark); }

/* ========== DIARY (Einsatztagebuch) ============================== */
.diary-stats { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.diary-stat { flex:1; min-width:120px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
.diary-stat .lbl { font-size:11px; font-weight:600; text-transform:uppercase; color:var(--text-muted); letter-spacing:.06em; }
.diary-stat .val { font-size:28px; font-weight:700; margin-top:4px; }
.diary-stat.open .val { color:#dc2626; }
.diary-stat.resolved .val { color:var(--emerald); }
.diary-stat.total .val { color:var(--text); }

.diary-section-h { display:flex; align-items:center; justify-content:space-between; margin:24px 0 12px; }
.diary-section-h h3 { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin:0; }
.diary-section-h .right { display:flex; gap:8px; }

.diary-entry { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:10px; transition:border-color .15s; }
.diary-entry.open { border-left:4px solid #dc2626; }
.diary-entry.resolved { border-left:4px solid var(--emerald); opacity:.85; }
.diary-entry .e-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px; flex-wrap:wrap; }
.diary-entry .e-time { font-size:12px; color:var(--text-muted); display:flex; align-items:center; gap:6px; }
.diary-entry .badge { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:3px 8px; border-radius:999px; }
.badge.bg-red { background:var(--red-bg); color:#991b1b; }
.badge.bg-emerald { background:var(--emerald-bg); color:#047857; }
.badge.bg-amber { background:var(--amber-bg); color:#92400e; }
.badge.bg-fuchsia { background:var(--fuchsia-bg); color:var(--fuchsia-dark); }
.badge.bg-blue { background:var(--blue-bg); color:#1e40af; }
.diary-entry .e-reason { font-size:16px; font-weight:600; color:var(--text); margin:4px 0 8px; white-space:pre-wrap; word-break:break-word; }
.diary-entry .e-meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:6px 16px; font-size:13px; color:var(--text-muted); margin-bottom:10px; }
.diary-entry .e-meta .row { display:flex; align-items:center; gap:6px; }
.diary-entry .e-actions { display:flex; gap:8px; flex-wrap:wrap; }
.diary-entry .e-resolved-info { font-size:12px; color:var(--emerald); margin-top:6px; }

.btn.sm { height:34px; padding:0 12px; font-size:13px; }
.btn.success { background:var(--emerald); color:white; border-color:var(--emerald); }
.btn.success:hover { background:#059669; border-color:#059669; }
.btn.warn { background:var(--amber); color:white; border-color:var(--amber); }
.btn.warn:hover { background:#d97706; border-color:#d97706; }

.trupp-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
.trupp-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; position:relative; }
.trupp-card.busy { border-color:#fde68a; background:var(--amber-bg); }
.trupp-card.inactive { opacity:.45; background:#f9fafb; }
.trupp-card .t-name { font-weight:600; font-size:15px; }
.trupp-card .t-members { font-size:12px; color:var(--text-muted); margin-top:4px; }
.trupp-card .t-status { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-top:6px; display:inline-block; padding:2px 8px; border-radius:999px; }
.trupp-card .t-status.free { background:var(--emerald-bg); color:#047857; }
.trupp-card .t-status.busy { background:var(--amber-bg); color:#92400e; }
.trupp-card .t-status.paused { background:#e5e7eb; color:#6b7280; }
.trupp-card .t-actions { display:flex; gap:6px; margin-top:8px; }

/* Modal */
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:1000; display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; backdrop-filter:blur(2px); }
.modal-card { background:white; border-radius:16px; padding:24px; max-width:560px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,.2); }
.modal-card h3 { margin:0 0 16px; font-size:20px; }
.modal-card label { display:block; font-size:13px; font-weight:600; margin:12px 0 6px; color:var(--text); }
.modal-card input[type=text], .modal-card input[type=tel], .modal-card textarea { width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:10px; font-size:15px; font-family:inherit; outline:none; }
.modal-card input:focus, .modal-card textarea:focus { border-color:var(--fuchsia); }
.modal-card textarea { min-height:90px; resize:vertical; }
.modal-card .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:20px; }
.modal-card .checkbox-row { display:flex; align-items:center; gap:10px; padding:10px 0; cursor:pointer; }
.modal-card .checkbox-row input { width:18px; height:18px; }
.trupp-pick { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.trupp-pick button { padding:8px 14px; border:1px solid var(--border); border-radius:999px; background:var(--card); font-size:13px; cursor:pointer; transition:all .12s; }
.trupp-pick button.on { background:var(--fuchsia); color:white; border-color:var(--fuchsia); }
.trupp-pick button.busy { opacity:.6; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ============================================================================
// Standalone Kiosk - Vanilla JS, kein Framework, kein HMR, keine Reloads.
// ============================================================================
var BACKEND = window.location.origin;
var LOGO_URL = "https://customer-assets.emergentagent.com/job_client-file-portal/artifacts/35th6vn9_cropped-logo.webp";
// PERSISTENT STORAGE: localStorage statt sessionStorage, damit Token einen
// Browser-Crash, einen Reload oder ein Chromium-Restart auf dem Pi ueberlebt.
var SS_TOKEN = "ez_token", SS_USER = "ez_user", SS_PHASE = "ez_phase", SS_ORDER = "ez_order";
var STORE = (function() {
  // Versuche localStorage, fall back zu sessionStorage, fall back zu in-memory.
  try { localStorage.setItem("__ez_probe", "1"); localStorage.removeItem("__ez_probe"); return localStorage; } catch(e) {}
  try { sessionStorage.setItem("__ez_probe", "1"); sessionStorage.removeItem("__ez_probe"); return sessionStorage; } catch(e) {}
  var m = {}; return { getItem: function(k){return m[k]||null;}, setItem: function(k,v){m[k]=v;}, removeItem: function(k){delete m[k];} };
})();

// ----------------------------------------------------------------------------
// KIOSK-MODE HARDENING
// ----------------------------------------------------------------------------
// 1) Reload-Versuche unterbinden. Auf dem Pi darf die Seite NIE unkontrolliert
//    neu geladen werden. Falls doch ein fremdes Skript reload() aufruft, wird
//    es zu einem no-op.
try {
  Object.defineProperty(window.location, "reload", {
    configurable: false, writable: false,
    value: function(){ console.log("[Kiosk] reload() blocked"); }
  });
} catch (e) {}

// 2) WebSocket zum (nicht vorhandenen) Webpack-Dev-Server blockieren. Falls
//    irgend ein Stuck residual Code versucht wss://.../ws aufzubauen, geben
//    wir ein no-op-Objekt zurueck statt einen echten WebSocket.
try {
  var _OrigWS = window.WebSocket;
  window.WebSocket = function(url, protocols) {
    if (url && /\/ws($|\?)/.test(String(url))) {
      console.log("[Kiosk] dev-server WS blocked:", url);
      // Dummy-WebSocket der nichts tut
      return { readyState: 3, close: function(){}, send: function(){},
               addEventListener: function(){}, removeEventListener: function(){},
               onopen: null, onmessage: null, onerror: null, onclose: null };
    }
    return new _OrigWS(url, protocols);
  };
  window.WebSocket.prototype = _OrigWS.prototype;
  window.WebSocket.CONNECTING = 0; window.WebSocket.OPEN = 1;
  window.WebSocket.CLOSING = 2; window.WebSocket.CLOSED = 3;
} catch (e) {}

// 3) beforeunload: speichere State nochmal weg, falls Browser unkontrolliert
//    schliesst (Pi-Crash, OOM, etc.)
window.addEventListener("beforeunload", function() {
  try {
    if (state && state.token) {
      STORE.setItem(SS_TOKEN, state.token);
      STORE.setItem(SS_USER, JSON.stringify(state.user));
      STORE.setItem(SS_PHASE, state.phase);
      if (state.order) STORE.setItem(SS_ORDER, JSON.stringify(state.order));
    }
  } catch (e) {}
});

// ----------------------------------------------------------------------------
// DIAGNOSE: Load-Counter & Uptime-Badge unten rechts.
// Falls die Page reloaded, zaehlt der Counter hoch. Falls die Page stabil
// laeuft, bleibt er bei 1 und die Uhrzeit der Erst-Ladung wird angezeigt.
// So sieht der Operator sofort, ob es einen Reload-Loop gibt.
// ----------------------------------------------------------------------------
(function() {
  try {
    var KEY_LOADS = "ez_loads", KEY_FIRST = "ez_first_load";
    var n = parseInt(STORE.getItem(KEY_LOADS) || "0", 10) + 1;
    STORE.setItem(KEY_LOADS, String(n));
    if (n === 1 || !STORE.getItem(KEY_FIRST)) {
      STORE.setItem(KEY_FIRST, new Date().toISOString());
    }
    var firstIso = STORE.getItem(KEY_FIRST);
    var startTs = Date.now();

    function fmtUptime(sec) {
      sec = Math.max(0, Math.floor(sec));
      var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
      return (h ? h+"h " : "") + (m<10?"0":"") + m + ":" + (s<10?"0":"") + s;
    }

    function buildBadge() {
      var existing = document.getElementById("ez-diag-badge");
      if (existing) return existing;
      var b = document.createElement("div");
      b.id = "ez-diag-badge";
      b.style.cssText = "position:fixed;bottom:12px;right:12px;z-index:9999;" +
        "background:rgba(17,24,39,0.85);color:#fff;font:11px -apple-system,sans-serif;" +
        "padding:6px 10px;border-radius:8px;letter-spacing:.02em;cursor:pointer;" +
        "user-select:none;backdrop-filter:blur(8px);" +
        "border:1px solid rgba(255,255,255,.1);box-shadow:0 4px 12px rgba(0,0,0,.2);";
      b.title = "Klick zum Zuruecksetzen";
      b.addEventListener("click", function() {
        STORE.removeItem(KEY_LOADS); STORE.removeItem(KEY_FIRST);
        b.innerHTML = "Counter zurueckgesetzt (laden zum aktualisieren)";
      });
      document.body.appendChild(b);
      return b;
    }

    function tick() {
      try {
        var b = buildBadge();
        var upt = fmtUptime((Date.now() - startTs) / 1000);
        var firstStr = "";
        try { firstStr = new Date(firstIso).toLocaleTimeString("de-DE"); } catch (e) {}
        var color = n === 1 ? "#10b981" : (n < 5 ? "#f59e0b" : "#ef4444");
        b.innerHTML = '<span style="display:inline-block;width:8px;height:8px;' +
          'border-radius:50%;background:' + color + ';margin-right:8px;vertical-align:middle;"></span>' +
          'Loads: <b>' + n + '</b> &nbsp;·&nbsp; Uptime: <b>' + upt + '</b> &nbsp;·&nbsp; Erst-Load: ' + firstStr;
      } catch (e) {}
    }

    if (document.body) tick();
    else document.addEventListener("DOMContentLoaded", tick);
    setInterval(tick, 1000);
  } catch (e) {}
})();

// State
var state = { phase: "user_select", token: null, user: null, pickedUser: null,
              order: null, activeTile: null };

// Restore from STORE (localStorage mit fallback)
try {
  var t = STORE.getItem(SS_TOKEN), u = STORE.getItem(SS_USER);
  var p = STORE.getItem(SS_PHASE), o = STORE.getItem(SS_ORDER);
  if (t && u) {
    state.token = t; state.user = JSON.parse(u);
    if (p === "workspace" && o) { state.order = JSON.parse(o); state.phase = "workspace"; }
    else { state.phase = "order_select"; }
  }
} catch (e) {}

function savePhase(p) { try { STORE.setItem(SS_PHASE, p); } catch(e){} }
function saveOrder(o) { try { STORE.setItem(SS_ORDER, JSON.stringify(o)); } catch(e){} }
function clearSession() {
  try { STORE.removeItem(SS_TOKEN); STORE.removeItem(SS_USER);
        STORE.removeItem(SS_PHASE); STORE.removeItem(SS_ORDER); } catch(e){}
}

// Utilities
function $(html) { var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]}); }
function initials(n) { return (n || "?").split(/\s+/).map(function(p){return p[0];}).slice(0,2).join("").toUpperCase(); }
function fmtDate(iso) {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleDateString("de-DE", { day:"2-digit", month:"2-digit", year:"numeric" }); }
  catch (e) { return iso; }
}
function fmtRange(s, e) {
  if (!s && !e) return "";
  if (s && e && s === e) return fmtDate(s);
  return fmtDate(s) + " – " + fmtDate(e);
}
function api(path, opts) {
  opts = opts || {}; opts.headers = opts.headers || {};
  if (state.token) opts.headers["Authorization"] = "Bearer " + state.token;
  if (opts.body && typeof opts.body === "object") {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(opts.body);
  }
  return fetch(BACKEND + path, opts).then(function(r) {
    if (!r.ok) return r.json().catch(function(){return{detail:"HTTP "+r.status};}).then(function(d){ throw new Error(d.detail || ("HTTP " + r.status)); });
    return r.json();
  });
}

var diaryState = { entries: [], trupps: [], loading: false };

function fmtDateTime(iso) {
  if (!iso) return "—";
  try {
    var d = new Date(iso);
    return d.toLocaleString("de-DE", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
  } catch (e) { return iso; }
}
function fmtDuration(startIso, endIso) {
  if (!startIso || !endIso) return "—";
  try {
    var ms = new Date(endIso) - new Date(startIso);
    if (ms < 0) return "—";
    var m = Math.round(ms / 60000);
    if (m < 60) return m + " Min";
    var h = Math.floor(m / 60), rem = m % 60;
    return h + "h " + (rem<10?"0":"") + rem + "m";
  } catch (e) { return "—"; }
}

    return;

  var html = '<div class="trupp-grid">';
  diaryState.trupps.forEach(function(t) {
    var cls = !t.is_active ? "inactive" : (t.is_busy ? "busy" : "");
    var statusCls = !t.is_active ? "paused" : (t.is_busy ? "busy" : "free");
    var statusLbl = !t.is_active ? "Pause" : (t.is_busy ? "Unterwegs" : "Verfügbar");
    var members = (t.members || []).filter(Boolean).join(", ");
    html += '<div class="trupp-card ' + cls + '" data-trupp-id="' + esc(t.id) + '">' +
              '<div class="t-name">' + esc(t.name) + '</div>' +
              (members ? '<div class="t-members">👥 ' + esc(members) + '</div>' : '<div class="t-members" style="font-style:italic;color:#9ca3af;">Keine Mitglieder</div>') +
              '<div class="t-status ' + statusCls + '">' + statusLbl + '</div>' +
              '<div class="t-actions">' +
                '<button class="btn sm trupp-edit-btn" data-id="' + esc(t.id) + '">Bearbeiten</button>' +
                '<button class="btn sm trupp-pause-btn" data-id="' + esc(t.id) + '">' + (t.is_active ? "Pause" : "Aktivieren") + '</button>' +
                '<button class="btn sm danger trupp-del-btn" data-id="' + esc(t.id) + '">Löschen</button>' +
              '</div>' +
            '</div>';
  });
  html += '</div>';
  area.innerHTML = html;
  area.querySelectorAll(".trupp-edit-btn").forEach(function(b){ b.addEventListener("click", function(){ var t = diaryState.trupps.find(function(x){return x.id===b.dataset.id;}); openTruppModal(t); }); });
  area.querySelectorAll(".trupp-pause-btn").forEach(function(b){ b.addEventListener("click", function(){ var t = diaryState.trupps.find(function(x){return x.id===b.dataset.id;}); toggleTruppActive(t); }); });
  area.querySelectorAll(".trupp-del-btn").forEach(function(b){ b.addEventListener("click", function(){ var t = diaryState.trupps.find(function(x){return x.id===b.dataset.id;}); deleteTrupp(t); }); });
}

function paintDiary(filter) {
  var area = document.getElementById("diary-area"); if (!area) return;
  var q = (filter || "").trim().toLowerCase();
  var truppMap = {}; diaryState.trupps.forEach(function(t){ truppMap[t.id] = t; });
  var entries = q ? diaryState.entries.filter(function(e){
    return [e.caller_name, e.caller_phone, e.reason, e.location, e.created_by_name].filter(Boolean)
      .some(function(v){ return String(v).toLowerCase().indexOf(q)>-1; });
  }) : diaryState.entries;
  if (!entries.length) {
    area.innerHTML = '<div class="empty" style="padding:32px;">' + (q ? "Keine Einträge passen zum Filter." : "Noch keine Störungsmeldungen.") + '</div>';
    return;
  }
  var html = "";
  entries.forEach(function(e) {
    var cls = e.status === "resolved" ? "resolved" : "open";
    var truppNames = (e.assigned_trupp_ids || []).map(function(tid){ var t = truppMap[tid]; return t ? t.name : "?"; }).filter(Boolean);
    html += '<div class="diary-entry ' + cls + '" data-entry-id="' + esc(e.id) + '">' +
              '<div class="e-top">' +
                '<div class="e-time">🕐 ' + esc(fmtDateTime(e.created_at)) + (e.created_by_name ? ' &middot; <span style="font-style:italic;">' + esc(e.created_by_name) + '</span>' : '') + '</div>' +
                '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
                  (e.status === "resolved"
                     ? '<span class="badge bg-emerald">✓ Behoben</span>'
                     : '<span class="badge bg-red">● Offen</span>') +
                  (e.is_nachtrag ? '<span class="badge bg-amber">Nachtrag</span>' : '') +
                '</div>' +
              '</div>' +
              '<div class="e-reason">' + esc(e.reason) + '</div>' +
              '<div class="e-meta">' +
                (e.caller_name ? '<div class="row">👤 ' + esc(e.caller_name) + '</div>' : '') +
                (e.caller_phone ? '<div class="row">📞 ' + esc(e.caller_phone) + '</div>' : '') +
                (e.location ? '<div class="row">📍 ' + esc(e.location) + '</div>' : '') +
                (truppNames.length ? '<div class="row">👥 ' + esc(truppNames.join(", ")) + '</div>' : '') +
              '</div>' +
              (e.status === "resolved" && e.resolved_at
                ? '<div class="e-resolved-info">✓ Behoben am ' + esc(fmtDateTime(e.resolved_at)) +
                  (e.resolved_by_name ? ' von ' + esc(e.resolved_by_name) : '') +
                  ' &middot; Dauer: ' + esc(fmtDuration(e.created_at, e.resolved_at)) + '</div>'
                : '') +
              '<div class="e-actions">' +
                (e.status === "open"
                  ? '<button class="btn sm success entry-resolve-btn" data-id="' + esc(e.id) + '">✓ Als behoben markieren</button>'
                  : '<button class="btn sm warn entry-reopen-btn" data-id="' + esc(e.id) + '">↺ Wieder öffnen</button>') +
                '<button class="btn sm entry-edit-btn" data-id="' + esc(e.id) + '">Bearbeiten</button>' +
                '<button class="btn sm danger entry-del-btn" data-id="' + esc(e.id) + '">Löschen</button>' +
              '</div>' +
            '</div>';
  });
  area.innerHTML = html;
  area.querySelectorAll(".entry-resolve-btn").forEach(function(b){ b.addEventListener("click", function(){ resolveEntry(b.dataset.id); }); });
  area.querySelectorAll(".entry-reopen-btn").forEach(function(b){ b.addEventListener("click", function(){ reopenEntry(b.dataset.id); }); });
  area.querySelectorAll(".entry-edit-btn").forEach(function(b){ b.addEventListener("click", function(){ var e = diaryState.entries.find(function(x){return x.id===b.dataset.id;}); openEntryModal(e); }); });
  area.querySelectorAll(".entry-del-btn").forEach(function(b){ b.addEventListener("click", function(){ deleteEntry(b.dataset.id); }); });
}

// ---- Entry CRUD --------------------------------------------------------
function openEntryModal(entry) {
  var isEdit = !!entry;
  var sel = new Set(entry ? (entry.assigned_trupp_ids || []) : []);
  var modal = $(
    '<div class="modal-bg"><div class="modal-card">' +
      '<h3>' + (isEdit ? "Eintrag bearbeiten" : "Neue Störung anlegen") + '</h3>' +
      '<label>Anrufer/Gast</label><input type="text" id="m-name" value="' + esc(entry ? entry.caller_name : "") + '" placeholder="Name" />' +
      '<label>Telefon</label><input type="tel" id="m-phone" value="' + esc(entry ? entry.caller_phone : "") + '" placeholder="Telefonnummer" />' +
      '<label>Standort / Position</label><input type="text" id="m-loc" value="' + esc(entry ? entry.location : "") + '" placeholder="z.B. Verteiler 3, Festzelt..." />' +
      '<label>Grund / Beschreibung *</label><textarea id="m-reason" placeholder="Was ist passiert?" required>' + esc(entry ? entry.reason : "") + '</textarea>' +
      (diaryState.trupps.length
        ? '<label>Trupp zuweisen</label><div class="trupp-pick" id="m-trupps"></div>'
        : '') +
      '<label class="checkbox-row"><input type="checkbox" id="m-nachtrag" ' + (entry && entry.is_nachtrag ? "checked" : "") + ' /> Als Nachtrag markieren (rückwirkend)</label>' +
      '<div id="m-err"></div>' +
      '<div class="actions">' +
        '<button class="btn" id="m-cancel">Abbrechen</button>' +
        '<button class="btn primary" id="m-save">' + (isEdit ? "Speichern" : "Anlegen") + '</button>' +
      '</div>' +
    '</div></div>'
  );
  document.body.appendChild(modal);
  if (diaryState.trupps.length) {
    var pickEl = modal.querySelector("#m-trupps");
    diaryState.trupps.forEach(function(t) {
      var b = document.createElement("button");
      b.textContent = t.name + (t.is_busy ? " (unterwegs)" : "");
      if (!t.is_active) return; // pausierte Trupps nicht auswaehlbar
      if (sel.has(t.id)) b.classList.add("on");
      if (t.is_busy) b.classList.add("busy");
      b.addEventListener("click", function() {
        if (sel.has(t.id)) { sel.delete(t.id); b.classList.remove("on"); }
        else { sel.add(t.id); b.classList.add("on"); }
      });
      pickEl.appendChild(b);
    });
  }
  modal.querySelector("#m-cancel").addEventListener("click", function(){ modal.remove(); });
  modal.querySelector("#m-save").addEventListener("click", function() {
    var reason = modal.querySelector("#m-reason").value.trim();
    var err = modal.querySelector("#m-err");
    if (!reason) { err.innerHTML = '<div class="alert error">Grund/Beschreibung ist erforderlich.</div>'; return; }
    var payload = {
      caller_name: modal.querySelector("#m-name").value,
      caller_phone: modal.querySelector("#m-phone").value,
      location: modal.querySelector("#m-loc").value,
      reason: reason,
      is_nachtrag: modal.querySelector("#m-nachtrag").checked,
      assigned_trupp_ids: Array.from(sel)
    };
    var pk = encodeURIComponent(state.order.primary_key);
    var url = "/api/orders/" + pk + "/diary" + (isEdit ? "/" + encodeURIComponent(entry.id) : "");
    var method = isEdit ? "PUT" : "POST";
    api(url, { method: method, body: payload }).then(function(){ modal.remove(); loadDiary(); loadTrupps(); })
      .catch(function(ex){ err.innerHTML = '<div class="alert error">' + esc(ex.message) + '</div>'; });
  });
  setTimeout(function(){ var r = modal.querySelector("#m-reason"); if (r) r.focus(); }, 50);
}

function resolveEntry(id) {
  var pk = encodeURIComponent(state.order.primary_key);
  api("/api/orders/" + pk + "/diary/" + encodeURIComponent(id) + "/resolve", { method: "POST" })
    .then(function(){ loadDiary(); loadTrupps(); })
    .catch(function(ex){ alert("Fehler: " + ex.message); });
}
function reopenEntry(id) {
  var pk = encodeURIComponent(state.order.primary_key);
  api("/api/orders/" + pk + "/diary/" + encodeURIComponent(id) + "/reopen", { method: "POST" })
    .then(function(){ loadDiary(); loadTrupps(); })
    .catch(function(ex){ alert("Fehler: " + ex.message); });
}
function deleteEntry(id) {
  if (!confirm("Diesen Eintrag wirklich löschen?")) return;
  var pk = encodeURIComponent(state.order.primary_key);
  api("/api/orders/" + pk + "/diary/" + encodeURIComponent(id), { method: "DELETE" })
    .then(function(){ loadDiary(); loadTrupps(); })
    .catch(function(ex){ alert("Fehler: " + ex.message); });
}

// ---- Trupp CRUD --------------------------------------------------------
function openTruppModal(trupp) {
  var isEdit = !!trupp;
  var members = isEdit ? (trupp.members || []).slice() : [];
  while (members.length < 4) members.push("");
  var modal = $(
    '<div class="modal-bg"><div class="modal-card">' +
      '<h3>' + (isEdit ? "Trupp bearbeiten" : "Neuen Trupp anlegen") + '</h3>' +
      '<label>Name (leer = Auto-Nummerierung)</label>' +
      '<input type="text" id="t-name" value="' + esc(isEdit ? trupp.name : "") + '" placeholder="z.B. Trupp 1, Lager-Team..." />' +
      '<label>Mitglieder (max. 4)</label>' +
      [0,1,2,3].map(function(i){
        return '<input type="text" id="t-m'+i+'" value="' + esc(members[i] || "") + '" placeholder="Mitglied ' + (i+1) + '" style="margin-bottom:6px;" />';
      }).join("") +
      '<div id="t-err"></div>' +
      '<div class="actions">' +
        '<button class="btn" id="t-cancel">Abbrechen</button>' +
        '<button class="btn primary" id="t-save">' + (isEdit ? "Speichern" : "Anlegen") + '</button>' +
      '</div>' +
    '</div></div>'
  );
  document.body.appendChild(modal);
  modal.querySelector("#t-cancel").addEventListener("click", function(){ modal.remove(); });
  modal.querySelector("#t-save").addEventListener("click", function() {
    var name = modal.querySelector("#t-name").value.trim();
    var ms = [0,1,2,3].map(function(i){ return modal.querySelector("#t-m"+i).value.trim(); }).filter(Boolean);
    var pk = encodeURIComponent(state.order.primary_key);
    var url = "/api/orders/" + pk + "/trupps" + (isEdit ? "/" + encodeURIComponent(trupp.id) : "");
    var method = isEdit ? "PUT" : "POST";
    var payload = { members: ms };
    if (isEdit || name) payload.name = name;
    api(url, { method: method, body: payload })
      .then(function(){ modal.remove(); loadTrupps(); })
      .catch(function(ex){ modal.querySelector("#t-err").innerHTML = '<div class="alert error">' + esc(ex.message) + '</div>'; });
  });
}
function toggleTruppActive(t) {
  var pk = encodeURIComponent(state.order.primary_key);
  api("/api/orders/" + pk + "/trupps/" + encodeURIComponent(t.id), { method: "PUT", body: { is_active: !t.is_active } })
    .then(loadTrupps)
    .catch(function(ex){ alert("Fehler: " + ex.message); });
}
function deleteTrupp(t) {
  if (!confirm("Trupp „" + t.name + "\" wirklich löschen? Er wird aus allen Einträgen entfernt.")) return;
  var pk = encodeURIComponent(state.order.primary_key);
  api("/api/orders/" + pk + "/trupps/" + encodeURIComponent(t.id), { method: "DELETE" })
    .then(function(){ loadTrupps(); loadDiary(); })
    .catch(function(ex){ alert("Fehler: " + ex.message); });
}

// ---- CSV Export --------------------------------------------------------
function exportDiaryCsv() {
  var pk = encodeURIComponent(state.order.primary_key);
  var url = BACKEND + "/api/orders/" + pk + "/diary/export.csv";
  fetch(url, { headers: { "Authorization": "Bearer " + state.token } })
    .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.blob(); })
    .then(function(blob) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "einsatztagebuch_" + state.order.primary_key + ".csv";
      document.body.appendChild(a); a.click(); a.remove();
    })
    .catch(function(ex){ alert("CSV-Export fehlgeschlagen: " + ex.message); });
}

// ============================================================================
// ROUTER
// ============================================================================
function render() {
  switch (state.phase) {
    case "user_select": return renderUserSelect();
    case "password":    return renderPassword();
    case "order_select":return renderOrderSelect();
    case "workspace":   return renderWorkspace();
    case "tile":        return renderTilePanel();
    default:            return renderUserSelect();
  }
}
render();
</script>
