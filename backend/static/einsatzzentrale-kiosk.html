<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Einsatzzentrale</title>
<style>
:root {
  --bg: #f9fafb; --card: #ffffff; --border: #e5e7eb; --border-hover: #d946ef;
  --text: #111827; --text-muted: #6b7280; --text-soft: #9ca3af;
  --fuchsia: #d946ef; --fuchsia-dark: #c026d3; --fuchsia-bg: #fdf4ff;
  --amber: #f59e0b; --amber-bg: #fffbeb;
  --emerald: #10b981; --emerald-bg: #ecfdf5;
  --red: #ef4444; --red-bg: #fef2f2;
  --blue: #3b82f6; --blue-bg: #eff6ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; }
input { font-family: inherit; }
.hidden { display: none !important; }
.kiosk-header { position: sticky; top: 0; z-index: 10; background: var(--card);
  border-bottom: 1px solid var(--border); padding: 12px 24px; }
.kiosk-header-inner { max-width: 1200px; margin: 0 auto; display: flex;
  align-items: center; justify-content: space-between; gap: 16px; }
.kiosk-brand { display: flex; align-items: center; gap: 16px; }
.kiosk-logo { height: 40px; width: auto; object-fit: contain; display: block; }
.kiosk-logo-fallback { font-weight: 800; font-size: 22px; letter-spacing: -0.5px; color: var(--fuchsia-dark); }
.kiosk-sep { width: 1px; height: 32px; background: var(--border); }
.kiosk-title { font-size: 15px; font-weight: 600; color: var(--text); }
.kiosk-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.kiosk-main { max-width: 1200px; margin: 0 auto; padding: 24px; }
.kiosk-search { position: relative; max-width: 380px; margin-bottom: 24px; }
.kiosk-search input { width: 100%; height: 52px; padding: 0 16px 0 44px;
  border: 1px solid var(--border); border-radius: 12px; font-size: 16px;
  background: var(--card); outline: none; transition: border-color .15s; }
.kiosk-search input:focus { border-color: var(--fuchsia); }
.kiosk-search svg { position: absolute; left: 14px; top: 50%;
  transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-soft); }
.kiosk-grid { display: grid; gap: 16px; }
.kiosk-grid.users { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.kiosk-grid.orders { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
.kiosk-grid.tiles  { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.kiosk-card { background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 20px; text-align: left; transition: all .15s;
  width: 100%; }
.kiosk-card:hover { border-color: var(--border-hover); box-shadow: 0 4px 12px rgba(0,0,0,.06); }
.kiosk-card.user { text-align: center; }
.avatar { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 12px;
  display: flex; align-items: center; justify-content: center; font-weight: 700;
  font-size: 24px; background: var(--fuchsia-bg); color: var(--fuchsia-dark); }
.avatar.freelancer { background: var(--amber-bg); color: var(--amber); }
.name { font-weight: 600; font-size: 15px; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.role { font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--fuchsia-dark); margin-top: 4px; }
.role.freelancer { color: var(--amber); }
.btn { display: inline-flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 16px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  font-size: 14px; font-weight: 500; }
.btn:hover { border-color: #d1d5db; background: #f9fafb; }
.btn.primary { background: var(--fuchsia); color: white; border-color: var(--fuchsia); height: 56px; font-size: 16px; padding: 0 24px; }
.btn.primary:hover { background: var(--fuchsia-dark); }
.btn.danger { color: #dc2626; border-color: var(--border); }
.btn.danger:hover { color: #b91c1c; border-color: #fecaca; background: var(--red-bg); }
.login-card { max-width: 420px; margin: 60px auto; background: var(--card);
  border: 1px solid var(--border); border-radius: 20px; padding: 32px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.login-card .avatar { width: 96px; height: 96px; font-size: 32px; }
.login-card h2 { text-align: center; margin: 0 0 4px; font-size: 24px; }
.login-card .role { text-align: center; margin-bottom: 24px; }
.login-card label { display: block; font-size: 13px; font-weight: 600;
  margin-bottom: 8px; color: var(--text); }
.login-card input[type=password] { width: 100%; height: 56px; padding: 0 16px;
  border: 1px solid var(--border); border-radius: 12px; font-size: 18px;
  text-align: center; letter-spacing: 4px; outline: none; }
.login-card input[type=password]:focus { border-color: var(--fuchsia); }
.alert { padding: 12px 14px; border-radius: 10px; margin-top: 12px;
  font-size: 14px; display: flex; gap: 8px; align-items: flex-start; }
.alert.error { background: var(--red-bg); border: 1px solid #fecaca; color: #991b1b; }
.alert.warning { background: var(--amber-bg); border: 1px solid #fde68a; color: #92400e; }
.spinner { width: 20px; height: 20px; border: 2px solid #e5e7eb;
  border-top-color: var(--fuchsia); border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.proj-header { background: linear-gradient(135deg, var(--fuchsia-bg), white);
  border: 1px solid #f5d0fe; border-radius: 20px; padding: 24px; margin-bottom: 24px; }
.proj-eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase;
  color: var(--fuchsia-dark); letter-spacing: 0.1em; }
.proj-event { font-size: 28px; font-weight: 700; margin: 4px 0 8px; }
.proj-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px;
  margin-top: 12px; font-size: 14px; color: var(--text-muted); }
.proj-meta .row { display: flex; align-items: center; gap: 6px; }
.section-title { font-size: 12px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-muted); margin: 24px 0 12px; }
.weather { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px; }
.weather .day { background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px; text-align: center; }
.weather .day .d { font-size: 12px; font-weight: 600; color: var(--text); }
.weather .day .e { font-size: 32px; margin: 4px 0; }
.weather .day .l { font-size: 10px; color: var(--text-muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.weather .day .t { font-size: 14px; font-weight: 700; margin-top: 6px; }
.weather .day .tmax { color: #ef4444; } .weather .day .tmin { color: #3b82f6; }
.weather .day .p { font-size: 10px; color: #2563eb; margin-top: 4px; }
.weather .day .w { font-size: 10px; color: var(--text-muted); }
.order-card .o-no { font-size: 11px; font-weight: 700; color: var(--fuchsia-dark);
  letter-spacing: 0.05em; }
.order-card h3 { font-size: 18px; margin: 4px 0 8px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.order-card .o-meta { font-size: 14px; color: var(--text-muted);
  display: flex; flex-direction: column; gap: 4px; }
.tile { padding: 24px; }
.tile-icon { width: 56px; height: 56px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; margin-bottom: 16px; }
.tile h3 { font-size: 18px; margin: 0 0 4px; }
.tile p { font-size: 12px; color: var(--text-muted); margin: 0; }
.empty { background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 48px; text-align: center; color: var(--text-muted); }
.user-info { display: flex; align-items: center; gap: 12px; }
.user-info .av-small { width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; background: var(--fuchsia-bg); color: var(--fuchsia-dark); }
.user-info .av-small.freelancer { background: var(--amber-bg); color: var(--amber); }
.window-badge { font-size: 11px; color: var(--text-muted); background: var(--card);
  border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 6px; }
.svg-icon { width: 16px; height: 16px; vertical-align: -2px; }
.dot-pulse { width: 8px; height: 8px; border-radius: 50%; }
.flex { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row { display: flex; align-items: center; gap: 6px; }
.icon-amber { color: var(--amber); }
.icon-fuchsia { color: var(--fuchsia); }
.icon-blue { color: var(--blue); }
.icon-emerald { color: var(--emerald); }
.tile-bg-emerald { background: var(--emerald-bg); color: var(--emerald); }
.tile-bg-slate { background: #f1f5f9; color: #475569; }
.tile-bg-blue { background: var(--blue-bg); color: var(--blue); }
.tile-bg-fuchsia { background: var(--fuchsia-bg); color: var(--fuchsia-dark); }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ============================================================================
// Standalone Kiosk - Vanilla JS, kein Framework, kein HMR, keine Reloads.
// ============================================================================
var BACKEND = window.location.origin;
var LOGO_URL = "https://customer-assets.emergentagent.com/job_client-file-portal/artifacts/35th6vn9_cropped-logo.webp";
// PERSISTENT STORAGE: localStorage statt sessionStorage, damit Token einen
// Browser-Crash, einen Reload oder ein Chromium-Restart auf dem Pi ueberlebt.
var SS_TOKEN = "ez_token", SS_USER = "ez_user", SS_PHASE = "ez_phase", SS_ORDER = "ez_order";
var STORE = (function() {
  // Versuche localStorage, fall back zu sessionStorage, fall back zu in-memory.
  try { localStorage.setItem("__ez_probe", "1"); localStorage.removeItem("__ez_probe"); return localStorage; } catch(e) {}
  try { sessionStorage.setItem("__ez_probe", "1"); sessionStorage.removeItem("__ez_probe"); return sessionStorage; } catch(e) {}
  var m = {}; return { getItem: function(k){return m[k]||null;}, setItem: function(k,v){m[k]=v;}, removeItem: function(k){delete m[k];} };
})();

// ----------------------------------------------------------------------------
// KIOSK-MODE HARDENING
// ----------------------------------------------------------------------------
// 1) Reload-Versuche unterbinden. Auf dem Pi darf die Seite NIE unkontrolliert
//    neu geladen werden. Falls doch ein fremdes Skript reload() aufruft, wird
//    es zu einem no-op.
try {
  Object.defineProperty(window.location, "reload", {
    configurable: false, writable: false,
    value: function(){ console.log("[Kiosk] reload() blocked"); }
  });
} catch (e) {}

// 2) WebSocket zum (nicht vorhandenen) Webpack-Dev-Server blockieren. Falls
//    irgend ein Stuck residual Code versucht wss://.../ws aufzubauen, geben
//    wir ein no-op-Objekt zurueck statt einen echten WebSocket.
try {
  var _OrigWS = window.WebSocket;
  window.WebSocket = function(url, protocols) {
    if (url && /\/ws($|\?)/.test(String(url))) {
      console.log("[Kiosk] dev-server WS blocked:", url);
      // Dummy-WebSocket der nichts tut
      return { readyState: 3, close: function(){}, send: function(){},
               addEventListener: function(){}, removeEventListener: function(){},
               onopen: null, onmessage: null, onerror: null, onclose: null };
    }
    return new _OrigWS(url, protocols);
  };
  window.WebSocket.prototype = _OrigWS.prototype;
  window.WebSocket.CONNECTING = 0; window.WebSocket.OPEN = 1;
  window.WebSocket.CLOSING = 2; window.WebSocket.CLOSED = 3;
} catch (e) {}

// 3) beforeunload: speichere State nochmal weg, falls Browser unkontrolliert
//    schliesst (Pi-Crash, OOM, etc.)
window.addEventListener("beforeunload", function() {
  try {
    if (state && state.token) {
      STORE.setItem(SS_TOKEN, state.token);
      STORE.setItem(SS_USER, JSON.stringify(state.user));
      STORE.setItem(SS_PHASE, state.phase);
      if (state.order) STORE.setItem(SS_ORDER, JSON.stringify(state.order));
    }
  } catch (e) {}
});

// State
var state = { phase: "user_select", token: null, user: null, pickedUser: null,
              order: null, activeTile: null };

// Restore from STORE (localStorage mit fallback)
try {
  var t = STORE.getItem(SS_TOKEN), u = STORE.getItem(SS_USER);
  var p = STORE.getItem(SS_PHASE), o = STORE.getItem(SS_ORDER);
  if (t && u) {
    state.token = t; state.user = JSON.parse(u);
    if (p === "workspace" && o) { state.order = JSON.parse(o); state.phase = "workspace"; }
    else { state.phase = "order_select"; }
  }
} catch (e) {}

function savePhase(p) { try { STORE.setItem(SS_PHASE, p); } catch(e){} }
function saveOrder(o) { try { STORE.setItem(SS_ORDER, JSON.stringify(o)); } catch(e){} }
function clearSession() {
  try { STORE.removeItem(SS_TOKEN); STORE.removeItem(SS_USER);
        STORE.removeItem(SS_PHASE); STORE.removeItem(SS_ORDER); } catch(e){}
}

// Utilities
function $(html) { var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]}); }
function initials(n) { return (n || "?").split(/\s+/).map(function(p){return p[0];}).slice(0,2).join("").toUpperCase(); }
function fmtDate(iso) {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleDateString("de-DE", { day:"2-digit", month:"2-digit", year:"numeric" }); }
  catch (e) { return iso; }
}
function fmtRange(s, e) {
  if (!s && !e) return "";
  if (s && e && s === e) return fmtDate(s);
  return fmtDate(s) + " – " + fmtDate(e);
}
function api(path, opts) {
  opts = opts || {}; opts.headers = opts.headers || {};
  if (state.token) opts.headers["Authorization"] = "Bearer " + state.token;
  if (opts.body && typeof opts.body === "object") {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(opts.body);
  }
  return fetch(BACKEND + path, opts).then(function(r) {
    if (!r.ok) return r.json().catch(function(){return{detail:"HTTP "+r.status};}).then(function(d){ throw new Error(d.detail || ("HTTP " + r.status)); });
    return r.json();
  });
}

// ============================================================================
// PHASE 1: USER SELECT
// ============================================================================
function renderUserSelect() {
  var root = document.getElementById("root");
  root.innerHTML = "";
  root.appendChild($(
    '<div>' +
    '<header class="kiosk-header"><div class="kiosk-header-inner">' +
      '<div class="kiosk-brand">' +
        '<img class="kiosk-logo" src="' + LOGO_URL + '" alt="Eventenergie" onerror="this.outerHTML=\'<div class=\\\'kiosk-logo-fallback\\\'>Eventenergie</div>\'" />' +
        '<div class="kiosk-sep"></div>' +
        '<div><div class="kiosk-title">Einsatzzentrale</div><div class="kiosk-sub">Wähle deinen Namen, um dich anzumelden</div></div>' +
      '</div>' +
    '</div></header>' +
    '<main class="kiosk-main">' +
      '<div class="kiosk-search">' +
        '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke-width="2"/><path stroke-width="2" stroke-linecap="round" d="m20 20-3-3"/></svg>' +
        '<input id="user-filter" placeholder="Name suchen…" autocomplete="off" />' +
      '</div>' +
      '<div id="user-area"><div class="empty"><div class="spinner" style="margin:0 auto"></div></div></div>' +
    '</main></div>'
  ));
  var allUsers = [];
  var area = document.getElementById("user-area");
  var input = document.getElementById("user-filter");

  function paint(filter) {
    var q = (filter || "").trim().toLowerCase();
    var visible = q ? allUsers.filter(function(u){return (u.name||"").toLowerCase().indexOf(q)>-1;}) : allUsers;
    area.innerHTML = "";
    if (visible.length === 0) { area.appendChild($('<p style="color:#9ca3af;">Keine Mitarbeiter gefunden.</p>')); return; }
    var grid = $('<div class="kiosk-grid users"></div>');
    visible.forEach(function(u) {
      var freelancer = u.role === "freelancer";
      var card = $(
        '<button class="kiosk-card user">' +
          '<div class="avatar' + (freelancer ? ' freelancer' : '') + '">' + esc(initials(u.name)) + '</div>' +
          '<div class="name">' + esc(u.name) + '</div>' +
          '<div class="role' + (freelancer ? ' freelancer' : '') + '">' + esc(u.role) + '</div>' +
        '</button>'
      );
      card.addEventListener("click", function(){ state.pickedUser = u; state.phase = "password"; render(); });
      grid.appendChild(card);
    });
    area.appendChild(grid);
  }
  input.addEventListener("input", function(){ paint(input.value); });
  api("/api/einsatzzentrale/users").then(function(data){ allUsers = data.users || []; paint(""); })
    .catch(function(err){ area.innerHTML = '<div class="alert error">Server nicht erreichbar: ' + esc(err.message) + '</div>'; });
}

// ============================================================================
// PHASE 2: PASSWORD
// ============================================================================
function renderPassword() {
  var u = state.pickedUser; if (!u) { state.phase = "user_select"; render(); return; }
  var root = document.getElementById("root"); root.innerHTML = "";
  var freelancer = u.role === "freelancer";
  root.appendChild($(
    '<div>' +
    '<header class="kiosk-header"><div class="kiosk-header-inner">' +
      '<div class="kiosk-brand"><img class="kiosk-logo" src="' + LOGO_URL + '" alt="Eventenergie" onerror="this.outerHTML=\'<div class=\\\'kiosk-logo-fallback\\\'>Eventenergie</div>\'" />' +
        '<div class="kiosk-sep"></div><div><div class="kiosk-title">Einsatzzentrale</div><div class="kiosk-sub">Passwort eingeben</div></div>' +
      '</div>' +
      '<button id="back-btn" class="btn">← Zurück</button>' +
    '</div></header>' +
    '<main class="kiosk-main">' +
      '<form id="pw-form" class="login-card">' +
        '<div class="avatar' + (freelancer ? ' freelancer' : '') + '">' + esc(initials(u.name)) + '</div>' +
        '<h2>' + esc(u.name) + '</h2>' +
        '<div class="role' + (freelancer ? ' freelancer' : '') + '">' + esc(u.role) + '</div>' +
        '<label>Passwort</label>' +
        '<input type="password" id="pw" autocomplete="current-password" required />' +
        '<div id="pw-err"></div>' +
        '<button type="submit" class="btn primary" style="width:100%;margin-top:18px;justify-content:center;">Anmelden</button>' +
      '</form>' +
    '</main></div>'
  ));
  document.getElementById("back-btn").addEventListener("click", function(){ state.pickedUser = null; state.phase = "user_select"; render(); });
  setTimeout(function(){ var pw = document.getElementById("pw"); if (pw) pw.focus(); }, 50);
  document.getElementById("pw-form").addEventListener("submit", function(e) {
    e.preventDefault();
    var pw = document.getElementById("pw").value;
    var err = document.getElementById("pw-err"); err.innerHTML = "";
    var btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>';
    api("/api/einsatzzentrale/login", { method: "POST", body: { user_id: u.id, password: pw } })
      .then(function(data) {
        state.token = data.token; state.user = data.user; state.phase = "order_select";
        try { STORE.setItem(SS_TOKEN, data.token); STORE.setItem(SS_USER, JSON.stringify(data.user)); } catch(e){}
        savePhase("order_select"); try { STORE.removeItem(SS_ORDER); } catch(e){}
        render();
      })
      .catch(function(ex) {
        err.innerHTML = '<div class="alert error">' + esc(ex.message) + '</div>';
        btn.disabled = false; btn.innerHTML = "Anmelden";
      });
  });
}

// ============================================================================
// PHASE 3: ORDER SELECT
// ============================================================================
function renderHeader(subtitle) {
  var u = state.user; var freelancer = u && u.role === "freelancer";
  return (
    '<header class="kiosk-header"><div class="kiosk-header-inner">' +
      '<div class="kiosk-brand"><img class="kiosk-logo" src="' + LOGO_URL + '" alt="Eventenergie" onerror="this.outerHTML=\'<div class=\\\'kiosk-logo-fallback\\\'>Eventenergie</div>\'" />' +
        '<div class="kiosk-sep"></div><div><div class="kiosk-title">Einsatzzentrale</div><div class="kiosk-sub">' + esc(subtitle || "") + '</div></div>' +
      '</div>' +
      '<div class="user-info">' +
        '<div style="text-align:right;"><div style="font-size:14px;font-weight:500;">' + esc(u ? u.name : "") + '</div><div style="font-size:10px;text-transform:uppercase;color:#6b7280;font-weight:600;">' + esc(u ? u.role : "") + '</div></div>' +
        '<div class="av-small' + (freelancer ? ' freelancer' : '') + '">' + esc(initials(u ? u.name : "")) + '</div>' +
        '<button id="logout-btn" class="btn danger">⎋ Abmelden</button>' +
      '</div>' +
    '</div></header>'
  );
}

function attachLogout() {
  var b = document.getElementById("logout-btn");
  if (b) b.addEventListener("click", function() {
    state.token = null; state.user = null; state.order = null; state.pickedUser = null; state.phase = "user_select";
    clearSession();
    render();
  });
}

function renderOrderSelect() {
  var root = document.getElementById("root"); root.innerHTML = "";
  root.appendChild($(
    '<div>' + renderHeader("Auftrag auswählen") +
    '<main class="kiosk-main">' +
      '<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:24px;">' +
        '<div class="kiosk-search" style="margin:0;flex:1;min-width:240px;max-width:380px;">' +
          '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke-width="2"/><path stroke-width="2" stroke-linecap="round" d="m20 20-3-3"/></svg>' +
          '<input id="order-filter" placeholder="Suchen: Auftrag, Kunde, Event…" autocomplete="off" />' +
        '</div>' +
        '<div id="window-badge"></div>' +
      '</div>' +
      '<div id="order-area"><div class="empty"><div class="spinner" style="margin:0 auto"></div></div></div>' +
    '</main></div>'
  ));
  attachLogout();
  var allOrders = [];
  var area = document.getElementById("order-area");
  var input = document.getElementById("order-filter");
  function paint(filter) {
    var q = (filter || "").trim().toLowerCase();
    var visible = q ? allOrders.filter(function(o){return [o.order_no,o.contact_name,o.address,o.event].filter(Boolean).some(function(v){return String(v).toLowerCase().indexOf(q)>-1;});}) : allOrders;
    area.innerHTML = "";
    if (visible.length === 0) {
      area.appendChild($('<div class="empty">' + (q ? "Keine Aufträge passen zum Filter." : "Keine aktiven Aufträge im Zeitraum.") + '</div>'));
      return;
    }
    var grid = $('<div class="kiosk-grid orders"></div>');
    visible.forEach(function(o) {
      var c = $(
        '<button class="kiosk-card order-card">' +
          '<div class="o-no">AUFTRAG #' + esc(o.order_no || o.primary_key) + '</div>' +
          '<h3>' + esc(o.event || "—") + '</h3>' +
          '<div class="o-meta">' +
            (o.contact_name ? '<div class="row">🏢 <span>' + esc(o.contact_name) + '</span></div>' : '') +
            (o.address ? '<div class="row" style="color:#9ca3af;">📍 <span>' + esc(o.address) + '</span></div>' : '') +
            '<div class="row" style="color:#9ca3af;">📅 ' + esc(fmtRange(o.event_start, o.event_end)) + '</div>' +
          '</div>' +
        '</button>'
      );
      c.addEventListener("click", function() {
        state.order = o; state.phase = "workspace"; saveOrder(o); savePhase("workspace"); render();
      });
      grid.appendChild(c);
    });
    area.appendChild(grid);
  }
  input.addEventListener("input", function(){ paint(input.value); });
  api("/api/einsatzzentrale/orders").then(function(data) {
    allOrders = data.orders || [];
    if (data.window_start) {
      document.getElementById("window-badge").innerHTML =
        '<div class="window-badge">📅 ' + esc(fmtRange(data.window_start, data.window_end)) + '</div>';
    }
    paint("");
  }).catch(function(err) { area.innerHTML = '<div class="alert error">' + esc(err.message) + '</div>'; });
}

// ============================================================================
// PHASE 4: WORKSPACE
// ============================================================================
var TILES = [
  { key:"maschinen", label:"Maschinenliste", desc:"Generatoren, Verteiler, Lichtmasten", icon:"⚙️", cls:"tile-bg-emerald" },
  { key:"diary",     label:"Einsatztagebuch", desc:"Störungen & Verlauf",                  icon:"📓", cls:"tile-bg-slate" },
  { key:"plaene",    label:"Pläne",           desc:"Lagepläne, Dokumente, PDFs",           icon:"📄", cls:"tile-bg-blue" },
  { key:"standorte", label:"Standortliste",   desc:"Alle GPS-Positionen",                  icon:"📍", cls:"tile-bg-fuchsia" }
];

function renderWorkspace() {
  var o = state.order; if (!o) { state.phase = "order_select"; render(); return; }
  var root = document.getElementById("root"); root.innerHTML = "";
  root.appendChild($(
    '<div>' + renderHeader("Auftrag #" + (o.order_no || o.primary_key)) +
    '<main class="kiosk-main">' +
      '<div id="proj-header"></div>' +
      '<div class="section-title">☁ Wetter-Prognose</div>' +
      '<div id="weather-area"><div class="empty"><div class="spinner" style="margin:0 auto"></div></div></div>' +
      '<div class="section-title">Bereiche</div>' +
      '<div class="kiosk-grid tiles">' +
        TILES.map(function(t) {
          return '<button class="kiosk-card tile" data-tile="' + t.key + '">' +
                   '<div class="tile-icon ' + t.cls + '">' + t.icon + '</div>' +
                   '<h3>' + esc(t.label) + '</h3><p>' + esc(t.desc) + '</p>' +
                 '</button>';
        }).join("") +
      '</div>' +
    '</main></div>'
  ));
  attachLogout();

  // Tile clicks
  document.querySelectorAll("[data-tile]").forEach(function(el) {
    el.addEventListener("click", function() { state.activeTile = el.dataset.tile; state.phase = "tile"; render(); });
  });

  // Load project header + weather
  api("/api/einsatzzentrale/orders/" + encodeURIComponent(o.primary_key))
    .then(function(detail) {
      document.getElementById("proj-header").innerHTML =
        '<div class="proj-header">' +
          '<div class="proj-eyebrow">Auftrag #' + esc(detail.order_no || detail.primary_key) + '</div>' +
          '<div class="proj-event">' + esc(detail.event || "Veranstaltung") + '</div>' +
          (detail.contact_name ? '<div style="color:#374151;">🏢 ' + esc(detail.contact_name) + '</div>' : '') +
          '<div class="proj-meta">' +
            (detail.address ? '<div class="row">📍 ' + esc(detail.address) + '</div>' : '') +
            '<div class="row">📅 ' + esc(fmtRange(detail.event_start, detail.event_end)) + '</div>' +
            (detail.editor_name ? '<div class="row" style="font-size:12px;color:#9ca3af;">👤 Bearbeiter: ' + esc(detail.editor_name) + '</div>' : '') +
          '</div>' +
        '</div>';
      // Weather
      var weatherArea = document.getElementById("weather-area");
      if (detail.center_lat == null || detail.center_lng == null) {
        weatherArea.innerHTML = '<div class="alert warning">⚠ Keine GPS-Koordinaten zum Auftrag hinterlegt — Auftrag zuerst auf Detail-Seite öffnen damit GPS geocodiert wird.</div>';
        return;
      }
      var p = new URLSearchParams({ lat: detail.center_lat, lng: detail.center_lng });
      if (detail.event_start) p.set("start", detail.event_start);
      if (detail.event_end) p.set("end", detail.event_end);
      return api("/api/einsatzzentrale/weather?" + p.toString()).then(function(w) {
        if (!w.days || !w.days.length) { weatherArea.innerHTML = '<p style="color:#9ca3af;">Keine Wetterdaten.</p>'; return; }
        weatherArea.innerHTML = '<div class="weather">' + w.days.map(function(d) {
          return '<div class="day"><div class="d">' + esc(new Date(d.date).toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"})) +
                 '</div><div class="e" title="' + esc(d.weather_label) + '">' + d.weather_emoji + '</div>' +
                 '<div class="l">' + esc(d.weather_label) + '</div>' +
                 '<div class="t"><span class="tmax">' + Math.round(d.temp_max) + '°</span> / <span class="tmin">' + Math.round(d.temp_min) + '°</span></div>' +
                 (d.precipitation_mm != null ? '<div class="p">🌧 ' + d.precipitation_mm.toFixed(1) + ' mm' + (d.precipitation_prob != null ? ' · ' + d.precipitation_prob + '%' : '') + '</div>' : '') +
                 (d.wind_gust_kmh != null ? '<div class="w">💨 Böen ' + Math.round(d.wind_gust_kmh) + ' km/h</div>' : '') +
                 '</div>';
        }).join("") + '</div>';
      });
    })
    .catch(function(err) {
      document.getElementById("proj-header").innerHTML = '<div class="alert error">' + esc(err.message) + '</div>';
    });
}

// ============================================================================
// PHASE 5: TILE PANEL (Platzhalter)
// ============================================================================
function renderTilePanel() {
  var t = TILES.find(function(x){return x.key === state.activeTile;});
  var o = state.order; if (!t || !o) { state.phase = "workspace"; render(); return; }
  var root = document.getElementById("root"); root.innerHTML = "";
  root.appendChild($(
    '<div>' + renderHeader("Auftrag #" + (o.order_no || o.primary_key) + " · " + t.label) +
    '<main class="kiosk-main">' +
      '<button id="tile-back" class="btn" style="margin-bottom:16px;">← Zurück zu den Bereichen</button>' +
      '<div class="kiosk-card" style="text-align:center;padding:48px;">' +
        '<div class="tile-icon ' + t.cls + '" style="margin:0 auto 16px;">' + t.icon + '</div>' +
        '<h2 style="margin:0 0 8px;">' + esc(t.label) + '</h2>' +
        '<p style="color:#6b7280;max-width:420px;margin:0 auto 16px;">Inhalt für „' + esc(t.label) + '" wird gebaut, sobald du sagst was hier konkret rein soll.</p>' +
        '<p style="font-size:12px;color:#9ca3af;">(Backend-Daten verfügbar — Layout & Filter folgen.)</p>' +
      '</div>' +
    '</main></div>'
  ));
  attachLogout();
  document.getElementById("tile-back").addEventListener("click", function(){ state.activeTile = null; state.phase = "workspace"; render(); });
}

// ============================================================================
// ROUTER
// ============================================================================
function render() {
  switch (state.phase) {
    case "user_select": return renderUserSelect();
    case "password":    return renderPassword();
    case "order_select":return renderOrderSelect();
    case "workspace":   return renderWorkspace();
    case "tile":        return renderTilePanel();
    default:            return renderUserSelect();
  }
}
render();
</script>
</body>
</html>
