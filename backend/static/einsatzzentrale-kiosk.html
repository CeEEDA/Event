<script>
/* SELBST-REINIGUNG: Service Worker abmelden + alle Caches loeschen.
   Verhindert dass alte HTML-Versionen via SW-Cache zurueckgeliefert werden. */
(function () {
  try {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        var hadAny = regs.length > 0;
        regs.forEach(function (r) { r.unregister(); });
        if (hadAny && window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }).then(function () {
            // Nach SW-Cleanup einmalig hart reloaden, damit ohne SW geladen wird
            if (!sessionStorage.getItem("__sw_killed_once")) {
              sessionStorage.setItem("__sw_killed_once", "1");
              var u = new URL(window.location.href);
              u.searchParams.set("_sw_clean", Date.now().toString());
              window.location.assign(u.toString());
            }
          });
        }
      }).catch(function () {});
    }
  } catch (e) {}
})();
</script>

  window.WebSocket = function(url, protocols) {
    if (url && /\/ws($|\?)/.test(String(url))) {
      console.log("[Kiosk] dev-server WS blocked:", url);
      // Dummy-WebSocket der nichts tut
      return { readyState: 3, close: function(){}, send: function(){},
               addEventListener: function(){}, removeEventListener: function(){},
               onopen: null, onmessage: null, onerror: null, onclose: null };
    }
    return new _OrigWS(url, protocols);
  };
  window.WebSocket.prototype = _OrigWS.prototype;
  window.WebSocket.CONNECTING = 0; window.WebSocket.OPEN = 1;
  window.WebSocket.CLOSING = 2; window.WebSocket.CLOSED = 3;
} catch (e) {}

// 3) beforeunload: speichere State nochmal weg, falls Browser unkontrolliert
//    schliesst (Pi-Crash, OOM, etc.)
window.addEventListener("beforeunload", function() {
  try {
    if (state && state.token) {
      STORE.setItem(SS_TOKEN, state.token);
      STORE.setItem(SS_USER, JSON.stringify(state.user));
      STORE.setItem(SS_PHASE, state.phase);
      if (state.order) STORE.setItem(SS_ORDER, JSON.stringify(state.order));
    }
  } catch (e) {}
});

// ----------------------------------------------------------------------------
// DIAGNOSE: Load-Counter & Uptime-Badge unten rechts.
// Falls die Page reloaded, zaehlt der Counter hoch. Falls die Page stabil
// laeuft, bleibt er bei 1 und die Uhrzeit der Erst-Ladung wird angezeigt.
// So sieht der Operator sofort, ob es einen Reload-Loop gibt.
// ----------------------------------------------------------------------------
(function() {
  try {
    var KEY_LOADS = "ez_loads", KEY_FIRST = "ez_first_load";
    var n = parseInt(STORE.getItem(KEY_LOADS) || "0", 10) + 1;
    STORE.setItem(KEY_LOADS, String(n));
    if (n === 1 || !STORE.getItem(KEY_FIRST)) {
      STORE.setItem(KEY_FIRST, new Date().toISOString());
    }
    var firstIso = STORE.getItem(KEY_FIRST);
    var startTs = Date.now();

    function fmtUptime(sec) {
      sec = Math.max(0, Math.floor(sec));
      var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
      return (h ? h+"h " : "") + (m<10?"0":"") + m + ":" + (s<10?"0":"") + s;
    }

    function buildBadge() {
      var existing = document.getElementById("ez-diag-badge");
      if (existing) return existing;
      var b = document.createElement("div");
      b.id = "ez-diag-badge";
      b.style.cssText = "position:fixed;bottom:12px;right:12px;z-index:9999;" +
        "background:rgba(17,24,39,0.85);color:#fff;font:11px -apple-system,sans-serif;" +
        "padding:6px 10px;border-radius:8px;letter-spacing:.02em;cursor:pointer;" +
        "user-select:none;backdrop-filter:blur(8px);" +
        "border:1px solid rgba(255,255,255,.1);box-shadow:0 4px 12px rgba(0,0,0,.2);";
      b.title = "Klick zum Zuruecksetzen";
      b.addEventListener("click", function() {
        STORE.removeItem(KEY_LOADS); STORE.removeItem(KEY_FIRST);
        b.innerHTML = "Counter zurueckgesetzt (laden zum aktualisieren)";
      });
      document.body.appendChild(b);
      return b;
    }

    function tick() {
      try {
        var b = buildBadge();
        var upt = fmtUptime((Date.now() - startTs) / 1000);
        var firstStr = "";
        try { firstStr = new Date(firstIso).toLocaleTimeString("de-DE"); } catch (e) {}
        var color = n === 1 ? "#10b981" : (n < 5 ? "#f59e0b" : "#ef4444");
        b.innerHTML = '<span style="display:inline-block;width:8px;height:8px;' +
          'border-radius:50%;background:' + color + ';margin-right:8px;vertical-align:middle;"></span>' +
          'Loads: <b>' + n + '</b> &nbsp;·&nbsp; Uptime: <b>' + upt + '</b> &nbsp;·&nbsp; Erst-Load: ' + firstStr;
      } catch (e) {}
    }

    if (document.body) tick();
    else document.addEventListener("DOMContentLoaded", tick);
    setInterval(tick, 1000);
  } catch (e) {}
})();

// State
var state = { phase: "user_select", token: null, user: null, pickedUser: null,
              order: null, activeTile: null };

// Restore from STORE (localStorage mit fallback)
try {
  var t = STORE.getItem(SS_TOKEN), u = STORE.getItem(SS_USER);
  var p = STORE.getItem(SS_PHASE), o = STORE.getItem(SS_ORDER);
  if (t && u) {
    state.token = t; state.user = JSON.parse(u);
    if (p === "workspace" && o) { state.order = JSON.parse(o); state.phase = "workspace"; }
    else { state.phase = "order_select"; }
  }
} catch (e) {}

function savePhase(p) { try { STORE.setItem(SS_PHASE, p); } catch(e){} }
function saveOrder(o) { try { STORE.setItem(SS_ORDER, JSON.stringify(o)); } catch(e){} }
function clearSession() {
  try { STORE.removeItem(SS_TOKEN); STORE.removeItem(SS_USER);
        STORE.removeItem(SS_PHASE); STORE.removeItem(SS_ORDER); } catch(e){}
}

// Utilities
function $(html) { var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]}); }
function initials(n) { return (n || "?").split(/\s+/).map(function(p){return p[0];}).slice(0,2).join("").toUpperCase(); }
function fmtDate(iso) {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleDateString("de-DE", { day:"2-digit", month:"2-digit", year:"numeric" }); }
  catch (e) { return iso; }
}
function fmtRange(s, e) {
  if (!s && !e) return "";
  if (s && e && s === e) return fmtDate(s);
  return fmtDate(s) + " – " + fmtDate(e);
}
function api(path, opts) {
  opts = opts || {}; opts.headers = opts.headers || {};
  if (state.token) opts.headers["Authorization"] = "Bearer " + state.token;
  if (opts.body && typeof opts.body === "object") {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(opts.body);
  }
  return fetch(BACKEND + path, opts).then(function(r) {
    if (!r.ok) return r.json().catch(function(){return{detail:"HTTP "+r.status};}).then(function(d){ throw new Error(d.detail || ("HTTP " + r.status)); });
    return r.json();
  });
}

function attachLogout() {
  var b = document.getElementById("logout-btn");
  if (b) b.addEventListener("click", function() {
    state.token = null; state.user = null; state.order = null; state.pickedUser = null; state.phase = "user_select";
    clearSession();
    render();
  });
  var r = document.getElementById("hard-refresh-btn");
  if (r) r.addEventListener("click", function() {
    // Hard-Reload: Cache-Bust via Timestamp + assign (umgeht Reload-Override falls vorhanden).
    // Token bleibt in localStorage, User bleibt eingeloggt.
    try {
      var spinSvg = r.querySelector("svg");
      if (spinSvg) { spinSvg.style.transition = "transform .8s linear"; spinSvg.style.transform = "rotate(360deg)"; }
    } catch(e) {}
    var u = new URL(window.location.href);
    u.searchParams.set("_t", Date.now().toString());
    setTimeout(function(){ window.location.assign(u.toString()); }, 100);
  });
}

// ============================================================================
// REGENRADAR via RainViewer (kostenlos, kein API-Key)
// ============================================================================
var radarMap = null, radarMarker = null, radarLayers = [], radarFrames = [];
var radarIdx = -1, radarPlayHandle = null;

// RainViewer-Tiles werden serverseitig nur bis Zoom ~10 erzeugt.
// Hoehere Zooms ergeben "Zoom Level not Supported"-Fehler-PNGs.
// Loesung: maxNativeZoom=10 -> Leaflet skaliert lokal hoch statt unsupported Tiles zu laden.
var RADAR_MAX_NATIVE_ZOOM = 10;

function initRadar(lat, lng) {
  var mapEl = document.getElementById("radar-map"); if (!mapEl) return;
  if (radarMap) { try { radarMap.remove(); } catch(e){} radarMap = null; }
  radarLayers = [];

  radarMap = L.map(mapEl, { zoomControl: true, attributionControl: false, maxZoom: 11 }).setView([lat, lng], 8);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 11, opacity: 0.85
  }).addTo(radarMap);
  radarMarker = L.circleMarker([lat, lng], {
    radius: 8, color: "#d946ef", fillColor: "#d946ef", fillOpacity: 0.85, weight: 3
  }).addTo(radarMap).bindTooltip("Veranstaltungsort", { permanent: false });

  // RainViewer index laden
  fetch("https://api.rainviewer.com/public/weather-maps.json")
    .then(function(r){ return r.json(); })
    .then(function(d) {
      var past = (d.radar && d.radar.past) || [];
      var future = (d.radar && d.radar.nowcast) || [];
      var frames = past.slice(-6).concat(future); // 6 Vergangenheit + alle Zukunft
      radarFrames = frames.map(function(f){
        return { time: f.time, path: f.path, host: d.host };
      });
      // Alle Frame-Layer SOFORT anlegen (opacity 0) -> echte Animation ohne Nachladen
      radarLayers = radarFrames.map(function(f) {
        var url = f.host + f.path + "/256/{z}/{x}/{y}/2/1_1.png";
        var layer = L.tileLayer(url, {
          opacity: 0,
          maxNativeZoom: RADAR_MAX_NATIVE_ZOOM,
          maxZoom: 11,
          tileSize: 256,
          crossOrigin: true,
          errorTileUrl: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
        });
        layer.addTo(radarMap);
        return layer;
      });
      var slider = document.getElementById("radar-slider");
      slider.max = String(Math.max(0, radarFrames.length - 1));
      // Default: aktuellster Vergangenheits-Frame (= last "past")
      radarIdx = Math.min(5, radarFrames.length - 1);
      slider.value = String(radarIdx);
      showRadarFrame(radarIdx);
      slider.addEventListener("input", function(){ stopRadarPlay(); showRadarFrame(parseInt(slider.value,10)); });
      document.getElementById("radar-play").addEventListener("click", toggleRadarPlay);
      // Auto-Start Animation nach 1.5s (Tiles haben Zeit zu laden)
      setTimeout(function(){ if (!radarPlayHandle) toggleRadarPlay(); }, 1500);
    })
    .catch(function(){
      document.getElementById("radar-frame-lbl").textContent = "Radar offline";
    });
}

function showRadarFrame(i) {
  if (i < 0 || i >= radarFrames.length) return;
  radarIdx = i;
  // Opacity-Switch: nur der aktive Layer ist sichtbar, alle anderen unsichtbar
  radarLayers.forEach(function(layer, idx) {
    layer.setOpacity(idx === i ? 0.7 : 0);
  });
  var f = radarFrames[i];
  var d = new Date(f.time * 1000);
  var now = Date.now() / 1000;
  var diffMin = Math.round((f.time - now) / 60);
  var rel = diffMin === 0 ? "jetzt" : (diffMin > 0 ? "in " + diffMin + " Min" : "vor " + Math.abs(diffMin) + " Min");
  document.getElementById("radar-frame-lbl").textContent = d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("radar-time-lbl").textContent = rel;
  document.getElementById("radar-slider").value = String(i);
}

function toggleRadarPlay() {
  if (radarPlayHandle) { stopRadarPlay(); return; }
  document.getElementById("radar-play").textContent = "⏸ Stopp";
  radarPlayHandle = setInterval(function() {
    var next = (radarIdx + 1) % radarFrames.length;
    showRadarFrame(next);
  }, 700);
}
function stopRadarPlay() {
  if (radarPlayHandle) { clearInterval(radarPlayHandle); radarPlayHandle = null; }
  var b = document.getElementById("radar-play"); if (b) b.textContent = "▶ Animation";
}

function loadHourlyForecast(lat, lng) {
  api("/api/einsatzzentrale/weather/hourly?lat=" + lat + "&lng=" + lng + "&hours=24").then(function(d) {
    var hours = d.hours || []; if (!hours.length) return;
    var maxPrecip = Math.max(0.5, Math.max.apply(null, hours.map(function(h){return h.precipitation_mm || 0;})));
    var html = '<div class="hourly-bars">';
    hours.forEach(function(h, i) {
      var t = new Date(h.time);
      var label = (i === 0) ? "jetzt" : t.getHours() + "h";
      var rain = h.precipitation_mm || 0;
      var prob = h.precipitation_prob || 0;
      var barH = Math.max(2, Math.round((rain / maxPrecip) * 38));
      var probCls = prob >= 70 ? "high" : prob >= 30 ? "mid" : "low";
      html += '<div class="hbar" title="' + esc(t.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})) +
              ' — ' + esc(h.weather_label) + ', ' + (rain.toFixed(1)) + 'mm, ' + prob + '%">' +
                '<div class="hbar-fill ' + probCls + '" style="height:' + barH + 'px;"></div>' +
                '<div class="hbar-label">' + label + '</div>' +
              '</div>';
    });
    html += '</div>';
    // Summary darunter
    var totalRain = hours.reduce(function(s,h){return s + (h.precipitation_mm || 0);}, 0);
    var maxProb = Math.max.apply(null, hours.map(function(h){return h.precipitation_prob || 0;}));
    html += '<div class="hourly-sum">' +
              '<span>Σ 24h: <b>' + totalRain.toFixed(1) + ' mm</b></span>' +
              '<span>Max-Wkt.: <b>' + maxProb + '%</b></span>' +
              '<span style="margin-left:auto;font-size:10px;color:#9ca3af;">Radar &amp; Daten: rainviewer.com · open-meteo.com</span>' +
            '</div>';
    document.getElementById("radar-hourly").innerHTML = html;
  }).catch(function(){});
}

function loadMultiDiary() {
  var pk = encodeURIComponent(state.order.primary_key);
  Promise.all([
    api("/api/orders/" + pk + "/diary"),
    api("/api/orders/" + pk + "/trupps")
  ]).then(function(res) {
    diaryState.entries = res[0].entries || [];
    diaryState.trupps = res[1].trupps || [];
    diaryState._summary = { open: res[0].open || 0, resolved: res[0].resolved || 0 };
    paintMultiDiary();
  }).catch(function(ex) {
    document.getElementById("multi-diary-entries").innerHTML = '<div class="alert error">' + esc(ex.message) + '</div>';
  });
}

function paintMultiDiary(data) {
  // data ist optional (wenn von loadDiary mit Summary-Payload aufgerufen)
  if (data && (data.open != null || data.resolved != null || data.in_progress != null)) {
    diaryState._summary = {
      open: data.open || 0,
      in_progress: data.in_progress || 0,
      resolved: data.resolved || 0
    };
  }
  var sum = diaryState._summary || { open: 0, in_progress: 0, resolved: 0 };
  var cntEl = document.getElementById("multi-diary-cnt");
  if (cntEl) cntEl.textContent =
    sum.open + " 🔴 · " + (sum.in_progress || 0) + " 🟡 · " + sum.resolved + " 🟢";

  // Trupps als richtige Karten (mit Pause/Bearbeiten/Loeschen) - wie im Portal
  var ta = document.getElementById("multi-diary-trupps");
  if (diaryState.trupps.length) {
    ta.innerHTML = '<div class="multi-trupps-wrap">' +
      diaryState.trupps.map(function(t) {
        var cls = !t.is_active ? "inactive" : (t.is_busy ? "busy" : "");
        var dotCls = !t.is_active ? "paused" : (t.is_busy ? "busy" : "free");
        var statusLbl = !t.is_active ? "Pause" : (t.is_busy ? "Unterwegs" : "Verfügbar");
        var members = (t.members || []).filter(Boolean).join(", ");
        return '<div class="multi-trupp-card ' + cls + '" data-id="' + esc(t.id) + '">' +
                 '<div class="mt-name"><span class="mt-status-dot ' + dotCls + '"></span>' + esc(t.name) +
                   '<span style="font-size:9px;color:var(--text-muted);font-weight:500;text-transform:uppercase;margin-left:auto;">' + statusLbl + '</span>' +
                 '</div>' +
                 (members ? '<div class="mt-members">👥 ' + esc(members) + '</div>' : '<div class="mt-members" style="font-style:italic;opacity:.6;">Keine Mitglieder</div>') +
                 '<div class="mt-actions">' +
                   '<button class="btn mt-pause" data-id="' + esc(t.id) + '">' + (t.is_active ? "⏸ Pause" : "▶ Aktivieren") + '</button>' +
                   '<button class="btn mt-edit"  data-id="' + esc(t.id) + '">✎ Bearbeiten</button>' +
                   '<button class="btn danger mt-del" data-id="' + esc(t.id) + '">🗑</button>' +
                 '</div>' +
               '</div>';
      }).join("") + '</div>';
    ta.querySelectorAll(".mt-pause").forEach(function(b){
      b.addEventListener("click", function(ev) { ev.stopPropagation();
        var t = diaryState.trupps.find(function(x){return x.id === b.dataset.id;});
        if (!t) return;
        var pk = encodeURIComponent(state.order.primary_key);
        api("/api/orders/" + pk + "/trupps/" + encodeURIComponent(t.id),
            { method: "PUT", body: { is_active: !t.is_active } }).then(loadMultiDiary).catch(function(ex){ alert(ex.message); });
      });
    });
    ta.querySelectorAll(".mt-edit").forEach(function(b){
      b.addEventListener("click", function(ev) { ev.stopPropagation();
        var t = diaryState.trupps.find(function(x){return x.id === b.dataset.id;});
        if (t) openTruppModal(t);
      });
    });
    ta.querySelectorAll(".mt-del").forEach(function(b){
      b.addEventListener("click", function(ev) { ev.stopPropagation();
        var t = diaryState.trupps.find(function(x){return x.id === b.dataset.id;});
        if (!t) return;
        if (!confirm("Trupp „" + t.name + "\" wirklich löschen?")) return;
        var pk = encodeURIComponent(state.order.primary_key);
        api("/api/orders/" + pk + "/trupps/" + encodeURIComponent(t.id),
            { method: "DELETE" }).then(loadMultiDiary).catch(function(ex){ alert(ex.message); });
      });
    });
  } else { ta.innerHTML = ""; }

  // Inline-Formular zum Anlegen einer Stoerung (immer sichtbar oben)
  paintMultiDiaryForm();

  // Filter anwenden: Suche + Status
  var q = (multiState.diarySearch || "").trim().toLowerCase();
  var status = multiState.diaryStatus || "all";
  var truppMap = {}; diaryState.trupps.forEach(function(t){ truppMap[t.id] = t; });

  var entries = diaryState.entries.filter(function(e) {
    if (status === "open" && e.status !== "open") return false;
    if (status === "in_progress" && e.status !== "in_progress") return false;
    if (status === "resolved" && e.status !== "resolved") return false;
    if (q) {
      var truppNames = (e.assigned_trupp_ids || []).map(function(tid){ var t = truppMap[tid]; return t ? t.name : ""; }).join(" ");
      var hay = [e.reason, e.caller_name, e.caller_phone, e.location, e.created_by_name,
                 e.resolved_by_name, e.resolved_note, truppNames]
                .filter(Boolean).join(" ").toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });

  var shownEl = document.getElementById("multi-diary-shown");
  if (shownEl) shownEl.textContent = entries.length + " von " + diaryState.entries.length;

  var area = document.getElementById("multi-diary-entries");
  if (!entries.length) {
    area.innerHTML = '<div class="empty" style="padding:24px;">' + (q || status !== "all" ? "Keine Treffer." : "Noch keine Einträge.") + '</div>';
    return;
  }
  var truppMapMD = {}; diaryState.trupps.forEach(function(t){ truppMapMD[t.id] = t; });
  area.innerHTML = entries.map(function(e) {
    var cls = e.status; // "open" | "in_progress" | "resolved"
    var truppNames = (e.assigned_trupp_ids || []).map(function(tid){ var t = truppMapMD[tid]; return t ? t.name : "?"; }).filter(Boolean);
    var badge =
      e.status === "resolved"    ? '<span class="badge bg-emerald">✓ Behoben</span>' :
      e.status === "in_progress" ? '<span class="badge bg-amber">● Unterwegs</span>' :
                                    '<span class="badge bg-red">● Offen</span>';
    // Inline-Trupp-Picker fuer offene Eintraege (horizontal, kompakt)
    var picker = "";
    if (e.status === "open") {
      var freeT = diaryState.trupps.filter(function(t){ return t.is_active; });
      if (freeT.length) {
        picker = '<div style="margin-top:6px;padding:6px 8px;background:#fff5f5;border:1px dashed #fecaca;border-radius:6px;">' +
          '<div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#dc2626;margin-bottom:4px;">🔴 Trupp zuweisen:</div>' +
          '<div style="display:flex;gap:4px;flex-wrap:wrap;">' +
          freeT.map(function(t) {
            var disabled = t.is_busy ? "disabled" : "";
            var bg = t.is_busy ? "background:#fef3c7;color:#92400e;opacity:.6;cursor:not-allowed;" : "background:#fff;cursor:pointer;";
            return '<button class="mmd-assign" data-id="' + esc(e.id) + '" data-tid="' + esc(t.id) + '" ' + disabled +
                   ' style="' + bg + 'border:1.5px solid var(--border);padding:5px 10px;font-size:11px;border-radius:6px;font-weight:600;font-family:inherit;">' +
                   esc(t.name) + (t.is_busy ? " (busy)" : "") + '</button>';
          }).join("") + '</div></div>';
      }
    }
    return '<div class="diary-entry ' + cls + '" data-entry-id="' + esc(e.id) + '" style="display:block;padding:10px 12px;margin-bottom:8px;">' +
              '<div class="e-top" style="margin-bottom:4px;display:flex;justify-content:space-between;">' +
                '<div class="e-time" style="font-size:11px;">🕐 ' + esc(fmtDateTime(e.created_at)) + '</div>' +
                '<div style="display:flex;gap:4px;">' + badge + (e.is_nachtrag ? '<span class="badge bg-amber">Nachtrag</span>' : '') + '</div>' +
              '</div>' +
              '<div style="font-size:13px;font-weight:600;margin-bottom:4px;">' + esc(e.reason) + '</div>' +
              '<div style="font-size:11px;color:var(--text-muted);display:flex;gap:8px;flex-wrap:wrap;">' +
                (e.caller_name ? '<span>👤 ' + esc(e.caller_name) + '</span>' : '') +
                (e.caller_phone ? '<span>📞 ' + esc(e.caller_phone) + '</span>' : '') +
                (e.location ? '<span>📍 ' + esc(e.location) + '</span>' : '') +
                (truppNames.length ? '<span>👥 ' + esc(truppNames.join(", ")) + '</span>' : '') +
              '</div>' +
              picker +
              (e.status === "resolved" && e.resolved_at
                ? '<div class="e-resolved-info" style="font-size:11px;margin-top:4px;">✓ ' + esc(fmtDateTime(e.resolved_at)) +
                  (e.resolved_by_name ? ' · ' + esc(e.resolved_by_name) : '') +
                  ' · Dauer: ' + esc(fmtDuration(e.created_at, e.resolved_at)) + '</div>'
                : '') +
              '<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;">' +
                (e.status === "in_progress"
                  ? '<button class="btn sm success multi-e-resolve" data-id="' + esc(e.id) + '" style="height:26px;font-size:11px;padding:0 10px;">✓ Behoben</button>' +
                    '<button class="btn sm multi-e-unassign" data-id="' + esc(e.id) + '" style="height:26px;font-size:11px;padding:0 8px;">↺ Trupp ab</button>'
                  : '') +
                (e.status === "open"
                  ? '<button class="btn sm success multi-e-resolve" data-id="' + esc(e.id) + '" style="height:26px;font-size:11px;padding:0 8px;">✓ Direkt behoben</button>'
                  : '') +
                (e.status === "resolved"
                  ? '<button class="btn sm warn multi-e-reopen" data-id="' + esc(e.id) + '" style="height:26px;font-size:11px;padding:0 8px;">↺ Wieder öffnen</button>'
                  : '') +
                '<button class="btn sm multi-e-edit" data-id="' + esc(e.id) + '" style="height:26px;font-size:11px;padding:0 8px;">Bearbeiten</button>' +
                '<button class="btn sm danger multi-e-del" data-id="' + esc(e.id) + '" style="height:26px;font-size:11px;padding:0 8px;">Löschen</button>' +
              '</div>' +
            '</div>';
  }).join("");

  // Inline-Picker-Buttons verdrahten
  area.querySelectorAll(".mmd-assign").forEach(function(btn) {
    btn.addEventListener("click", function() {
      if (btn.disabled) return;
      var pk = encodeURIComponent(state.order.primary_key);
      var entry = diaryState.entries.find(function(x){ return x.id === btn.dataset.id; });
      var ids = entry ? (entry.assigned_trupp_ids || []).slice() : [];
      if (ids.indexOf(btn.dataset.tid) === -1) ids.push(btn.dataset.tid);
      btn.disabled = true; btn.style.opacity = ".5";
      api("/api/orders/" + pk + "/diary/" + encodeURIComponent(btn.dataset.id),
          { method: "PUT", body: { assigned_trupp_ids: ids } })
        .then(loadMultiDiary)
        .catch(function(ex){ alert("Fehler: " + ex.message); btn.disabled = false; btn.style.opacity = ""; });
    });
  });
  area.querySelectorAll(".multi-e-unassign").forEach(function(btn) {
    btn.addEventListener("click", function() {
      if (!confirm("Trupp wieder abziehen?")) return;
      var pk = encodeURIComponent(state.order.primary_key);
      api("/api/orders/" + pk + "/diary/" + encodeURIComponent(btn.dataset.id),
          { method: "PUT", body: { assigned_trupp_ids: [] } })
        .then(loadMultiDiary).catch(function(ex){ alert(ex.message); });
    });
  });
  area.querySelectorAll(".multi-e-resolve").forEach(function(b){ b.addEventListener("click", function(){ resolveEntry(b.dataset.id).then(loadMultiDiary).catch(function(){}); }); });
  area.querySelectorAll(".multi-e-reopen").forEach(function(b){ b.addEventListener("click", function(){ reopenEntry(b.dataset.id).then(loadMultiDiary).catch(function(){}); }); });
  area.querySelectorAll(".multi-e-edit").forEach(function(b){ b.addEventListener("click", function(){
    var e = diaryState.entries.find(function(x){return x.id === b.dataset.id;});
    if (e) openEntryModal(e);
  }); });
  area.querySelectorAll(".multi-e-del").forEach(function(b){ b.addEventListener("click", function(){
    if (!confirm("Diesen Eintrag wirklich löschen?")) return;
    var pk = encodeURIComponent(state.order.primary_key);
    api("/api/orders/" + pk + "/diary/" + encodeURIComponent(b.dataset.id), { method: "DELETE" })
      .then(loadMultiDiary).catch(function(ex){ alert("Fehler: " + ex.message); });
  }); });
}

// Inline-Formular fuer neue Stoerung (immer sichtbar im Multi-Diary-Pane)
function paintMultiDiaryForm() {
  var host = document.getElementById("multi-diary-form"); if (!host) return;
  // Wir bauen die Form nur EINMAL (sonst gehen Eingaben beim Auto-Refresh verloren).
  // Nur die Trupp-Pills werden bei Bedarf aktualisiert.
  if (host.dataset.built === "1") {
    paintMultiDiaryFormTrupps(host);
    return;
  }
  host.dataset.built = "1";
  host.innerHTML =
    '<div class="multi-diary-form-card">' +
      '<div class="mdf-head" id="mdf-toggle">' +
        '<h4>📞 Neue Störung anlegen</h4>' +
        '<span class="mdf-toggle" id="mdf-toggle-lbl">▼ einklappen</span>' +
      '</div>' +
      '<div id="mdf-body">' +
        '<div class="mdf-grid">' +
          '<div><div class="mdf-label">Anrufer/Gast</div><input type="text" id="mdf-name" placeholder="Name" autocomplete="off" /></div>' +
          '<div><div class="mdf-label">Telefon</div><input type="tel" id="mdf-phone" placeholder="Telefonnummer" autocomplete="off" /></div>' +
          '<div class="mdf-fullrow"><div class="mdf-label">Standort / Position</div><input type="text" id="mdf-loc" placeholder="z.B. Verteiler 3, Festzelt…" autocomplete="off" /></div>' +
          '<div class="mdf-fullrow"><div class="mdf-label">Grund / Beschreibung *</div><textarea id="mdf-reason" placeholder="Was ist passiert?" required></textarea></div>' +
          '<div class="mdf-fullrow"><div class="mdf-label">Trupp zuweisen</div><div class="mdf-trupps" id="mdf-trupps"></div></div>' +
        '</div>' +
        '<div class="mdf-actions">' +
          '<span class="mdf-err" id="mdf-err"></span>' +
          '<label style="font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:4px;cursor:pointer;">' +
            '<input type="checkbox" id="mdf-nachtrag" /> Nachtrag</label>' +
          '<button class="btn" id="mdf-clear">Zurücksetzen</button>' +
          '<button class="btn primary" id="mdf-submit">+ Anlegen</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  // Collapse-Toggle
  document.getElementById("mdf-toggle").addEventListener("click", function() {
    var body = document.getElementById("mdf-body");
    var lbl = document.getElementById("mdf-toggle-lbl");
    var collapsed = body.style.display === "none";
    body.style.display = collapsed ? "" : "none";
    lbl.textContent = collapsed ? "▼ einklappen" : "▲ ausklappen";
  });

  // Header "+ Störung"-Button: scrollt zur Form und fokussiert Textarea
  var headerBtn = document.getElementById("multi-diary-new");
  if (headerBtn) {
    headerBtn.onclick = function() {
      var body = document.getElementById("mdf-body");
      if (body && body.style.display === "none") {
        body.style.display = "";
        document.getElementById("mdf-toggle-lbl").textContent = "▼ einklappen";
      }
      var r = document.getElementById("mdf-reason");
      if (r) { r.focus(); r.scrollIntoView({ behavior: "smooth", block: "center" }); }
    };
  }

  document.getElementById("mdf-clear").addEventListener("click", function() {
    document.getElementById("mdf-name").value = "";
    document.getElementById("mdf-phone").value = "";
    document.getElementById("mdf-loc").value = "";
    document.getElementById("mdf-reason").value = "";
    document.getElementById("mdf-nachtrag").checked = false;
    document.querySelectorAll("#mdf-trupps button.on").forEach(function(b){ b.classList.remove("on"); });
    document.getElementById("mdf-err").textContent = "";
  });

  document.getElementById("mdf-submit").addEventListener("click", function(ev) {
    ev.preventDefault();
    var reason = document.getElementById("mdf-reason").value.trim();
    var errEl = document.getElementById("mdf-err"); errEl.textContent = "";
    if (!reason) { errEl.textContent = "Grund/Beschreibung ist erforderlich."; return; }
    var selIds = Array.from(document.querySelectorAll("#mdf-trupps button.on")).map(function(b){ return b.dataset.id; });
    var payload = {
      caller_name: document.getElementById("mdf-name").value,
      caller_phone: document.getElementById("mdf-phone").value,
      location: document.getElementById("mdf-loc").value,
      reason: reason,
      is_nachtrag: document.getElementById("mdf-nachtrag").checked,
      assigned_trupp_ids: selIds
    };
    var btn = document.getElementById("mdf-submit");
    btn.disabled = true; var oldTxt = btn.textContent; btn.textContent = "Speichere…";
    var pk = encodeURIComponent(state.order.primary_key);
    api("/api/orders/" + pk + "/diary", { method: "POST", body: payload })
      .then(function() {
        // Reset und Liste neu laden
        document.getElementById("mdf-clear").click();
        btn.disabled = false; btn.textContent = oldTxt;
        loadMultiDiary();
      })
      .catch(function(ex) { errEl.textContent = ex.message; btn.disabled = false; btn.textContent = oldTxt; });
  });

  paintMultiDiaryFormTrupps(host);
}

function paintMultiDiaryFormTrupps(host) {
  var pickEl = host.querySelector("#mdf-trupps"); if (!pickEl) return;
  // Aktive Auswahl merken (User hat ggf. schon Trupps angeklickt)
  var prevSel = new Set(Array.from(pickEl.querySelectorAll("button.on")).map(function(b){ return b.dataset.id; }));
  var active = diaryState.trupps.filter(function(t){ return t.is_active; });
  if (!active.length) {
    pickEl.innerHTML = '<span style="font-size:11px;color:var(--text-muted);font-style:italic;">Keine aktiven Trupps – „+ Trupp" klicken</span>';
    return;
  }
  pickEl.innerHTML = active.map(function(t) {
    var on = prevSel.has(t.id) ? " on" : "";
    var busy = t.is_busy ? " busy" : "";
    return '<button type="button" class="' + on + busy + '" data-id="' + esc(t.id) + '">' + esc(t.name) + (t.is_busy ? " (unterwegs)" : "") + '</button>';
  }).join("");
  pickEl.querySelectorAll("button").forEach(function(b) {
    b.addEventListener("click", function(ev) { ev.preventDefault(); b.classList.toggle("on"); });
  });
}

function loadMultiArtikel() {
  var pk = encodeURIComponent(state.order.primary_key);
  api("/api/orders/epirent/" + pk + "/assets").then(function(data) {
    artikelState.items = data.assets || [];
    // Typ-Filter befüllen
    var types = {};
    artikelState.items.forEach(function(a){ if (a.asset_type) types[a.asset_type] = (types[a.asset_type] || 0) + 1; });
    var sel = document.getElementById("multi-art-type");
    if (sel) {
      var prev = multiState.artType || "all";
      sel.innerHTML = '<option value="all">Alle Typen (' + artikelState.items.length + ')</option>' +
        Object.keys(types).sort().map(function(t){ return '<option value="' + esc(t) + '">' + esc(t) + ' (' + types[t] + ')</option>'; }).join("");
      // Auswahl behalten wenn der Typ noch existiert
      sel.value = (prev === "all" || types[prev]) ? prev : "all";
      multiState.artType = sel.value;
    }
    paintMultiArt();
  }).catch(function(ex) {
    document.getElementById("multi-art-list").innerHTML = '<div class="alert error">' + esc(ex.message) + '</div>';
  });
}

function paintMultiArt() {
  var q = (multiState.artSearch || "").trim().toLowerCase();
  var ftype = multiState.artType || "all";
  var fstatus = multiState.artStatus || "all";
  var items = artikelState.items.filter(function(a) {
    if (ftype !== "all" && a.asset_type !== ftype) return false;
    if (fstatus !== "all" && (a.status || "placed") !== fstatus) return false;
    if (q) {
      // Kommentartext mit in den Suchindex
      var commentText = (a.comments || []).map(function(c){ return (c.text || "") + " " + (c.author_name || ""); }).join(" ");
      var hay = [a.label, a.asset_type, a.plus_code, a.created_by, a.created_by_name,
                 a.latitude, a.longitude, commentText].filter(function(v){ return v != null && v !== ""; }).join(" ").toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });

  var cntEl = document.getElementById("multi-art-cnt");
  if (cntEl) cntEl.textContent = artikelState.items.length + " Artikel";
  var shownEl = document.getElementById("multi-art-shown");
  if (shownEl) shownEl.textContent = items.length + " von " + artikelState.items.length;

  var area = document.getElementById("multi-art-list");
  if (!items.length) {
    area.innerHTML = '<div class="empty" style="padding:24px;">' + (q || ftype !== "all" || fstatus !== "all" ? "Keine Treffer." : "Keine Artikel.") + '</div>';
    return;
  }
  area.innerHTML = items.map(function(a) {
    var ic = _artikelIcon(a.asset_type);
    var status = a.status || "placed";
    var statusLbl = status === "dismantled" ? "Abgebaut" : "Gestellt";
    var cmtCount = (a.comments || []).length;
    // Treffer-Snippet bei Suche im Kommentartext anzeigen
    var snippet = "";
    if (q && cmtCount) {
      var hit = (a.comments || []).find(function(c){ return (c.text || "").toLowerCase().indexOf(q) > -1; });
      if (hit) {
        var t = (hit.text || "").trim();
        if (t.length > 90) {
          var pos = t.toLowerCase().indexOf(q);
          var start = Math.max(0, pos - 30); var end = Math.min(t.length, pos + q.length + 50);
          t = (start > 0 ? "…" : "") + t.substring(start, end) + (end < t.length ? "…" : "");
        }
        snippet = '<div style="margin-top:4px;font-size:11px;color:#475569;font-style:italic;background:#fef9c3;padding:4px 8px;border-radius:6px;">💬 ' + esc(t) + '</div>';
      }
    }
    return '<div class="art-row ' + (status === "dismantled" ? "dismantled" : "") + '" data-asset-id="' + esc(a.id) + '" style="padding:8px 4px;">' +
             '<div class="art-type-icon ' + ic.cls + '" style="width:32px;height:32px;font-size:14px;border-radius:8px;">' + ic.icon + '</div>' +
             '<div class="art-row-text">' +
               '<div class="art-row-label" style="font-size:13px;">' + esc(a.label || "?") + '</div>' +
               '<div class="art-row-meta" style="font-size:10px;">' +
                 '<span>' + esc(a.asset_type || "") + '</span>' +
                 (a.plus_code ? '<span>📍 ' + esc(a.plus_code) + '</span>' : '') +
                 (cmtCount ? '<span>💬 ' + cmtCount + '</span>' : '') +
               '</div>' +
               snippet +
             '</div>' +
             '<div class="art-status-badge ' + status + '">' + statusLbl + '</div>' +
           '</div>';
  }).join("");
  area.querySelectorAll(".art-row").forEach(function(row) {
    row.addEventListener("click", function() {
      var a = artikelState.items.find(function(x){return x.id === row.dataset.assetId;});
      if (a) openArtikelDetail(a);
    });
  });

  // Karten-Marker neu rendern (gefilterte Items)
  if (multiState.map) {
    multiState.markers.forEach(function(m){ try { multiState.map.removeLayer(m); } catch(e){} });
    multiState.markers = [];
    var bounds = [];
    items.forEach(function(a) {
      if (typeof a.latitude !== "number" || !isFinite(a.latitude)) return;
      if (typeof a.longitude !== "number" || !isFinite(a.longitude)) return;
      var ic = _artikelIcon(a.asset_type);
      var color = ic.cls === "generator" ? "#ea580c" :
                  ic.cls === "verteiler" ? "#16a34a" :
                  ic.cls === "lichtmast" ? "#ca8a04" :
                  ic.cls === "tank"      ? "#0891b2" : "#6b7280";
      var m = L.circleMarker([a.latitude, a.longitude], {
        radius: 9, color: "#fff", fillColor: color, fillOpacity: 0.95, weight: 2.5
      }).addTo(multiState.map);
      m.bindTooltip('<b>' + esc(a.label || "?") + '</b><br>' + esc(a.asset_type || ""), { direction: "top" });
      m.on("click", function(){ openArtikelDetail(a); });
      multiState.markers.push(m);
      bounds.push([a.latitude, a.longitude]);
    });
    // Auto-Fit nur wenn mehr als 0 Marker und keine User-Zoom-Aktion stattfand
    if (bounds.length && !multiState._userZoomed) {
      try { multiState.map.fitBounds(bounds, { padding: [25, 25], maxZoom: 17 }); } catch (e) {}
    }
  }
}

var maschState = { items: [], search: "", filterStatus: "all", sort: "name_asc" };

function _fuelClass(pct) {
  if (pct == null) return "";
  if (pct >= 50) return "fuel-high";
  if (pct >= 25) return "fuel-mid";
  return "fuel-low";
}

function renderMaschinenPanel() {
  var o = state.order; if (!o) { state.phase = "workspace"; render(); return; }
  var root = document.getElementById("root"); root.innerHTML = "";
  root.appendChild($(
    '<div>' + renderHeader("Auftrag #" + (o.order_no || o.primary_key) + " · Maschinenliste") +
    '<main class="kiosk-main">' +
      '<div class="masch-toolbar">' +
        '<button id="tile-back" class="btn">← Zurück</button>' +
        '<div class="kiosk-search">' +
          '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke-width="2"/><path stroke-width="2" stroke-linecap="round" d="m20 20-3-3"/></svg>' +
          '<input id="masch-search" placeholder="Suchen: Name, Modell, Serien-Nr…" autocomplete="off" />' +
        '</div>' +
        '<select id="masch-status">' +
          '<option value="all">Alle Status</option>' +
          '<option value="online">Online</option>' +
          '<option value="offline">Offline</option>' +
        '</select>' +
        '<select id="masch-sort">' +
          '<option value="name_asc">Name ↑ (A–Z)</option>' +
          '<option value="name_desc">Name ↓ (Z–A)</option>' +
          '<option value="fuel_asc">Tankstand ↑ (niedrig zuerst)</option>' +
          '<option value="fuel_desc">Tankstand ↓ (voll zuerst)</option>' +
          '<option value="power_desc">Leistung ↓ (höchste zuerst)</option>' +
          '<option value="dist_asc">Distanz ↑ (nächste zuerst)</option>' +
          '<option value="status">Online zuerst</option>' +
        '</select>' +
        '<div class="count" id="masch-count">…</div>' +
      '</div>' +
      '<div id="masch-area"><div class="empty"><div class="spinner" style="margin:0 auto"></div></div></div>' +
    '</main></div>'
  ));
  attachLogout();
  document.getElementById("tile-back").addEventListener("click", function(){ state.activeTile = null; state.phase = "workspace"; render(); });
  document.getElementById("masch-search").addEventListener("input", function(e){ maschState.search = e.target.value; paintMaschinen(); });
  document.getElementById("masch-status").addEventListener("change", function(e){ maschState.filterStatus = e.target.value; paintMaschinen(); });
  document.getElementById("masch-sort").addEventListener("change", function(e){ maschState.sort = e.target.value; paintMaschinen(); });
  document.getElementById("masch-sort").value = maschState.sort;

  loadMaschinen();
  // Auto-Refresh alle 30s (Telemetrie ist live)
  if (maschState.autoRefresh) clearInterval(maschState.autoRefresh);
  maschState.autoRefresh = setInterval(function() {
    if (state.activeTile === "maschinen") loadMaschinen(true);
    else { clearInterval(maschState.autoRefresh); maschState.autoRefresh = null; }
  }, 30000);
}

function loadMaschinen(silent) {
  var pk = encodeURIComponent(state.order.primary_key);
  api("/api/orders/epirent/" + pk + "/generators").then(function(data) {
    maschState.items = data.generators || [];
    paintMaschinen();
  }).catch(function(ex) {
    if (!silent) document.getElementById("masch-area").innerHTML = '<div class="alert error">' + esc(ex.message) + '</div>';
  });
}

function paintMaschinen() {
  var q = (maschState.search || "").trim().toLowerCase();
  var items = maschState.items.filter(function(g) {
    if (maschState.filterStatus === "online" && g.status !== "online") return false;
    if (maschState.filterStatus === "offline" && g.status === "online") return false;
    if (q) {
      var hay = [g.name, g.model, g.serial_number].filter(Boolean).join(" ").toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });

  // Sortieren
  var s = maschState.sort;
  items.sort(function(a, b) {
    var fa = (a.latest_telemetry && a.latest_telemetry.fuel_level);
    var fb = (b.latest_telemetry && b.latest_telemetry.fuel_level);
    var pa = (a.latest_telemetry && a.latest_telemetry.power_kw) || 0;
    var pb = (b.latest_telemetry && b.latest_telemetry.power_kw) || 0;
    var da = a.distance_km == null ? 9999 : a.distance_km;
    var db = b.distance_km == null ? 9999 : b.distance_km;
    if (s === "name_asc")  return (a.name || "").localeCompare(b.name || "", "de", {numeric:true});
    if (s === "name_desc") return (b.name || "").localeCompare(a.name || "", "de", {numeric:true});
    if (s === "fuel_asc")  return (fa == null ? 999 : fa) - (fb == null ? 999 : fb);
    if (s === "fuel_desc") return (fb == null ? -1 : fb) - (fa == null ? -1 : fa);
    if (s === "power_desc") return pb - pa;
    if (s === "dist_asc") return da - db;
    if (s === "status") {
      var ao = a.status === "online" ? 0 : 1, bo = b.status === "online" ? 0 : 1;
      if (ao !== bo) return ao - bo;
      return (a.name || "").localeCompare(b.name || "", "de", {numeric:true});
    }
    return 0;
  });

  var area = document.getElementById("masch-area");
  var countEl = document.getElementById("masch-count");
  if (countEl) countEl.textContent = items.length + " von " + maschState.items.length + " Maschinen";

  if (!items.length) {
    area.innerHTML = '<div class="empty" style="padding:48px;">' +
      (maschState.items.length === 0 ? "Keine Generatoren im Radius zugeordnet. Im React-Portal Radius prüfen oder manuell zuordnen." : "Keine Treffer für aktuellen Filter.") +
      '</div>';
    return;
  }

  area.innerHTML = '<div class="masch-grid">' + items.map(function(g) {
    var tel = g.latest_telemetry || {};
    var fuel = tel.fuel_level;
    var power = tel.power_kw;
    var fuelCls = _fuelClass(fuel);
    var online = g.status === "online";
    return '<div class="masch-card ' + (online ? "" : "offline") + '" data-gen-id="' + esc(g.id) + '">' +
             '<div class="masch-top">' +
               '<div style="flex:1;min-width:0;">' +
                 '<div class="masch-name">' + esc(g.name || "(ohne Name)") + '</div>' +
                 '<div class="masch-sub">' +
                   (g.serial_number ? esc(g.serial_number) : "") +
                   (g.serial_number && g.model ? " · " : "") +
                   (g.model ? esc(g.model) : "") +
                 '</div>' +
                 '<div class="masch-tags">' +
                   (g.is_manual ? '<span class="masch-tag">Manuell</span>' : '') +
                   (g.distance_km != null ? '<span class="masch-tag dist">' + g.distance_km.toFixed(1) + ' km entfernt</span>' : '') +
                 '</div>' +
               '</div>' +
               '<div class="masch-status-dot ' + (online ? "online" : "offline") + '" title="' + (online ? "Online" : "Offline") + '"></div>' +
             '</div>' +
             '<div class="masch-metrics">' +
               '<div class="masch-met fuel">' +
                 '<div class="lbl">Tankstand</div>' +
                 (fuel == null
                   ? '<div class="val" style="color:#9ca3af;">— %</div>'
                   : '<div class="val ' + fuelCls + '">' + Math.round(fuel) + ' %</div>' +
                     '<div class="fuel-bar"><div class="' + fuelCls + '" style="width:' + Math.max(0, Math.min(100, fuel)) + '%;"></div></div>') +
               '</div>' +
               '<div class="masch-met">' +
                 '<div class="lbl">Leistung</div>' +
                 (power != null ? '<div class="val">' + power.toFixed(1) + ' kW</div>' : '<div class="val" style="color:#9ca3af;">— kW</div>') +
               '</div>' +
             '</div>' +
           '</div>';
  }).join("") + '</div>';

  area.querySelectorAll(".masch-card").forEach(function(card) {
    card.addEventListener("click", function() {
      var g = maschState.items.find(function(x){return x.id === card.dataset.genId;});
      if (g) openMaschinenDetail(g);
    });
  });
}

function loadDocs() {

    paintDocs();
  }).catch(function(ex) {
    document.getElementById("docs-content").innerHTML = '<div class="alert error">' + esc(ex.message) + '</div>';
  });
}

function paintDocs() {
  var content = document.getElementById("docs-content");
  var countEl = document.getElementById("docs-count");
  var total = docsState.docs.length;

  if (!docsState.cat) {
    // Kategorie-Uebersicht
    if (countEl) countEl.textContent = total + " Dokument" + (total === 1 ? "" : "e") + " gesamt";
    var html = '<div class="docs-cats">';
    DOC_CATS.forEach(function(c) {
      var cnt = docsState.docs.filter(function(d){return d.kategorie === c.key;}).length;
      html += '<button class="docs-cat" data-cat="' + c.key + '">' +
                '<div class="cat-ic ' + c.key + '">' + c.icon + '</div>' +
                '<div class="cat-text"><div class="cat-name">' + esc(c.label) + '</div>' +
                  '<div class="cat-count">' + cnt + " Dokument" + (cnt === 1 ? "" : "e") + '</div></div>' +
                '<div class="cat-chev">›</div>' +
              '</button>';
    });
    html += '</div>';
    content.innerHTML = html;
    content.querySelectorAll(".docs-cat").forEach(function(b) {
      b.addEventListener("click", function() { docsState.cat = b.dataset.cat; renderDocsPanel(); });
    });
  } else {
    // Liste in Kategorie
    var docs = docsState.docs.filter(function(d){return d.kategorie === docsState.cat;});
    if (countEl) countEl.textContent = docs.length + " Dokument" + (docs.length === 1 ? "" : "e");
    if (!docs.length) {
      content.innerHTML = '<div class="empty" style="padding:48px;">Noch keine Dokumente in dieser Kategorie. Lade eines hoch ⤒</div>';
      return;
    }
    var pk = encodeURIComponent(state.order.primary_key);
    var tokenQ = encodeURIComponent(state.token || "");
    var html = '<div class="docs-grid">';
    docs.forEach(function(d) {
      var isPdf = (d.content_type || "").indexOf("pdf") > -1;
      var isImg = (d.content_type || "").indexOf("image/") === 0;
      var thumb;
      if (isImg) {
        thumb = '<img src="/api/orders/order-documents/' + pk + '/' + encodeURIComponent(d.id) + '/file?token=' + tokenQ + '&thumbnail=1&size=320" alt="" />';
      } else if (isPdf) {
        thumb = '📕';
      } else {
        thumb = '📄';
      }
      var sizeKb = d.size ? Math.round(d.size / 1024) : 0;
      var sizeStr = sizeKb > 1024 ? (sizeKb/1024).toFixed(1) + " MB" : sizeKb + " KB";
      html += '<div class="docs-card" data-doc-id="' + esc(d.id) + '">' +
                '<div class="docs-thumb' + (isPdf ? " pdf" : "") + '">' + thumb + '</div>' +
                '<div class="docs-info">' +
                  '<div class="name" title="' + esc(d.original_name) + '">' + esc(d.original_name) + '</div>' +
                  '<div class="meta"><span>' + sizeStr + '</span>' +
                    (d.uploaded_by ? '<span>· ' + esc(d.uploaded_by) + '</span>' : '') +
                  '</div>' +
                '</div>' +
              '</div>';
    });
    html += '</div>';
    content.innerHTML = html;
    content.querySelectorAll(".docs-card").forEach(function(card) {
      card.addEventListener("click", function() {
        var d = docsState.docs.find(function(x){return x.id === card.dataset.docId;});
        if (d) openDocViewer(d);
      });
    });
  }
}

function uploadDocs(files, forcedCategory) {
  if (!files || !files.length) return;
  var dz = document.getElementById("docs-dropzone");
  dz.classList.add("uploading");
  var origHtml = dz.innerHTML;
  var pk = encodeURIComponent(state.order.primary_key);
  var done = 0, total = files.length, errors = [];
  files.forEach(function(file) {
    var fd = new FormData();
    fd.append("file", file);
    // Wenn user gerade in einer Kategorie ist, dort einsortieren - außer
    // bei Kamera-Foto (das forciert "fotos")
    var kat = forcedCategory || docsState.cat;
    if (kat) fd.append("kategorie", kat);
    fetch(BACKEND + "/api/orders/order-documents/" + pk, {
      method: "POST",
      headers: { "Authorization": "Bearer " + state.token },
      body: fd
    }).then(function(r) {
      if (!r.ok) return r.json().then(function(e){ throw new Error(e.detail || "HTTP " + r.status); });
      return r.json();
    }).then(function(){ done++; if (done === total) finish(); }).catch(function(ex){ errors.push(file.name + ": " + ex.message); done++; if (done === total) finish(); });
  });
  function finish() {
    dz.classList.remove("uploading");
    dz.innerHTML = origHtml;
    loadDocs();
    if (errors.length) alert("Fehler bei Upload:\n\n" + errors.join("\n"));
  }
  // Progress-Anzeige
  dz.innerHTML = '<div class="dz-icon"><div class="spinner"></div></div>' +
                 '<div class="dz-title">Lade ' + total + ' Datei' + (total === 1 ? "" : "en") + ' hoch…</div>' +
                 '<div class="dz-hint">Bitte warten</div>';
}

function initImageZoom(bg) {
  var stage = bg.querySelector("#img-stage");
  var img = bg.querySelector("#img-el");
  var scale = 1, tx = 0, ty = 0;
  var dragging = false, lastX = 0, lastY = 0;
  var pinchDist = 0;

  function apply() {
    img.style.transform = "translate(calc(-50% + " + tx + "px), calc(-50% + " + ty + "px)) scale(" + scale + ")";
  }
  function setScale(newScale, cx, cy) {
    newScale = Math.max(0.2, Math.min(8, newScale));
    if (cx == null) { cx = stage.clientWidth / 2; cy = stage.clientHeight / 2; }
    // Zoom relativ zur Mausposition
    var rect = stage.getBoundingClientRect();
    var dx = cx - rect.left - stage.clientWidth / 2;
    var dy = cy - rect.top - stage.clientHeight / 2;
    var f = newScale / scale;
    tx = (tx - dx) * f + dx;
    ty = (ty - dy) * f + dy;
    scale = newScale;
    apply();
  }
  apply();

  // Wheel-Zoom
  stage.addEventListener("wheel", function(e) {
    e.preventDefault();
    var factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    setScale(scale * factor, e.clientX, e.clientY);
  }, { passive: false });
  // Drag-Pan
  stage.addEventListener("pointerdown", function(e) {
    dragging = true; lastX = e.clientX; lastY = e.clientY; stage.classList.add("dragging");
    try { stage.setPointerCapture(e.pointerId); } catch(_){}
  });
  stage.addEventListener("pointermove", function(e) {
    if (!dragging) return;
    tx += e.clientX - lastX; ty += e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; apply();
  });
  stage.addEventListener("pointerup", function(){ dragging = false; stage.classList.remove("dragging"); });
  stage.addEventListener("pointercancel", function(){ dragging = false; stage.classList.remove("dragging"); });
  // Doppelklick = Toggle Zoom 1x / 3x
  stage.addEventListener("dblclick", function(e) { setScale(scale > 1.1 ? 1 : 3, e.clientX, e.clientY); });
  // Touch-Pinch via TouchEvents (fallback)
  stage.addEventListener("touchmove", function(e) {
    if (e.touches.length === 2) {
      e.preventDefault();
      var t1 = e.touches[0], t2 = e.touches[1];
      var d = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
      if (pinchDist) {
        var f = d / pinchDist;
        var cx = (t1.clientX + t2.clientX) / 2, cy = (t1.clientY + t2.clientY) / 2;
        setScale(scale * f, cx, cy);
      }
      pinchDist = d;
    }
  }, { passive: false });
  stage.addEventListener("touchend", function(){ pinchDist = 0; });

  // Button-Controls
  bg.querySelector("#v-zoom-in").addEventListener("click", function(){ setScale(scale * 1.3); });
  bg.querySelector("#v-zoom-out").addEventListener("click", function(){ setScale(scale / 1.3); });
  bg.querySelector("#v-zoom-reset").addEventListener("click", function(){ scale = 1; tx = 0; ty = 0; apply(); });
}

function loadArtikel() {
  var pk = encodeURIComponent(state.order.primary_key);
  api("/api/orders/epirent/" + pk + "/assets").then(function(data) {
    artikelState.items = data.assets || [];
    // Typ-Filter befüllen
    var types = {};
    artikelState.items.forEach(function(a){ if (a.asset_type) types[a.asset_type] = (types[a.asset_type] || 0) + 1; });
    var sel = document.getElementById("art-type"); if (sel) {
      sel.innerHTML = '<option value="all">Alle Typen (' + artikelState.items.length + ')</option>' +
        Object.keys(types).sort().map(function(t){ return '<option value="' + esc(t) + '">' + esc(t) + ' (' + types[t] + ')</option>'; }).join("");
    }
    paintArtikel();
  }).catch(function(ex) {
    document.getElementById("art-list-body").innerHTML = '<div class="alert error">' + esc(ex.message) + '</div>';
  });
}

function paintArtikel() {
  var q = (artikelState.search || "").trim().toLowerCase();
  var items = artikelState.items.filter(function(a) {
    if (artikelState.filterType !== "all" && a.asset_type !== artikelState.filterType) return false;
    if (artikelState.filterStatus !== "all" && (a.status || "placed") !== artikelState.filterStatus) return false;
    if (q) {
      var hay = [a.label, a.asset_type, a.plus_code, a.created_by].filter(Boolean).join(" ").toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });

  // Liste
  var head = document.getElementById("art-list-head");
  var body = document.getElementById("art-list-body");
  var countEl = document.getElementById("art-count");
  if (countEl) countEl.textContent = items.length + " von " + artikelState.items.length + " Artikeln";
  if (head) head.textContent = items.length + " Artikel" + (items.length !== artikelState.items.length ? " (gefiltert von " + artikelState.items.length + ")" : "");
  if (!items.length) {
    body.innerHTML = '<div class="empty" style="padding:32px;">Keine Artikel gefunden.</div>';
  } else {
    body.innerHTML = items.map(function(a) {
      var ic = _artikelIcon(a.asset_type);
      var status = a.status || "placed";
      var statusLbl = status === "dismantled" ? "Abgebaut" : "Gestellt";
      var cmtCount = (a.comments || []).length;
      return '<div class="art-row ' + (status === "dismantled" ? "dismantled" : "") + '" data-asset-id="' + esc(a.id) + '">' +
               '<div class="art-type-icon ' + ic.cls + '">' + ic.icon + '</div>' +
               '<div class="art-row-text">' +
                 '<div class="art-row-label">' + esc(a.label || "(ohne Bezeichnung)") + '</div>' +
                 '<div class="art-row-meta">' +
                   '<span>' + esc(a.asset_type || "Typ?") + '</span>' +
                   (a.plus_code ? '<span>📍 ' + esc(a.plus_code) + '</span>' : '') +
                   (cmtCount ? '<span>💬 ' + cmtCount + '</span>' : '') +
                 '</div>' +
               '</div>' +
               '<div class="art-status-badge ' + status + '">' + statusLbl + '</div>' +
             '</div>';
    }).join("");
    body.querySelectorAll(".art-row").forEach(function(row) {
      row.addEventListener("click", function() {
        var a = artikelState.items.find(function(x){return x.id === row.dataset.assetId;});
        if (a) openArtikelDetail(a);
      });
    });
  }

  // Karten-Marker neu rendern
  if (artikelState.map) {
    artikelState.markers.forEach(function(m){ try { artikelState.map.removeLayer(m); } catch(e){} });
    artikelState.markers = [];
    var bounds = [];
    items.forEach(function(a) {
      if (a.latitude == null || a.longitude == null) return;
      var ic = _artikelIcon(a.asset_type);
      var color = ic.cls === "generator" ? "#ea580c" : ic.cls === "verteiler" ? "#16a34a" : ic.cls === "lichtmast" ? "#ca8a04" : "#6b7280";
      var m = L.circleMarker([a.latitude, a.longitude], {
        radius: 9, color: color, fillColor: color, fillOpacity: 0.85, weight: 2
      }).addTo(artikelState.map);
      m.bindTooltip('<b>' + esc(a.label || "?") + '</b><br>' + esc(a.asset_type || ""), { direction: "top" });
      m.on("click", function(){ openArtikelDetail(a); });
      artikelState.markers.push(m);
      bounds.push([a.latitude, a.longitude]);
    });
    if (bounds.length) {
      try { artikelState.map.fitBounds(bounds, { padding: [30, 30], maxZoom: 16 }); } catch (e) {}
    }
  }
}

function openArtikelDetail(a) {
  var ic = _artikelIcon(a.asset_type);
  var status = a.status || "placed";
  var modal = $(
    '<div class="modal-bg"><div class="modal-card" style="max-width:620px;">' +
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">' +
        '<div class="art-type-icon ' + ic.cls + '" style="width:48px;height:48px;font-size:22px;">' + ic.icon + '</div>' +
        '<div style="flex:1;">' +

          '<div style="font-size:13px;color:var(--text-muted);">' + esc(a.asset_type || "Typ?") + '</div>' +
        '</div>' +
        '<div class="art-status-badge ' + status + '">' + (status === "dismantled" ? "Abgebaut" : "Gestellt") + '</div>' +
      '</div>' +
      '<div class="art-detail">' +
        (a.plus_code ? '<div class="row"><div class="k">Plus-Code</div><div class="v"><code>' + esc(a.plus_code) + '</code></div></div>' : '') +
        (a.latitude != null ? '<div class="row"><div class="k">GPS</div><div class="v">' + esc(a.latitude.toFixed(6)) + ', ' + esc(a.longitude.toFixed(6)) +
          ' &nbsp;<a href="https://www.google.com/maps?q=' + a.latitude + ',' + a.longitude + '" target="_blank" rel="noopener" style="color:var(--fuchsia);font-size:12px;">Karte öffnen ↗</a></div></div>' : '') +
        (a.created_by ? '<div class="row"><div class="k">Angelegt von</div><div class="v">' + esc(a.created_by) + '</div></div>' : '') +
        (a.created_at ? '<div class="row"><div class="k">Angelegt am</div><div class="v">' + esc(fmtDateTime(a.created_at)) + '</div></div>' : '') +
      '</div>' +
      ((a.comments && a.comments.length) ? (
        '<div class="art-comments"><h4>Kommentare (' + a.comments.length + ')</h4>' +
        a.comments.map(function(c) {
          return '<div class="art-cmt">' +
                   '<div class="meta">' + esc(c.author || c.created_by || "?") + ' &middot; ' + esc(fmtDateTime(c.created_at)) + '</div>' +
                   '<div class="txt">' + esc(c.text) + '</div>' +
                 '</div>';
        }).join("") + '</div>'
      ) : '<div class="art-comments"><h4>Kommentare</h4><div style="font-size:13px;color:#9ca3af;">Keine Kommentare vorhanden.</div></div>') +
      '<div class="actions"><button class="btn primary" id="art-close">Schließen</button></div>' +
    '</div></div>'
  );
  document.body.appendChild(modal);
  modal.querySelector("#art-close").addEventListener("click", function(){ modal.remove(); });
  modal.addEventListener("click", function(e){ if (e.target === modal) modal.remove(); });
}

var diaryState = { entries: [], trupps: [], loading: false };

function fmtDateTime(iso) {
  if (!iso) return "—";
  try {
    var d = new Date(iso);
    return d.toLocaleString("de-DE", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
  } catch (e) { return iso; }
}
function fmtDuration(startIso, endIso) {
  if (!startIso || !endIso) return "—";
  try {
    var ms = new Date(endIso) - new Date(startIso);
    if (ms < 0) return "—";
    var m = Math.round(ms / 60000);
    if (m < 60) return m + " Min";
    var h = Math.floor(m / 60), rem = m % 60;
    return h + "h " + (rem<10?"0":"") + rem + "m";
  } catch (e) { return "—"; }
}

function _renderSidePanel(e, truppMap, scope) {
  // scope: "diary" (vollansicht) | "multi" (kompakt)
  // Liefert HTML fuer den rechten Inline-Bereich der Karte.
  // Aktionen werden ueber data-action + data-id + data-tid Buttons getriggert.
  if (e.status === "resolved") {
    var dur = e.resolved_at ? fmtDuration(e.created_at, e.resolved_at) : "";
    return '<div class="de-side-h">✓ Behoben</div>' +
           '<div class="de-resolved-info-side">' +
             (e.resolved_by_name ? esc(e.resolved_by_name) + '<br>' : '') +
             (e.resolved_at ? esc(fmtDateTime(e.resolved_at).replace(",", "")) + '<br>' : '') +
             (dur ? '⏱ ' + esc(dur) : '') +
           '</div>' +
           '<button class="de-reopen-small" data-action="reopen" data-id="' + esc(e.id) + '">↺ Wieder öffnen</button>';
  }
  if (e.status === "in_progress") {
    var truppNames = (e.assigned_trupp_ids || []).map(function(tid){
      var t = truppMap[tid]; return t ? t.name : "?";
    }).filter(Boolean);
    return '<div class="de-side-h">🟡 Trupp unterwegs</div>' +
           truppNames.map(function(n){ return '<div class="de-assigned"><div class="de-trupp-dot busy"></div><div class="de-trupp-name">' + esc(n) + '</div></div>'; }).join("") +
           '<button class="de-resolve-big" data-action="resolve" data-id="' + esc(e.id) + '">✓ Fehler behoben</button>' +
           '<button class="de-reopen-small" data-action="unassign" data-id="' + esc(e.id) + '" style="font-size:10px;">↺ Trupp abziehen</button>';
  }
  // status open: Trupp-Picker
  var trupps = diaryState.trupps.filter(function(t){ return t.is_active; });
  var head = '<div class="de-side-h">🔴 Trupp zuweisen</div>';
  if (!trupps.length) {
    return head + '<div class="de-empty">Keine aktiven Trupps. „+ Trupp" oben klicken.</div>' +
           '<button class="de-resolve-big" data-action="resolve" data-id="' + esc(e.id) + '" style="background:#9ca3af;">✓ Ohne Trupp behoben</button>';
  }
  return head +
    '<div class="de-trupp-grid">' +
      trupps.map(function(t) {
        var disabled = t.is_busy ? "disabled title=\"Trupp aktuell auf einem Einsatz\"" : "";
        var meta = t.is_busy ? "unterwegs" : ((t.members || []).filter(Boolean).length + " Mitgl.");
        return '<button class="de-trupp-btn" data-action="assign" data-id="' + esc(e.id) + '" data-tid="' + esc(t.id) + '" ' + disabled + '>' +
                 '<div class="de-trupp-dot ' + (t.is_busy ? "busy" : "") + '"></div>' +
                 '<div class="de-trupp-name">' + esc(t.name) + '</div>' +
                 '<div class="de-trupp-meta">' + esc(meta) + '</div>' +
               '</button>';
      }).join("") +
    '</div>' +
    '<button class="de-reopen-small" data-action="resolve" data-id="' + esc(e.id) + '" style="margin-top:4px;color:#065f46;border-color:#a7f3d0;">✓ Ohne Trupp behoben</button>';
}

function _wireSidePanelActions(area, onChangeCb) {
  // onChangeCb wird nach jeder erfolgreichen Aenderung aufgerufen (typ. loadDiary)
  area.querySelectorAll("[data-action='assign']").forEach(function(btn) {
    btn.addEventListener("click", function() {
      if (btn.disabled) return;
      var pk = encodeURIComponent(state.order.primary_key);
      var entry = diaryState.entries.find(function(x){ return x.id === btn.dataset.id; });
      var ids = entry ? (entry.assigned_trupp_ids || []).slice() : [];
      if (ids.indexOf(btn.dataset.tid) === -1) ids.push(btn.dataset.tid);
      btn.disabled = true; btn.style.opacity = ".5";
      api("/api/orders/" + pk + "/diary/" + encodeURIComponent(btn.dataset.id),
          { method: "PUT", body: { assigned_trupp_ids: ids } })
        .then(onChangeCb)
        .catch(function(ex){ alert("Fehler: " + ex.message); btn.disabled = false; btn.style.opacity = ""; });
    });
  });
  area.querySelectorAll("[data-action='resolve']").forEach(function(btn) {
    btn.addEventListener("click", function() {
      btn.disabled = true;
      resolveEntry(btn.dataset.id).then(onChangeCb).catch(function(){ btn.disabled = false; });
    });
  });
  area.querySelectorAll("[data-action='reopen']").forEach(function(btn) {
    btn.addEventListener("click", function() {
      btn.disabled = true;
      reopenEntry(btn.dataset.id).then(onChangeCb).catch(function(){ btn.disabled = false; });
    });
  });
  area.querySelectorAll("[data-action='unassign']").forEach(function(btn) {
    btn.addEventListener("click", function() {
      if (!confirm("Trupp wieder abziehen? Eintrag geht zurück auf 'offen'.")) return;
      var pk = encodeURIComponent(state.order.primary_key);
      btn.disabled = true;
      api("/api/orders/" + pk + "/diary/" + encodeURIComponent(btn.dataset.id),
          { method: "PUT", body: { assigned_trupp_ids: [] } })
        .then(onChangeCb)
        .catch(function(ex){ alert("Fehler: " + ex.message); btn.disabled = false; });
    });
  });
}

function paintDiary(filter) {
  var area = document.getElementById("diary-area"); if (!area) return;
  var q = (filter || "").trim().toLowerCase();
  var truppMap = {}; diaryState.trupps.forEach(function(t){ truppMap[t.id] = t; });
  var entries = q ? diaryState.entries.filter(function(e){
    return [e.caller_name, e.caller_phone, e.reason, e.location, e.created_by_name].filter(Boolean)
      .some(function(v){ return String(v).toLowerCase().indexOf(q)>-1; });
  }) : diaryState.entries;
  if (!entries.length) {
    area.innerHTML = '<div class="empty" style="padding:32px;">' + (q ? "Keine Einträge passen zum Filter." : "Noch keine Störungsmeldungen.") + '</div>';
    return;
  }
  var html = "";
  entries.forEach(function(e) {
    var cls = e.status; // open | in_progress | resolved
    var truppNames = (e.assigned_trupp_ids || []).map(function(tid){ var t = truppMap[tid]; return t ? t.name : "?"; }).filter(Boolean);
    var badge =
      e.status === "resolved"    ? '<span class="badge bg-emerald">✓ Behoben</span>' :
      e.status === "in_progress" ? '<span class="badge bg-amber">● Trupp unterwegs</span>' :
                                    '<span class="badge bg-red">● Offen</span>';
    html += '<div class="diary-entry ' + cls + '" data-entry-id="' + esc(e.id) + '">' +
              '<div class="de-main">' +
                '<div class="e-top">' +
                  '<div class="e-time">🕐 ' + esc(fmtDateTime(e.created_at)) + (e.created_by_name ? ' &middot; <span style="font-style:italic;">' + esc(e.created_by_name) + '</span>' : '') + '</div>' +
                  '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
                    badge +
                    (e.is_nachtrag ? '<span class="badge bg-amber">Nachtrag</span>' : '') +
                  '</div>' +
                '</div>' +
                '<div class="e-reason">' + esc(e.reason) + '</div>' +
                '<div class="e-meta">' +
                  (e.caller_name ? '<div class="row">👤 ' + esc(e.caller_name) + '</div>' : '') +
                  (e.caller_phone ? '<div class="row">📞 ' + esc(e.caller_phone) + '</div>' : '') +
                  (e.location ? '<div class="row">📍 ' + esc(e.location) + '</div>' : '') +
                  (truppNames.length ? '<div class="row">👥 ' + esc(truppNames.join(", ")) + '</div>' : '') +
                '</div>' +
                '<div class="e-actions">' +
                  '<button class="btn sm entry-edit-btn" data-id="' + esc(e.id) + '">Bearbeiten</button>' +
                  '<button class="btn sm danger entry-del-btn" data-id="' + esc(e.id) + '">Löschen</button>' +
                '</div>' +
              '</div>' +
              '<div class="de-side">' + _renderSidePanel(e, truppMap, "diary") + '</div>' +
            '</div>';
  });
  area.innerHTML = html;
  _wireSidePanelActions(area, function(){ loadDiary(); loadTrupps(); });
  area.querySelectorAll(".entry-edit-btn").forEach(function(b){ b.addEventListener("click", function(){ var e = diaryState.entries.find(function(x){return x.id===b.dataset.id;}); openEntryModal(e); }); });
  area.querySelectorAll(".entry-del-btn").forEach(function(b){ b.addEventListener("click", function(){ deleteEntry(b.dataset.id); }); });
}

// ---- Entry CRUD --------------------------------------------------------
function openEntryModal(entry) {
  var isEdit = !!entry;
  var sel = new Set(entry ? (entry.assigned_trupp_ids || []) : []);
  var modal = $(
    '<div class="modal-bg"><div class="modal-card">' +
      '<h3>' + (isEdit ? "Eintrag bearbeiten" : "Neue Störung anlegen") + '</h3>' +
      '<label>Anrufer/Gast</label><input type="text" id="m-name" value="' + esc(entry ? entry.caller_name : "") + '" placeholder="Name" />' +
      '<label>Telefon</label><input type="tel" id="m-phone" value="' + esc(entry ? entry.caller_phone : "") + '" placeholder="Telefonnummer" />' +
      '<label>Standort / Position</label><input type="text" id="m-loc" value="' + esc(entry ? entry.location : "") + '" placeholder="z.B. Verteiler 3, Festzelt..." />' +
      '<label>Grund / Beschreibung *</label><textarea id="m-reason" placeholder="Was ist passiert?" required>' + esc(entry ? entry.reason : "") + '</textarea>' +
      (diaryState.trupps.length
        ? '<label>Trupp zuweisen</label><div class="trupp-pick" id="m-trupps"></div>'
        : '') +
      '<label class="checkbox-row"><input type="checkbox" id="m-nachtrag" ' + (entry && entry.is_nachtrag ? "checked" : "") + ' /> Als Nachtrag markieren (rückwirkend)</label>' +
      '<div id="m-err"></div>' +
      '<div class="actions">' +
        '<button class="btn" id="m-cancel">Abbrechen</button>' +
        '<button class="btn primary" id="m-save">' + (isEdit ? "Speichern" : "Anlegen") + '</button>' +
      '</div>' +
    '</div></div>'
  );
  document.body.appendChild(modal);
  if (diaryState.trupps.length) {
    var pickEl = modal.querySelector("#m-trupps");
    diaryState.trupps.forEach(function(t) {
      var b = document.createElement("button");
      b.textContent = t.name + (t.is_busy ? " (unterwegs)" : "");
      if (!t.is_active) return; // pausierte Trupps nicht auswaehlbar
      if (sel.has(t.id)) b.classList.add("on");
      if (t.is_busy) b.classList.add("busy");
      b.addEventListener("click", function() {
        if (sel.has(t.id)) { sel.delete(t.id); b.classList.remove("on"); }
        else { sel.add(t.id); b.classList.add("on"); }
      });
      pickEl.appendChild(b);
    });
  }
  modal.querySelector("#m-cancel").addEventListener("click", function(){ modal.remove(); });
  modal.querySelector("#m-save").addEventListener("click", function() {
    var reason = modal.querySelector("#m-reason").value.trim();
    var err = modal.querySelector("#m-err");
    if (!reason) { err.innerHTML = '<div class="alert error">Grund/Beschreibung ist erforderlich.</div>'; return; }
    var payload = {
      caller_name: modal.querySelector("#m-name").value,
      caller_phone: modal.querySelector("#m-phone").value,
      location: modal.querySelector("#m-loc").value,
      reason: reason,
      is_nachtrag: modal.querySelector("#m-nachtrag").checked,
      assigned_trupp_ids: Array.from(sel)
    };
    var pk = encodeURIComponent(state.order.primary_key);
    var url = "/api/orders/" + pk + "/diary" + (isEdit ? "/" + encodeURIComponent(entry.id) : "");
    var method = isEdit ? "PUT" : "POST";
    api(url, { method: method, body: payload }).then(function(){ modal.remove(); loadDiary(); loadTrupps(); })
      .catch(function(ex){ err.innerHTML = '<div class="alert error">' + esc(ex.message) + '</div>'; });
  });
  setTimeout(function(){ var r = modal.querySelector("#m-reason"); if (r) r.focus(); }, 50);
}

function resolveEntry(id) {
  var pk = encodeURIComponent(state.order.primary_key);
  return api("/api/orders/" + pk + "/diary/" + encodeURIComponent(id) + "/resolve", { method: "POST" })
    .then(function(){ loadDiary(); loadTrupps(); })
    .catch(function(ex){ alert("Fehler: " + ex.message); throw ex; });
}
function reopenEntry(id) {
  var pk = encodeURIComponent(state.order.primary_key);
  return api("/api/orders/" + pk + "/diary/" + encodeURIComponent(id) + "/reopen", { method: "POST" })
    .then(function(){ loadDiary(); loadTrupps(); })
    .catch(function(ex){ alert("Fehler: " + ex.message); throw ex; });
}
function deleteEntry(id) {
  if (!confirm("Diesen Eintrag wirklich löschen?")) return;
  var pk = encodeURIComponent(state.order.primary_key);
  api("/api/orders/" + pk + "/diary/" + encodeURIComponent(id), { method: "DELETE" })
    .then(function(){ loadDiary(); loadTrupps(); })
    .catch(function(ex){ alert("Fehler: " + ex.message); });
}

// ---- Trupp CRUD --------------------------------------------------------
function openTruppModal(trupp) {
  var isEdit = !!trupp;
  var members = isEdit ? (trupp.members || []).slice() : [];
  while (members.length < 4) members.push("");
  var modal = $(
    '<div class="modal-bg"><div class="modal-card">' +
      '<h3>' + (isEdit ? "Trupp bearbeiten" : "Neuen Trupp anlegen") + '</h3>' +
      '<label>Name (leer = Auto-Nummerierung)</label>' +
      '<input type="text" id="t-name" value="' + esc(isEdit ? trupp.name : "") + '" placeholder="z.B. Trupp 1, Lager-Team..." />' +
      '<label>Mitglieder (max. 4)</label>' +
      [0,1,2,3].map(function(i){
        return '<input type="text" id="t-m'+i+'" value="' + esc(members[i] || "") + '" placeholder="Mitglied ' + (i+1) + '" style="margin-bottom:6px;" />';
      }).join("") +
      '<div id="t-err"></div>' +
      '<div class="actions">' +
        '<button class="btn" id="t-cancel">Abbrechen</button>' +
        '<button class="btn primary" id="t-save">' + (isEdit ? "Speichern" : "Anlegen") + '</button>' +
      '</div>' +
    '</div></div>'
  );
  document.body.appendChild(modal);
  modal.querySelector("#t-cancel").addEventListener("click", function(){ modal.remove(); });
  modal.querySelector("#t-save").addEventListener("click", function() {
    var name = modal.querySelector("#t-name").value.trim();
    var ms = [0,1,2,3].map(function(i){ return modal.querySelector("#t-m"+i).value.trim(); }).filter(Boolean);
    var pk = encodeURIComponent(state.order.primary_key);
    var url = "/api/orders/" + pk + "/trupps" + (isEdit ? "/" + encodeURIComponent(trupp.id) : "");
    var method = isEdit ? "PUT" : "POST";
    var payload = { members: ms };
    if (isEdit || name) payload.name = name;
    api(url, { method: method, body: payload })
      .then(function(){ modal.remove(); loadTrupps(); })
      .catch(function(ex){ modal.querySelector("#t-err").innerHTML = '<div class="alert error">' + esc(ex.message) + '</div>'; });
  });
}
function toggleTruppActive(t) {
  var pk = encodeURIComponent(state.order.primary_key);
  api("/api/orders/" + pk + "/trupps/" + encodeURIComponent(t.id), { method: "PUT", body: { is_active: !t.is_active } })
    .then(loadTrupps)
    .catch(function(ex){ alert("Fehler: " + ex.message); });
}
function deleteTrupp(t) {
  if (!confirm("Trupp „" + t.name + "\" wirklich löschen? Er wird aus allen Einträgen entfernt.")) return;
  var pk = encodeURIComponent(state.order.primary_key);
  api("/api/orders/" + pk + "/trupps/" + encodeURIComponent(t.id), { method: "DELETE" })
    .then(function(){ loadTrupps(); loadDiary(); })
    .catch(function(ex){ alert("Fehler: " + ex.message); });
}

// ---- CSV Export --------------------------------------------------------
function exportDiaryCsv() {
  var pk = encodeURIComponent(state.order.primary_key);
  var url = BACKEND + "/api/orders/" + pk + "/diary/export.csv";
  fetch(url, { headers: { "Authorization": "Bearer " + state.token } })
    .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.blob(); })
    .then(function(blob) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "einsatztagebuch_" + state.order.primary_key + ".csv";
      document.body.appendChild(a); a.click(); a.remove();
    })
    .catch(function(ex){ alert("CSV-Export fehlgeschlagen: " + ex.message); });
}

// ============================================================================
// ROUTER
// ============================================================================
function render() {
  switch (state.phase) {
    case "user_select": return renderUserSelect();
    case "password":    return renderPassword();
    case "order_select":return renderOrderSelect();
    case "workspace":   return renderWorkspace();
    case "tile":        return renderTilePanel();
    default:            return renderUserSelect();
  }
}
render();
</script>
</body>
