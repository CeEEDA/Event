<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Einsatzzentrale</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
:root {
  --bg: #f9fafb; --card: #ffffff; --border: #e5e7eb; --border-hover: #d946ef;
  --text: #111827; --text-muted: #6b7280; --text-soft: #9ca3af;
  --fuchsia: #d946ef; --fuchsia-dark: #c026d3; --fuchsia-bg: #fdf4ff;
  --amber: #f59e0b; --amber-bg: #fffbeb;
  --emerald: #10b981; --emerald-bg: #ecfdf5;
  --red: #ef4444; --red-bg: #fef2f2;
  --blue: #3b82f6; --blue-bg: #eff6ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; }
input { font-family: inherit; }
.hidden { display: none !important; }
.kiosk-header { position: sticky; top: 0; z-index: 10; background: var(--card);
  border-bottom: 1px solid var(--border); padding: 12px 24px; }
.kiosk-header-inner { max-width: 1200px; margin: 0 auto; display: flex;
  align-items: center; justify-content: space-between; gap: 16px; }
.kiosk-brand { display: flex; align-items: center; gap: 16px; }
.kiosk-logo { height: 40px; width: auto; object-fit: contain; display: block; }
.kiosk-logo-fallback { font-weight: 800; font-size: 22px; letter-spacing: -0.5px; color: var(--fuchsia-dark); }
.kiosk-sep { width: 1px; height: 32px; background: var(--border); }
.kiosk-title { font-size: 15px; font-weight: 600; color: var(--text); }
.kiosk-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.kiosk-main { max-width: 1200px; margin: 0 auto; padding: 24px; }
.kiosk-search { position: relative; max-width: 380px; margin-bottom: 24px; }
.kiosk-search input { width: 100%; height: 52px; padding: 0 16px 0 44px;
  border: 1px solid var(--border); border-radius: 12px; font-size: 16px;
  background: var(--card); outline: none; transition: border-color .15s; }
.kiosk-search input:focus { border-color: var(--fuchsia); }
.kiosk-search svg { position: absolute; left: 14px; top: 50%;
  transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-soft); }
.kiosk-grid { display: grid; gap: 16px; }
.kiosk-grid.users { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.kiosk-grid.orders { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
.kiosk-grid.tiles  { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.kiosk-card { background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 20px; text-align: left; transition: all .15s;
  width: 100%; }
.kiosk-card:hover { border-color: var(--border-hover); box-shadow: 0 4px 12px rgba(0,0,0,.06); }
.kiosk-card.user { text-align: center; }
.avatar { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 12px;
  display: flex; align-items: center; justify-content: center; font-weight: 700;
  font-size: 24px; background: var(--fuchsia-bg); color: var(--fuchsia-dark); }
.avatar.freelancer { background: var(--amber-bg); color: var(--amber); }
.name { font-weight: 600; font-size: 15px; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.role { font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--fuchsia-dark); margin-top: 4px; }
.role.freelancer { color: var(--amber); }
.btn { display: inline-flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 16px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  font-size: 14px; font-weight: 500; }
.btn:hover { border-color: #d1d5db; background: #f9fafb; }
.btn.primary { background: var(--fuchsia); color: white; border-color: var(--fuchsia); height: 56px; font-size: 16px; padding: 0 24px; }
.btn.primary:hover { background: var(--fuchsia-dark); }
.btn.danger { color: #dc2626; border-color: var(--border); }
.btn.danger:hover { color: #b91c1c; border-color: #fecaca; background: var(--red-bg); }
.login-card { max-width: 420px; margin: 60px auto; background: var(--card);
  border: 1px solid var(--border); border-radius: 20px; padding: 32px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.login-card .avatar { width: 96px; height: 96px; font-size: 32px; }
.login-card h2 { text-align: center; margin: 0 0 4px; font-size: 24px; }
.login-card .role { text-align: center; margin-bottom: 24px; }
.login-card label { display: block; font-size: 13px; font-weight: 600;
  margin-bottom: 8px; color: var(--text); }
.login-card input[type=password] { width: 100%; height: 56px; padding: 0 16px;
  border: 1px solid var(--border); border-radius: 12px; font-size: 18px;
  text-align: center; letter-spacing: 4px; outline: none; }
.login-card input[type=password]:focus { border-color: var(--fuchsia); }
.alert { padding: 12px 14px; border-radius: 10px; margin-top: 12px;
  font-size: 14px; display: flex; gap: 8px; align-items: flex-start; }
.alert.error { background: var(--red-bg); border: 1px solid #fecaca; color: #991b1b; }
.alert.warning { background: var(--amber-bg); border: 1px solid #fde68a; color: #92400e; }
.spinner { width: 20px; height: 20px; border: 2px solid #e5e7eb;
  border-top-color: var(--fuchsia); border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.proj-header { background: linear-gradient(135deg, var(--fuchsia-bg), white);
  border: 1px solid #f5d0fe; border-radius: 20px; padding: 24px; margin-bottom: 24px; }
.proj-eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase;
  color: var(--fuchsia-dark); letter-spacing: 0.1em; }
.proj-event { font-size: 28px; font-weight: 700; margin: 4px 0 8px; }
.proj-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px;
  margin-top: 12px; font-size: 14px; color: var(--text-muted); }
.proj-meta .row { display: flex; align-items: center; gap: 6px; }
.section-title { font-size: 12px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-muted); margin: 24px 0 12px; }
.weather { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px; }
.weather .day { background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px; text-align: center; }
.weather .day .d { font-size: 12px; font-weight: 600; color: var(--text); }
.weather .day .e { font-size: 32px; margin: 4px 0; }
.weather .day .l { font-size: 10px; color: var(--text-muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.weather .day .t { font-size: 14px; font-weight: 700; margin-top: 6px; }
.weather .day .tmax { color: #ef4444; } .weather .day .tmin { color: #3b82f6; }
.weather .day .p { font-size: 10px; color: #2563eb; margin-top: 4px; }
.weather .day .w { font-size: 10px; color: var(--text-muted); }
.order-card .o-no { font-size: 11px; font-weight: 700; color: var(--fuchsia-dark);
  letter-spacing: 0.05em; }
.order-card h3 { font-size: 18px; margin: 4px 0 8px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.order-card .o-meta { font-size: 14px; color: var(--text-muted);
  display: flex; flex-direction: column; gap: 4px; }
.tile { padding: 24px; }
.tile-icon { width: 56px; height: 56px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; margin-bottom: 16px; }
.tile h3 { font-size: 18px; margin: 0 0 4px; }
.tile p { font-size: 12px; color: var(--text-muted); margin: 0; }
.empty { background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 48px; text-align: center; color: var(--text-muted); }
.user-info { display: flex; align-items: center; gap: 12px; }
.user-info .av-small { width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; background: var(--fuchsia-bg); color: var(--fuchsia-dark); }
.user-info .av-small.freelancer { background: var(--amber-bg); color: var(--amber); }
.window-badge { font-size: 11px; color: var(--text-muted); background: var(--card);
  border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 6px; }
.svg-icon { width: 16px; height: 16px; vertical-align: -2px; }
.dot-pulse { width: 8px; height: 8px; border-radius: 50%; }
.flex { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row { display: flex; align-items: center; gap: 6px; }
.icon-amber { color: var(--amber); }
.icon-fuchsia { color: var(--fuchsia); }
.icon-blue { color: var(--blue); }
.icon-emerald { color: var(--emerald); }
.tile-bg-emerald { background: var(--emerald-bg); color: var(--emerald); }
.tile-bg-slate { background: #f1f5f9; color: #475569; }
.tile-bg-blue { background: var(--blue-bg); color: var(--blue); }
.tile-bg-fuchsia { background: var(--fuchsia-bg); color: var(--fuchsia-dark); }

/* ========== WORKSPACE 2-Spalten-Layout ============================ */
.ws-main { max-width: 1800px; padding: 16px 24px; }
.section-title.compact { margin: 12px 0 8px; }

.proj-strip { background: linear-gradient(135deg, var(--fuchsia-bg), white);
  border: 1px solid #f5d0fe; border-radius: 14px; padding: 14px 20px; margin-bottom: 16px; }
.proj-strip-inner { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.ps-left { flex: 1; min-width: 240px; }
.ps-eyebrow { font-size: 10px; font-weight: 700; text-transform: uppercase;
  color: var(--fuchsia-dark); letter-spacing: 0.12em; }
.ps-event { font-size: 22px; font-weight: 700; margin: 2px 0 0; line-height: 1.2; }
.ps-right { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--text-muted); }
.ps-meta { display: flex; align-items: center; gap: 6px; }
.ps-meta span:first-child { width: 16px; text-align: center; }

.ws-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
@media (max-width: 1100px) { .ws-grid { grid-template-columns: 1fr; } }

.ws-tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ws-tile { display: flex !important; align-items: center; gap: 16px; padding: 16px !important; text-align: left; }
.ws-tile .tile-icon { width: 52px; height: 52px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 !important; flex-shrink: 0; }
.ws-tile h3 { font-size: 16px; margin: 0 0 2px; }
.ws-tile p { font-size: 11px; color: var(--text-muted); margin: 0; }

/* Wetter-Tage kompakter im Workspace */
.ws-tiles .weather { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.ws-tiles .weather .day { padding: 8px 6px; }
.ws-tiles .weather .day .d { font-size: 11px; }
.ws-tiles .weather .day .e { font-size: 24px; margin: 2px 0; }
.ws-tiles .weather .day .l { font-size: 9px; }
.ws-tiles .weather .day .t { font-size: 13px; margin-top: 3px; }
.ws-tiles .weather .day .p, .ws-tiles .weather .day .w { font-size: 9px; }

/* Regenradar */
.radar-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.radar-map { width: 100%; height: 380px; background: #e0e7ef; z-index: 0; }
.radar-map .leaflet-control-container .leaflet-top { top: 8px; }
.radar-controls { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--border); }
.radar-controls input[type=range] { flex: 1; cursor: pointer; height: 4px; accent-color: var(--fuchsia); }
.radar-hourly { padding: 12px 14px 14px; border-top: 1px solid var(--border); background: #fafbfc; }
.hourly-bars { display: flex; align-items: flex-end; gap: 2px; height: 56px; padding-bottom: 4px; }
.hbar { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; cursor: help; }
.hbar-fill { width: 80%; border-radius: 3px 3px 0 0; transition: height .2s; }
.hbar-fill.low { background: #cbd5e1; }
.hbar-fill.mid { background: #60a5fa; }
.hbar-fill.high { background: #2563eb; }
.hbar-label { font-size: 9px; color: var(--text-muted); margin-top: 2px; line-height: 1; transform: rotate(-45deg); transform-origin: top center; height: 10px; white-space: nowrap; }
.hourly-sum { display: flex; gap: 14px; align-items: center; margin-top: 16px; font-size: 12px; color: var(--text-muted); border-top: 1px dashed var(--border); padding-top: 8px; }
.hourly-sum b { color: var(--text); font-weight: 700; }

/* ========== ARTIKELLISTE (Read-only) =============================== */
.art-toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
.art-toolbar .kiosk-search { margin:0; flex:1; min-width:220px; max-width:420px; }
.art-toolbar select { height:44px; padding:0 14px; border:1px solid var(--border); border-radius:10px; background:var(--card); font-size:14px; font-family:inherit; outline:none; cursor:pointer; }
.art-toolbar select:focus { border-color:var(--fuchsia); }
.art-toolbar .count { margin-left:auto; font-size:13px; color:var(--text-muted); }

.art-layout { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
@media (max-width: 1100px) { .art-layout { grid-template-columns: 1fr; } }
.art-map { width:100%; height:520px; background:#e0e7ef; border-radius:14px; overflow:hidden; border:1px solid var(--border); z-index:0; }
.art-list { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; max-height:520px; display:flex; flex-direction:column; }
.art-list-head { padding:10px 14px; border-bottom:1px solid var(--border); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); background:#fafbfc; }
.art-list-body { flex:1; overflow:auto; }
.art-row { display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid #f3f4f6; cursor:pointer; transition:background .12s; }
.art-row:hover { background:#fafbfc; }
.art-row.dismantled { opacity:.55; }
.art-type-icon { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.art-type-icon.generator { background:#fed7aa; color:#9a3412; }
.art-type-icon.verteiler { background:#bbf7d0; color:#166534; }
.art-type-icon.lichtmast { background:#fef08a; color:#854d0e; }
.art-type-icon.other { background:#e5e7eb; color:#4b5563; }
.art-row-text { flex:1; min-width:0; }
.art-row-label { font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.art-row-meta { font-size:11px; color:var(--text-muted); display:flex; gap:8px; flex-wrap:wrap; margin-top:2px; }
.art-status-badge { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:2px 7px; border-radius:999px; flex-shrink:0; }
.art-status-badge.placed { background:var(--emerald-bg); color:#047857; }
.art-status-badge.dismantled { background:#e5e7eb; color:#6b7280; }

.art-detail { padding:8px 0; }
.art-detail .row { display:flex; gap:10px; padding:6px 0; font-size:14px; }
.art-detail .row .k { color:var(--text-muted); min-width:120px; font-size:12px; padding-top:2px; }
.art-detail .row .v { flex:1; word-break:break-word; }
.art-comments { margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
.art-comments h4 { margin:0 0 10px; font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); }
.art-cmt { background:#fafbfc; border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
.art-cmt .meta { font-size:11px; color:var(--text-muted); margin-bottom:4px; }
.art-cmt .txt { font-size:13px; white-space:pre-wrap; word-break:break-word; }

/* ========== DIARY (Einsatztagebuch) ============================== */
.diary-stats { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.diary-stat { flex:1; min-width:120px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
.diary-stat .lbl { font-size:11px; font-weight:600; text-transform:uppercase; color:var(--text-muted); letter-spacing:.06em; }
.diary-stat .val { font-size:28px; font-weight:700; margin-top:4px; }
.diary-stat.open .val { color:#dc2626; }
.diary-stat.resolved .val { color:var(--emerald); }
.diary-stat.total .val { color:var(--text); }

.diary-section-h { display:flex; align-items:center; justify-content:space-between; margin:24px 0 12px; }
.diary-section-h h3 { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin:0; }
.diary-section-h .right { display:flex; gap:8px; }

.diary-entry { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:10px; transition:border-color .15s; }
.diary-entry.open { border-left:4px solid #dc2626; }
.diary-entry.resolved { border-left:4px solid var(--emerald); opacity:.85; }
.diary-entry .e-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px; flex-wrap:wrap; }
.diary-entry .e-time { font-size:12px; color:var(--text-muted); display:flex; align-items:center; gap:6px; }
.diary-entry .badge { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:3px 8px; border-radius:999px; }
.badge.bg-red { background:var(--red-bg); color:#991b1b; }
.badge.bg-emerald { background:var(--emerald-bg); color:#047857; }
.badge.bg-amber { background:var(--amber-bg); color:#92400e; }
.badge.bg-fuchsia { background:var(--fuchsia-bg); color:var(--fuchsia-dark); }
.badge.bg-blue { background:var(--blue-bg); color:#1e40af; }
.diary-entry .e-reason { font-size:16px; font-weight:600; color:var(--text); margin:4px 0 8px; white-space:pre-wrap; word-break:break-word; }
.diary-entry .e-meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:6px 16px; font-size:13px; color:var(--text-muted); margin-bottom:10px; }
.diary-entry .e-meta .row { display:flex; align-items:center; gap:6px; }
.diary-entry .e-actions { display:flex; gap:8px; flex-wrap:wrap; }
.diary-entry .e-resolved-info { font-size:12px; color:var(--emerald); margin-top:6px; }

.btn.sm { height:34px; padding:0 12px; font-size:13px; }
.btn.success { background:var(--emerald); color:white; border-color:var(--emerald); }
.btn.success:hover { background:#059669; border-color:#059669; }
.btn.warn { background:var(--amber); color:white; border-color:var(--amber); }
.btn.warn:hover { background:#d97706; border-color:#d97706; }

.trupp-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
.trupp-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; position:relative; }
.trupp-card.busy { border-color:#fde68a; background:var(--amber-bg); }
.trupp-card.inactive { opacity:.45; background:#f9fafb; }
.trupp-card .t-name { font-weight:600; font-size:15px; }
.trupp-card .t-members { font-size:12px; color:var(--text-muted); margin-top:4px; }
.trupp-card .t-status { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-top:6px; display:inline-block; padding:2px 8px; border-radius:999px; }
.trupp-card .t-status.free { background:var(--emerald-bg); color:#047857; }
.trupp-card .t-status.busy { background:var(--amber-bg); color:#92400e; }
.trupp-card .t-status.paused { background:#e5e7eb; color:#6b7280; }
.trupp-card .t-actions { display:flex; gap:6px; margin-top:8px; }

/* Modal */
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:1000; display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; backdrop-filter:blur(2px); }
.modal-card { background:white; border-radius:16px; padding:24px; max-width:560px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,.2); }
.modal-card h3 { margin:0 0 16px; font-size:20px; }
.modal-card label { display:block; font-size:13px; font-weight:600; margin:12px 0 6px; color:var(--text); }
.modal-card input[type=text], .modal-card input[type=tel], .modal-card textarea { width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:10px; font-size:15px; font-family:inherit; outline:none; }
.modal-card input:focus, .modal-card textarea:focus { border-color:var(--fuchsia); }
.modal-card textarea { min-height:90px; resize:vertical; }
.modal-card .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:20px; }
.modal-card .checkbox-row { display:flex; align-items:center; gap:10px; padding:10px 0; cursor:pointer; }
.modal-card .checkbox-row input { width:18px; height:18px; }
.trupp-pick { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.trupp-pick button { padding:8px 14px; border:1px solid var(--border); border-radius:999px; background:var(--card); font-size:13px; cursor:pointer; transition:all .12s; }
.trupp-pick button.on { background:var(--fuchsia); color:white; border-color:var(--fuchsia); }
.trupp-pick button.busy { opacity:.6; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ============================================================================
// Standalone Kiosk - Vanilla JS, kein Framework, kein HMR, keine Reloads.
// ============================================================================
var BACKEND = window.location.origin;
var LOGO_URL = "https://customer-assets.emergentagent.com/job_client-file-portal/artifacts/35th6vn9_cropped-logo.webp";
// PERSISTENT STORAGE: localStorage statt sessionStorage, damit Token einen
// Browser-Crash, einen Reload oder ein Chromium-Restart auf dem Pi ueberlebt.
var SS_TOKEN = "ez_token", SS_USER = "ez_user", SS_PHASE = "ez_phase", SS_ORDER = "ez_order";
var STORE = (function() {
  // Versuche localStorage, fall back zu sessionStorage, fall back zu in-memory.
  try { localStorage.setItem("__ez_probe", "1"); localStorage.removeItem("__ez_probe"); return localStorage; } catch(e) {}
  try { sessionStorage.setItem("__ez_probe", "1"); sessionStorage.removeItem("__ez_probe"); return sessionStorage; } catch(e) {}
  var m = {}; return { getItem: function(k){return m[k]||null;}, setItem: function(k,v){m[k]=v;}, removeItem: function(k){delete m[k];} };
})();

// ----------------------------------------------------------------------------
// KIOSK-MODE HARDENING
// ----------------------------------------------------------------------------
// 1) Reload-Versuche unterbinden. Auf dem Pi darf die Seite NIE unkontrolliert
//    neu geladen werden. Falls doch ein fremdes Skript reload() aufruft, wird
//    es zu einem no-op.
try {
  Object.defineProperty(window.location, "reload", {
    configurable: false, writable: false,
    value: function(){ console.log("[Kiosk] reload() blocked"); }
  });
} catch (e) {}

// 2) WebSocket zum (nicht vorhandenen) Webpack-Dev-Server blockieren. Falls
//    irgend ein Stuck residual Code versucht wss://.../ws aufzubauen, geben
//    wir ein no-op-Objekt zurueck statt einen echten WebSocket.
try {
  var _OrigWS = window.WebSocket;
  window.WebSocket = function(url, protocols) {
    if (url && /\/ws($|\?)/.test(String(url))) {
      console.log("[Kiosk] dev-server WS blocked:", url);
      // Dummy-WebSocket der nichts tut
      return { readyState: 3, close: function(){}, send: function(){},
               addEventListener: function(){}, removeEventListener: function(){},
               onopen: null, onmessage: null, onerror: null, onclose: null };
    }
    return new _OrigWS(url, protocols);
  };
  window.WebSocket.prototype = _OrigWS.prototype;
  window.WebSocket.CONNECTING = 0; window.WebSocket.OPEN = 1;
  window.WebSocket.CLOSING = 2; window.WebSocket.CLOSED = 3;
} catch (e) {}

// 3) beforeunload: speichere State nochmal weg, falls Browser unkontrolliert
//    schliesst (Pi-Crash, OOM, etc.)
window.addEventListener("beforeunload", function() {
  try {
    if (state && state.token) {
      STORE.setItem(SS_TOKEN, state.token);
      STORE.setItem(SS_USER, JSON.stringify(state.user));
      STORE.setItem(SS_PHASE, state.phase);
      if (state.order) STORE.setItem(SS_ORDER, JSON.stringify(state.order));
    }
  } catch (e) {}
});

// ----------------------------------------------------------------------------
// DIAGNOSE: Load-Counter & Uptime-Badge unten rechts.
// Falls die Page reloaded, zaehlt der Counter hoch. Falls die Page stabil
// laeuft, bleibt er bei 1 und die Uhrzeit der Erst-Ladung wird angezeigt.
// So sieht der Operator sofort, ob es einen Reload-Loop gibt.
// ----------------------------------------------------------------------------
(function() {
  try {
    var KEY_LOADS = "ez_loads", KEY_FIRST = "ez_first_load";
    var n = parseInt(STORE.getItem(KEY_LOADS) || "0", 10) + 1;
    STORE.setItem(KEY_LOADS, String(n));
    if (n === 1 || !STORE.getItem(KEY_FIRST)) {
      STORE.setItem(KEY_FIRST, new Date().toISOString());
    }
    var firstIso = STORE.getItem(KEY_FIRST);
    var startTs = Date.now();

    function fmtUptime(sec) {
      sec = Math.max(0, Math.floor(sec));
      var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
      return (h ? h+"h " : "") + (m<10?"0":"") + m + ":" + (s<10?"0":"") + s;
    }

    function buildBadge() {
      var existing = document.getElementById("ez-diag-badge");
      if (existing) return existing;
      var b = document.createElement("div");
      b.id = "ez-diag-badge";
      b.style.cssText = "position:fixed;bottom:12px;right:12px;z-index:9999;" +
        "background:rgba(17,24,39,0.85);color:#fff;font:11px -apple-system,sans-serif;" +
        "padding:6px 10px;border-radius:8px;letter-spacing:.02em;cursor:pointer;" +
        "user-select:none;backdrop-filter:blur(8px);" +
        "border:1px solid rgba(255,255,255,.1);box-shadow:0 4px 12px rgba(0,0,0,.2);";
      b.title = "Klick zum Zuruecksetzen";
      b.addEventListener("click", function() {
        STORE.removeItem(KEY_LOADS); STORE.removeItem(KEY_FIRST);
        b.innerHTML = "Counter zurueckgesetzt (laden zum aktualisieren)";
      });
      document.body.appendChild(b);
      return b;
    }

    function tick() {
      try {
        var b = buildBadge();
        var upt = fmtUptime((Date.now() - startTs) / 1000);
        var firstStr = "";
        try { firstStr = new Date(firstIso).toLocaleTimeString("de-DE"); } catch (e) {}
        var color = n === 1 ? "#10b981" : (n < 5 ? "#f59e0b" : "#ef4444");
        b.innerHTML = '<span style="display:inline-block;width:8px;height:8px;' +
          'border-radius:50%;background:' + color + ';margin-right:8px;vertical-align:middle;"></span>' +
          'Loads: <b>' + n + '</b> &nbsp;·&nbsp; Uptime: <b>' + upt + '</b> &nbsp;·&nbsp; Erst-Load: ' + firstStr;
      } catch (e) {}
    }

    if (document.body) tick();
    else document.addEventListener("DOMContentLoaded", tick);
    setInterval(tick, 1000);
  } catch (e) {}
})();

// State
var state = { phase: "user_select", token: null, user: null, pickedUser: null,
              order: null, activeTile: null };

// Restore from STORE (localStorage mit fallback)
try {
  var t = STORE.getItem(SS_TOKEN), u = STORE.getItem(SS_USER);
  var p = STORE.getItem(SS_PHASE), o = STORE.getItem(SS_ORDER);
  if (t && u) {
    state.token = t; state.user = JSON.parse(u);
    if (p === "workspace" && o) { state.order = JSON.parse(o); state.phase = "workspace"; }
    else { state.phase = "order_select"; }
  }
} catch (e) {}

function savePhase(p) { try { STORE.setItem(SS_PHASE, p); } catch(e){} }
function saveOrder(o) { try { STORE.setItem(SS_ORDER, JSON.stringify(o)); } catch(e){} }
function clearSession() {
  try { STORE.removeItem(SS_TOKEN); STORE.removeItem(SS_USER);
        STORE.removeItem(SS_PHASE); STORE.removeItem(SS_ORDER); } catch(e){}
}

// Utilities
function $(html) { var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]}); }
function initials(n) { return (n || "?").split(/\s+/).map(function(p){return p[0];}).slice(0,2).join("").toUpperCase(); }
function fmtDate(iso) {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleDateString("de-DE", { day:"2-digit", month:"2-digit", year:"numeric" }); }
  catch (e) { return iso; }
}
function fmtRange(s, e) {
  if (!s && !e) return "";
  if (s && e && s === e) return fmtDate(s);
  return fmtDate(s) + " – " + fmtDate(e);
}
function api(path, opts) {
  opts = opts || {}; opts.headers = opts.headers || {};
  if (state.token) opts.headers["Authorization"] = "Bearer " + state.token;
  if (opts.body && typeof opts.body === "object") {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(opts.body);
  }
  return fetch(BACKEND + path, opts).then(function(r) {
    if (!r.ok) return r.json().catch(function(){return{detail:"HTTP "+r.status};}).then(function(d){ throw new Error(d.detail || ("HTTP " + r.status)); });
    return r.json();
  });
}

// ============================================================================
// PHASE 1: USER SELECT
// ============================================================================
function renderUserSelect() {
  var root = document.getElementById("root");
  root.innerHTML = "";
  root.appendChild($(
    '<div>' +
    '<header class="kiosk-header"><div class="kiosk-header-inner">' +
      '<div class="kiosk-brand">' +
        '<img class="kiosk-logo" src="' + LOGO_URL + '" alt="Eventenergie" onerror="this.outerHTML=\'<div class=\\\'kiosk-logo-fallback\\\'>Eventenergie</div>\'" />' +
        '<div class="kiosk-sep"></div>' +
        '<div><div class="kiosk-title">Einsatzzentrale</div><div class="kiosk-sub">Wähle deinen Namen, um dich anzumelden</div></div>' +
      '</div>' +
    '</div></header>' +
    '<main class="kiosk-main">' +
      '<div class="kiosk-search">' +
        '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke-width="2"/><path stroke-width="2" stroke-linecap="round" d="m20 20-3-3"/></svg>' +
        '<input id="user-filter" placeholder="Name suchen…" autocomplete="off" />' +
      '</div>' +
      '<div id="user-area"><div class="empty"><div class="spinner" style="margin:0 auto"></div></div></div>' +
    '</main></div>'
  ));
  var allUsers = [];
  var area = document.getElementById("user-area");
  var input = document.getElementById("user-filter");

  function paint(filter) {
    var q = (filter || "").trim().toLowerCase();
    var visible = q ? allUsers.filter(function(u){return (u.name||"").toLowerCase().indexOf(q)>-1;}) : allUsers;
    area.innerHTML = "";
    if (visible.length === 0) { area.appendChild($('<p style="color:#9ca3af;">Keine Mitarbeiter gefunden.</p>')); return; }
    var grid = $('<div class="kiosk-grid users"></div>');
    visible.forEach(function(u) {
      var freelancer = u.role === "freelancer";
      var card = $(
        '<button class="kiosk-card user">' +
          '<div class="avatar' + (freelancer ? ' freelancer' : '') + '">' + esc(initials(u.name)) + '</div>' +
          '<div class="name">' + esc(u.name) + '</div>' +
          '<div class="role' + (freelancer ? ' freelancer' : '') + '">' + esc(u.role) + '</div>' +
        '</button>'
      );
      card.addEventListener("click", function(){ state.pickedUser = u; state.phase = "password"; render(); });
      grid.appendChild(card);
    });
    area.appendChild(grid);
  }
  input.addEventListener("input", function(){ paint(input.value); });
  api("/api/einsatzzentrale/users").then(function(data){ allUsers = data.users || []; paint(""); })
    .catch(function(err){ area.innerHTML = '<div class="alert error">Server nicht erreichbar: ' + esc(err.message) + '</div>'; });
}

// ============================================================================
// PHASE 2: PASSWORD
// ============================================================================
function renderPassword() {
  var u = state.pickedUser; if (!u) { state.phase = "user_select"; render(); return; }
  var root = document.getElementById("root"); root.innerHTML = "";
  var freelancer = u.role === "freelancer";
  root.appendChild($(
    '<div>' +
    '<header class="kiosk-header"><div class="kiosk-header-inner">' +
      '<div class="kiosk-brand"><img class="kiosk-logo" src="' + LOGO_URL + '" alt="Eventenergie" onerror="this.outerHTML=\'<div class=\\\'kiosk-logo-fallback\\\'>Eventenergie</div>\'" />' +
        '<div class="kiosk-sep"></div><div><div class="kiosk-title">Einsatzzentrale</div><div class="kiosk-sub">Passwort eingeben</div></div>' +
      '</div>' +
      '<button id="back-btn" class="btn">← Zurück</button>' +
    '</div></header>' +
    '<main class="kiosk-main">' +
      '<form id="pw-form" class="login-card">' +
        '<div class="avatar' + (freelancer ? ' freelancer' : '') + '">' + esc(initials(u.name)) + '</div>' +
        '<h2>' + esc(u.name) + '</h2>' +
        '<div class="role' + (freelancer ? ' freelancer' : '') + '">' + esc(u.role) + '</div>' +
        '<label>Passwort</label>' +
        '<input type="password" id="pw" autocomplete="current-password" required />' +
        '<div id="pw-err"></div>' +
        '<button type="submit" class="btn primary" style="width:100%;margin-top:18px;justify-content:center;">Anmelden</button>' +
      '</form>' +
    '</main></div>'
  ));
  document.getElementById("back-btn").addEventListener("click", function(){ state.pickedUser = null; state.phase = "user_select"; render(); });
  setTimeout(function(){ var pw = document.getElementById("pw"); if (pw) pw.focus(); }, 50);
  document.getElementById("pw-form").addEventListener("submit", function(e) {
    e.preventDefault();
    var pw = document.getElementById("pw").value;
    var err = document.getElementById("pw-err"); err.innerHTML = "";
    var btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>';
    api("/api/einsatzzentrale/login", { method: "POST", body: { user_id: u.id, password: pw } })
      .then(function(data) {
        state.token = data.token; state.user = data.user; state.phase = "order_select";
        try { STORE.setItem(SS_TOKEN, data.token); STORE.setItem(SS_USER, JSON.stringify(data.user)); } catch(e){}
        savePhase("order_select"); try { STORE.removeItem(SS_ORDER); } catch(e){}
        render();
      })
      .catch(function(ex) {
        err.innerHTML = '<div class="alert error">' + esc(ex.message) + '</div>';
        btn.disabled = false; btn.innerHTML = "Anmelden";
      });
  });
}

// ============================================================================
// PHASE 3: ORDER SELECT
// ============================================================================
function renderHeader(subtitle) {
  var u = state.user; var freelancer = u && u.role === "freelancer";
  return (
    '<header class="kiosk-header"><div class="kiosk-header-inner">' +
      '<div class="kiosk-brand"><img class="kiosk-logo" src="' + LOGO_URL + '" alt="Eventenergie" onerror="this.outerHTML=\'<div class=\\\'kiosk-logo-fallback\\\'>Eventenergie</div>\'" />' +
        '<div class="kiosk-sep"></div><div><div class="kiosk-title">Einsatzzentrale</div><div class="kiosk-sub">' + esc(subtitle || "") + '</div></div>' +
      '</div>' +
      '<div class="user-info">' +
        '<div style="text-align:right;"><div style="font-size:14px;font-weight:500;">' + esc(u ? u.name : "") + '</div><div style="font-size:10px;text-transform:uppercase;color:#6b7280;font-weight:600;">' + esc(u ? u.role : "") + '</div></div>' +
        '<div class="av-small' + (freelancer ? ' freelancer' : '') + '">' + esc(initials(u ? u.name : "")) + '</div>' +
        '<button id="logout-btn" class="btn danger">⎋ Abmelden</button>' +
      '</div>' +
    '</div></header>'
  );
}

function attachLogout() {
  var b = document.getElementById("logout-btn");
  if (b) b.addEventListener("click", function() {
    state.token = null; state.user = null; state.order = null; state.pickedUser = null; state.phase = "user_select";
    clearSession();
    render();
  });
}

function renderOrderSelect() {
  var root = document.getElementById("root"); root.innerHTML = "";
  root.appendChild($(
    '<div>' + renderHeader("Auftrag auswählen") +
    '<main class="kiosk-main">' +
      '<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:24px;">' +
        '<div class="kiosk-search" style="margin:0;flex:1;min-width:240px;max-width:380px;">' +
          '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke-width="2"/><path stroke-width="2" stroke-linecap="round" d="m20 20-3-3"/></svg>' +
          '<input id="order-filter" placeholder="Suchen: Auftrag, Kunde, Event…" autocomplete="off" />' +
        '</div>' +
        '<div id="window-badge"></div>' +
      '</div>' +
      '<div id="order-area"><div class="empty"><div class="spinner" style="margin:0 auto"></div></div></div>' +
    '</main></div>'
  ));
  attachLogout();
  var allOrders = [];
  var area = document.getElementById("order-area");
  var input = document.getElementById("order-filter");
  function paint(filter) {
    var q = (filter || "").trim().toLowerCase();
    var visible = q ? allOrders.filter(function(o){return [o.order_no,o.contact_name,o.address,o.event].filter(Boolean).some(function(v){return String(v).toLowerCase().indexOf(q)>-1;});}) : allOrders;
    area.innerHTML = "";
    if (visible.length === 0) {
      area.appendChild($('<div class="empty">' + (q ? "Keine Aufträge passen zum Filter." : "Keine aktiven Aufträge im Zeitraum.") + '</div>'));
      return;
    }
    var grid = $('<div class="kiosk-grid orders"></div>');
    visible.forEach(function(o) {
      var c = $(
        '<button class="kiosk-card order-card">' +
          '<div class="o-no">AUFTRAG #' + esc(o.order_no || o.primary_key) + '</div>' +
          '<h3>' + esc(o.event || "—") + '</h3>' +
          '<div class="o-meta">' +
            (o.contact_name ? '<div class="row">🏢 <span>' + esc(o.contact_name) + '</span></div>' : '') +
            (o.address ? '<div class="row" style="color:#9ca3af;">📍 <span>' + esc(o.address) + '</span></div>' : '') +
            '<div class="row" style="color:#9ca3af;">📅 ' + esc(fmtRange(o.event_start, o.event_end)) + '</div>' +
          '</div>' +
        '</button>'
      );
      c.addEventListener("click", function() {
        state.order = o; state.phase = "workspace"; saveOrder(o); savePhase("workspace"); render();
      });
      grid.appendChild(c);
    });
    area.appendChild(grid);
  }
  input.addEventListener("input", function(){ paint(input.value); });
  api("/api/einsatzzentrale/orders").then(function(data) {
    allOrders = data.orders || [];
    if (data.window_start) {
      document.getElementById("window-badge").innerHTML =
        '<div class="window-badge">📅 ' + esc(fmtRange(data.window_start, data.window_end)) + '</div>';
    }
    paint("");
  }).catch(function(err) { area.innerHTML = '<div class="alert error">' + esc(err.message) + '</div>'; });
}

// ============================================================================
// PHASE 4: WORKSPACE
// ============================================================================
var TILES = [
  { key:"maschinen", label:"Maschinenliste", desc:"Generatoren, Verteiler, Lichtmasten", icon:"⚙️", cls:"tile-bg-emerald" },
  { key:"diary",     label:"Einsatztagebuch", desc:"Störungen & Verlauf",                  icon:"📓", cls:"tile-bg-slate" },
  { key:"plaene",    label:"Pläne",           desc:"Lagepläne, Dokumente, PDFs",           icon:"📄", cls:"tile-bg-blue" },
  { key:"artikel",   label:"Artikelliste",    desc:"Alle positionierten Artikel ansehen",  icon:"📍", cls:"tile-bg-fuchsia" }
];

function renderWorkspace() {
  var o = state.order; if (!o) { state.phase = "order_select"; render(); return; }
  var root = document.getElementById("root"); root.innerHTML = "";
  root.appendChild($(
    '<div>' + renderHeader("Auftrag #" + (o.order_no || o.primary_key)) +
    '<main class="kiosk-main ws-main">' +
      // Kompakter Auftragsstreifen (1-zeilig statt grosser Header-Karte)
      '<div id="proj-strip" class="proj-strip"></div>' +

      // Hauptgrid: Links 4 Tiles (groß, prominent), rechts Wetter + Regenradar
      '<div class="ws-grid">' +
        '<section class="ws-tiles">' +
          '<div class="section-title compact">Bereiche</div>' +
          '<div class="ws-tile-grid">' +
            TILES.map(function(t) {
              return '<button class="kiosk-card tile ws-tile" data-tile="' + t.key + '">' +
                       '<div class="tile-icon ' + t.cls + '">' + t.icon + '</div>' +
                       '<div><h3>' + esc(t.label) + '</h3><p>' + esc(t.desc) + '</p></div>' +
                     '</button>';
            }).join("") +
          '</div>' +
          // 7-Tage-Wetter unter den Tiles, kompakt
          '<div class="section-title compact" style="margin-top:20px;">7-Tage-Vorhersage</div>' +
          '<div id="weather-days"><div class="empty" style="padding:16px;"><div class="spinner" style="margin:0 auto"></div></div></div>' +
        '</section>' +

        '<aside class="ws-radar">' +
          '<div class="section-title compact" style="display:flex;align-items:center;justify-content:space-between;">' +
            '<span>Regenradar &amp; -Prognose</span>' +
            '<span id="radar-time-lbl" style="font-size:11px;color:var(--text-muted);font-weight:500;text-transform:none;letter-spacing:0;">Live</span>' +
          '</div>' +
          '<div class="radar-card">' +
            '<div id="radar-map" class="radar-map"></div>' +
            '<div class="radar-controls">' +
              '<button id="radar-play" class="btn sm">▶ Animation</button>' +
              '<input type="range" id="radar-slider" min="0" max="0" value="0" />' +
              '<span id="radar-frame-lbl" style="font-size:11px;color:var(--text-muted);min-width:60px;">--:--</span>' +
            '</div>' +
            '<div id="radar-hourly" class="radar-hourly"></div>' +
          '</div>' +
        '</aside>' +
      '</div>' +
    '</main></div>'
  ));
  attachLogout();

  document.querySelectorAll("[data-tile]").forEach(function(el) {
    el.addEventListener("click", function() { state.activeTile = el.dataset.tile; state.phase = "tile"; render(); });
  });

  api("/api/einsatzzentrale/orders/" + encodeURIComponent(o.primary_key))
    .then(function(detail) {
      paintProjStrip(detail);
      if (detail.center_lat == null || detail.center_lng == null) {
        document.getElementById("weather-days").innerHTML =
          '<div class="alert warning">⚠ Keine GPS-Koordinaten — Adresse konnte nicht geocoded werden. Bitte Adresse im Auftrag prüfen.</div>';
        document.getElementById("radar-map").innerHTML =
          '<div class="empty" style="padding:32px;color:#9ca3af;">Kein Standort für Radar verfügbar.</div>';
        return;
      }
      loadWeatherDays(detail);
      initRadar(detail.center_lat, detail.center_lng);
      loadHourlyForecast(detail.center_lat, detail.center_lng);
    })
    .catch(function(err) {
      document.getElementById("proj-strip").innerHTML = '<div class="alert error">' + esc(err.message) + '</div>';
    });
}

function paintProjStrip(detail) {
  document.getElementById("proj-strip").innerHTML =
    '<div class="proj-strip-inner">' +
      '<div class="ps-left">' +

// ============================================================================
// REGENRADAR via RainViewer (kostenlos, kein API-Key)
// ============================================================================
var radarMap = null, radarMarker = null, radarLayer = null, radarFrames = [];
var radarIdx = -1, radarPlayHandle = null;

function initRadar(lat, lng) {
  var mapEl = document.getElementById("radar-map"); if (!mapEl) return;
  if (radarMap) { try { radarMap.remove(); } catch(e){} radarMap = null; }

  radarMap = L.map(mapEl, { zoomControl: true, attributionControl: false }).setView([lat, lng], 8);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 14, opacity: 0.85
  }).addTo(radarMap);
  radarMarker = L.circleMarker([lat, lng], {
    radius: 8, color: "#d946ef", fillColor: "#d946ef", fillOpacity: 0.85, weight: 3
  }).addTo(radarMap).bindTooltip("Veranstaltungsort", { permanent: false });

  // RainViewer index laden
  fetch("https://api.rainviewer.com/public/weather-maps.json")
    .then(function(r){ return r.json(); })
    .then(function(d) {
      var past = (d.radar && d.radar.past) || [];
      var future = (d.radar && d.radar.nowcast) || [];
      var frames = past.slice(-6).concat(future); // 6 Vergangenheit + alle Zukunft
      radarFrames = frames.map(function(f){
        return { time: f.time, path: f.path, host: d.host };
      });
      var slider = document.getElementById("radar-slider");
      slider.max = String(Math.max(0, radarFrames.length - 1));
      // Default: aktuellster Vergangenheits-Frame (= last "past")
      radarIdx = Math.min(5, radarFrames.length - 1);
      slider.value = String(radarIdx);
      showRadarFrame(radarIdx);
      slider.addEventListener("input", function(){ stopRadarPlay(); showRadarFrame(parseInt(slider.value,10)); });
      document.getElementById("radar-play").addEventListener("click", toggleRadarPlay);
    })
    .catch(function(){
      document.getElementById("radar-frame-lbl").textContent = "Radar offline";
    });
}

function showRadarFrame(i) {
  if (i < 0 || i >= radarFrames.length) return;
  radarIdx = i;
  var f = radarFrames[i];
  var url = f.host + f.path + "/256/{z}/{x}/{y}/2/1_1.png";
  if (radarLayer) { try { radarMap.removeLayer(radarLayer); } catch(e){} }
  radarLayer = L.tileLayer(url, { opacity: 0.7, maxZoom: 14 }).addTo(radarMap);
  var d = new Date(f.time * 1000);
  var now = Date.now() / 1000;
  var diffMin = Math.round((f.time - now) / 60);
  var rel = diffMin === 0 ? "jetzt" : (diffMin > 0 ? "in " + diffMin + " Min" : "vor " + Math.abs(diffMin) + " Min");
  document.getElementById("radar-frame-lbl").textContent = d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("radar-time-lbl").textContent = rel;
  document.getElementById("radar-slider").value = String(i);
}

function toggleRadarPlay() {
  if (radarPlayHandle) { stopRadarPlay(); return; }
  document.getElementById("radar-play").textContent = "⏸ Stopp";
  radarPlayHandle = setInterval(function() {
    var next = (radarIdx + 1) % radarFrames.length;
    showRadarFrame(next);
  }, 700);
}
function stopRadarPlay() {
  if (radarPlayHandle) { clearInterval(radarPlayHandle); radarPlayHandle = null; }
  var b = document.getElementById("radar-play"); if (b) b.textContent = "▶ Animation";
}

function loadHourlyForecast(lat, lng) {
  api("/api/einsatzzentrale/weather/hourly?lat=" + lat + "&lng=" + lng + "&hours=24").then(function(d) {
    var hours = d.hours || []; if (!hours.length) return;
    var maxPrecip = Math.max(0.5, Math.max.apply(null, hours.map(function(h){return h.precipitation_mm || 0;})));
    var html = '<div class="hourly-bars">';
    hours.forEach(function(h, i) {
      var t = new Date(h.time);
      var label = (i === 0) ? "jetzt" : t.getHours() + "h";
      var rain = h.precipitation_mm || 0;
      var prob = h.precipitation_prob || 0;
      var barH = Math.max(2, Math.round((rain / maxPrecip) * 38));
      var probCls = prob >= 70 ? "high" : prob >= 30 ? "mid" : "low";
      html += '<div class="hbar" title="' + esc(t.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})) +
              ' — ' + esc(h.weather_label) + ', ' + (rain.toFixed(1)) + 'mm, ' + prob + '%">' +
                '<div class="hbar-fill ' + probCls + '" style="height:' + barH + 'px;"></div>' +
                '<div class="hbar-label">' + label + '</div>' +
              '</div>';
    });
    html += '</div>';
    // Summary darunter
    var totalRain = hours.reduce(function(s,h){return s + (h.precipitation_mm || 0);}, 0);
    var maxProb = Math.max.apply(null, hours.map(function(h){return h.precipitation_prob || 0;}));
    html += '<div class="hourly-sum">' +
              '<span>Σ 24h: <b>' + totalRain.toFixed(1) + ' mm</b></span>' +
              '<span>Max-Wkt.: <b>' + maxProb + '%</b></span>' +
              '<span style="margin-left:auto;font-size:10px;color:#9ca3af;">Radar &amp; Daten: rainviewer.com · open-meteo.com</span>' +
            '</div>';
    document.getElementById("radar-hourly").innerHTML = html;
  }).catch(function(){});
}

function paintArtikel() {
  var q = (artikelState.search || "").trim().toLowerCase();
  var items = artikelState.items.filter(function(a) {
    if (artikelState.filterType !== "all" && a.asset_type !== artikelState.filterType) return false;
    if (artikelState.filterStatus !== "all" && (a.status || "placed") !== artikelState.filterStatus) return false;
    if (q) {
      var hay = [a.label, a.asset_type, a.plus_code, a.created_by].filter(Boolean).join(" ").toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });

  // Liste
  var head = document.getElementById("art-list-head");
  var body = document.getElementById("art-list-body");
  var countEl = document.getElementById("art-count");
  if (countEl) countEl.textContent = items.length + " von " + artikelState.items.length + " Artikeln";
  if (head) head.textContent = items.length + " Artikel" + (items.length !== artikelState.items.length ? " (gefiltert von " + artikelState.items.length + ")" : "");
  if (!items.length) {
    body.innerHTML = '<div class="empty" style="padding:32px;">Keine Artikel gefunden.</div>';
  } else {
    body.innerHTML = items.map(function(a) {
      var ic = _artikelIcon(a.asset_type);
      var status = a.status || "placed";
      var statusLbl = status === "dismantled" ? "Abgebaut" : "Gestellt";
      var cmtCount = (a.comments || []).length;
      return '<div class="art-row ' + (status === "dismantled" ? "dismantled" : "") + '" data-asset-id="' + esc(a.id) + '">' +
               '<div class="art-type-icon ' + ic.cls + '">' + ic.icon + '</div>' +
               '<div class="art-row-text">' +
                 '<div class="art-row-label">' + esc(a.label || "(ohne Bezeichnung)") + '</div>' +
                 '<div class="art-row-meta">' +
                   '<span>' + esc(a.asset_type || "Typ?") + '</span>' +
                   (a.plus_code ? '<span>📍 ' + esc(a.plus_code) + '</span>' : '') +
                   (cmtCount ? '<span>💬 ' + cmtCount + '</span>' : '') +
                 '</div>' +
               '</div>' +
               '<div class="art-status-badge ' + status + '">' + statusLbl + '</div>' +
             '</div>';
    }).join("");
    body.querySelectorAll(".art-row").forEach(function(row) {
      row.addEventListener("click", function() {
        var a = artikelState.items.find(function(x){return x.id === row.dataset.assetId;});
        if (a) openArtikelDetail(a);
      });
    });
  }

  // Karten-Marker neu rendern
  if (artikelState.map) {
    artikelState.markers.forEach(function(m){ try { artikelState.map.removeLayer(m); } catch(e){} });
    artikelState.markers = [];
    var bounds = [];
    items.forEach(function(a) {
      if (a.latitude == null || a.longitude == null) return;
      var ic = _artikelIcon(a.asset_type);
      var color = ic.cls === "generator" ? "#ea580c" : ic.cls === "verteiler" ? "#16a34a" : ic.cls === "lichtmast" ? "#ca8a04" : "#6b7280";
      var m = L.circleMarker([a.latitude, a.longitude], {
        radius: 9, color: color, fillColor: color, fillOpacity: 0.85, weight: 2
      }).addTo(artikelState.map);
      m.bindTooltip('<b>' + esc(a.label || "?") + '</b><br>' + esc(a.asset_type || ""), { direction: "top" });
      m.on("click", function(){ openArtikelDetail(a); });
      artikelState.markers.push(m);
      bounds.push([a.latitude, a.longitude]);
    });
    if (bounds.length) {
      try { artikelState.map.fitBounds(bounds, { padding: [30, 30], maxZoom: 16 }); } catch (e) {}
    }
  }
}

function fmtDateTime(iso) {
  if (!iso) return "—";
  try {
    var d = new Date(iso);
    return d.toLocaleString("de-DE", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
  } catch (e) { return iso; }
}
function fmtDuration(startIso, endIso) {
  if (!startIso || !endIso) return "—";
  try {
    var ms = new Date(endIso) - new Date(startIso);
    if (ms < 0) return "—";
    var m = Math.round(ms / 60000);
    if (m < 60) return m + " Min";
    var h = Math.floor(m / 60), rem = m % 60;
    return h + "h " + (rem<10?"0":"") + rem + "m";
  } catch (e) { return "—"; }
}

  }).catch(function(err) {
    var area = document.getElementById("diary-area");
    if (area) area.innerHTML = '<div class="alert error">' + esc(err.message) + '</div>';
  });
}

function loadTrupps() {
  var pk = encodeURIComponent(state.order.primary_key);
  api("/api/orders/" + pk + "/trupps").then(function(data) {
    diaryState.trupps = data.trupps || [];
    paintTrupps();
  }).catch(function(err) {
    var area = document.getElementById("trupp-area");
    if (area) area.innerHTML = '<div class="alert error">' + esc(err.message) + '</div>';
  });
}

function paintStats(data) {
  var el = document.getElementById("diary-stats"); if (!el) return;
  el.innerHTML =
    '<div class="diary-stats">' +
      '<div class="diary-stat open"><div class="lbl">Offen</div><div class="val">' + (data.open || 0) + '</div></div>' +
      '<div class="diary-stat resolved"><div class="lbl">Behoben</div><div class="val">' + (data.resolved || 0) + '</div></div>' +
      '<div class="diary-stat total"><div class="lbl">Gesamt</div><div class="val">' + (data.total || 0) + '</div></div>' +
    '</div>';
}

function paintTrupps() {
  var area = document.getElementById("trupp-area"); if (!area) return;
  if (!diaryState.trupps.length) {
    area.innerHTML = '<div class="empty" style="padding:24px;">Noch keine Trupps angelegt. Tippe oben rechts auf „+ Trupp anlegen".</div>';
    return;
  }
  var html = '<div class="trupp-grid">';
  diaryState.trupps.forEach(function(t) {
    var cls = !t.is_active ? "inactive" : (t.is_busy ? "busy" : "");
    var statusCls = !t.is_active ? "paused" : (t.is_busy ? "busy" : "free");
    var statusLbl = !t.is_active ? "Pause" : (t.is_busy ? "Unterwegs" : "Verfügbar");
    var members = (t.members || []).filter(Boolean).join(", ");
    html += '<div class="trupp-card ' + cls + '" data-trupp-id="' + esc(t.id) + '">' +
              '<div class="t-name">' + esc(t.name) + '</div>' +
              (members ? '<div class="t-members">👥 ' + esc(members) + '</div>' : '<div class="t-members" style="font-style:italic;color:#9ca3af;">Keine Mitglieder</div>') +
              '<div class="t-status ' + statusCls + '">' + statusLbl + '</div>' +
              '<div class="t-actions">' +
                '<button class="btn sm trupp-edit-btn" data-id="' + esc(t.id) + '">Bearbeiten</button>' +
                '<button class="btn sm trupp-pause-btn" data-id="' + esc(t.id) + '">' + (t.is_active ? "Pause" : "Aktivieren") + '</button>' +
                '<button class="btn sm danger trupp-del-btn" data-id="' + esc(t.id) + '">Löschen</button>' +
              '</div>' +
            '</div>';
  });
  html += '</div>';
  area.innerHTML = html;
  area.querySelectorAll(".trupp-edit-btn").forEach(function(b){ b.addEventListener("click", function(){ var t = diaryState.trupps.find(function(x){return x.id===b.dataset.id;}); openTruppModal(t); }); });
  area.querySelectorAll(".trupp-pause-btn").forEach(function(b){ b.addEventListener("click", function(){ var t = diaryState.trupps.find(function(x){return x.id===b.dataset.id;}); toggleTruppActive(t); }); });
  area.querySelectorAll(".trupp-del-btn").forEach(function(b){ b.addEventListener("click", function(){ var t = diaryState.trupps.find(function(x){return x.id===b.dataset.id;}); deleteTrupp(t); }); });
}

function paintDiary(filter) {
  var area = document.getElementById("diary-area"); if (!area) return;
  var q = (filter || "").trim().toLowerCase();
  var truppMap = {}; diaryState.trupps.forEach(function(t){ truppMap[t.id] = t; });
  var entries = q ? diaryState.entries.filter(function(e){
    return [e.caller_name, e.caller_phone, e.reason, e.location, e.created_by_name].filter(Boolean)
      .some(function(v){ return String(v).toLowerCase().indexOf(q)>-1; });
  }) : diaryState.entries;
  if (!entries.length) {
    area.innerHTML = '<div class="empty" style="padding:32px;">' + (q ? "Keine Einträge passen zum Filter." : "Noch keine Störungsmeldungen.") + '</div>';
    return;
  }
  var html = "";
  entries.forEach(function(e) {
    var cls = e.status === "resolved" ? "resolved" : "open";
    var truppNames = (e.assigned_trupp_ids || []).map(function(tid){ var t = truppMap[tid]; return t ? t.name : "?"; }).filter(Boolean);
    html += '<div class="diary-entry ' + cls + '" data-entry-id="' + esc(e.id) + '">' +
              '<div class="e-top">' +
                '<div class="e-time">🕐 ' + esc(fmtDateTime(e.created_at)) + (e.created_by_name ? ' &middot; <span style="font-style:italic;">' + esc(e.created_by_name) + '</span>' : '') + '</div>' +
                '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
                  (e.status === "resolved"
                     ? '<span class="badge bg-emerald">✓ Behoben</span>'
                     : '<span class="badge bg-red">● Offen</span>') +
                  (e.is_nachtrag ? '<span class="badge bg-amber">Nachtrag</span>' : '') +
                '</div>' +
              '</div>' +
              '<div class="e-reason">' + esc(e.reason) + '</div>' +
              '<div class="e-meta">' +
                (e.caller_name ? '<div class="row">👤 ' + esc(e.caller_name) + '</div>' : '') +
                (e.caller_phone ? '<div class="row">📞 ' + esc(e.caller_phone) + '</div>' : '') +
                (e.location ? '<div class="row">📍 ' + esc(e.location) + '</div>' : '') +
                (truppNames.length ? '<div class="row">👥 ' + esc(truppNames.join(", ")) + '</div>' : '') +
              '</div>' +
              (e.status === "resolved" && e.resolved_at
                ? '<div class="e-resolved-info">✓ Behoben am ' + esc(fmtDateTime(e.resolved_at)) +
                  (e.resolved_by_name ? ' von ' + esc(e.resolved_by_name) : '') +
                  ' &middot; Dauer: ' + esc(fmtDuration(e.created_at, e.resolved_at)) + '</div>'
                : '') +
              '<div class="e-actions">' +
                (e.status === "open"
                  ? '<button class="btn sm success entry-resolve-btn" data-id="' + esc(e.id) + '">✓ Als behoben markieren</button>'
                  : '<button class="btn sm warn entry-reopen-btn" data-id="' + esc(e.id) + '">↺ Wieder öffnen</button>') +
                '<button class="btn sm entry-edit-btn" data-id="' + esc(e.id) + '">Bearbeiten</button>' +
                '<button class="btn sm danger entry-del-btn" data-id="' + esc(e.id) + '">Löschen</button>' +
              '</div>' +
            '</div>';
  });
  area.innerHTML = html;
  area.querySelectorAll(".entry-resolve-btn").forEach(function(b){ b.addEventListener("click", function(){ resolveEntry(b.dataset.id); }); });
  area.querySelectorAll(".entry-reopen-btn").forEach(function(b){ b.addEventListener("click", function(){ reopenEntry(b.dataset.id); }); });
  area.querySelectorAll(".entry-edit-btn").forEach(function(b){ b.addEventListener("click", function(){ var e = diaryState.entries.find(function(x){return x.id===b.dataset.id;}); openEntryModal(e); }); });
  area.querySelectorAll(".entry-del-btn").forEach(function(b){ b.addEventListener("click", function(){ deleteEntry(b.dataset.id); }); });
}

// ---- Entry CRUD --------------------------------------------------------
function openEntryModal(entry) {
  var isEdit = !!entry;
  var sel = new Set(entry ? (entry.assigned_trupp_ids || []) : []);
  var modal = $(
    '<div class="modal-bg"><div class="modal-card">' +
      '<h3>' + (isEdit ? "Eintrag bearbeiten" : "Neue Störung anlegen") + '</h3>' +
      '<label>Anrufer/Gast</label><input type="text" id="m-name" value="' + esc(entry ? entry.caller_name : "") + '" placeholder="Name" />' +
      '<label>Telefon</label><input type="tel" id="m-phone" value="' + esc(entry ? entry.caller_phone : "") + '" placeholder="Telefonnummer" />' +
      '<label>Standort / Position</label><input type="text" id="m-loc" value="' + esc(entry ? entry.location : "") + '" placeholder="z.B. Verteiler 3, Festzelt..." />' +
      '<label>Grund / Beschreibung *</label><textarea id="m-reason" placeholder="Was ist passiert?" required>' + esc(entry ? entry.reason : "") + '</textarea>' +
      (diaryState.trupps.length
        ? '<label>Trupp zuweisen</label><div class="trupp-pick" id="m-trupps"></div>'
        : '') +
      '<label class="checkbox-row"><input type="checkbox" id="m-nachtrag" ' + (entry && entry.is_nachtrag ? "checked" : "") + ' /> Als Nachtrag markieren (rückwirkend)</label>' +
      '<div id="m-err"></div>' +
      '<div class="actions">' +
        '<button class="btn" id="m-cancel">Abbrechen</button>' +
        '<button class="btn primary" id="m-save">' + (isEdit ? "Speichern" : "Anlegen") + '</button>' +
      '</div>' +
    '</div></div>'
  );
  document.body.appendChild(modal);
  if (diaryState.trupps.length) {
    var pickEl = modal.querySelector("#m-trupps");
    diaryState.trupps.forEach(function(t) {
      var b = document.createElement("button");
      b.textContent = t.name + (t.is_busy ? " (unterwegs)" : "");
      if (!t.is_active) return; // pausierte Trupps nicht auswaehlbar
      if (sel.has(t.id)) b.classList.add("on");
      if (t.is_busy) b.classList.add("busy");
      b.addEventListener("click", function() {
        if (sel.has(t.id)) { sel.delete(t.id); b.classList.remove("on"); }
        else { sel.add(t.id); b.classList.add("on"); }
      });
      pickEl.appendChild(b);
    });
  }
  modal.querySelector("#m-cancel").addEventListener("click", function(){ modal.remove(); });
  modal.querySelector("#m-save").addEventListener("click", function() {
    var reason = modal.querySelector("#m-reason").value.trim();
    var err = modal.querySelector("#m-err");
    if (!reason) { err.innerHTML = '<div class="alert error">Grund/Beschreibung ist erforderlich.</div>'; return; }
    var payload = {
      caller_name: modal.querySelector("#m-name").value,
      caller_phone: modal.querySelector("#m-phone").value,
      location: modal.querySelector("#m-loc").value,
      reason: reason,
      is_nachtrag: modal.querySelector("#m-nachtrag").checked,
      assigned_trupp_ids: Array.from(sel)
    };
    var pk = encodeURIComponent(state.order.primary_key);
    var url = "/api/orders/" + pk + "/diary" + (isEdit ? "/" + encodeURIComponent(entry.id) : "");
    var method = isEdit ? "PUT" : "POST";
    api(url, { method: method, body: payload }).then(function(){ modal.remove(); loadDiary(); loadTrupps(); })
      .catch(function(ex){ err.innerHTML = '<div class="alert error">' + esc(ex.message) + '</div>'; });
  });
  setTimeout(function(){ var r = modal.querySelector("#m-reason"); if (r) r.focus(); }, 50);
}

function resolveEntry(id) {
  var pk = encodeURIComponent(state.order.primary_key);
  api("/api/orders/" + pk + "/diary/" + encodeURIComponent(id) + "/resolve", { method: "POST" })
    .then(function(){ loadDiary(); loadTrupps(); })
    .catch(function(ex){ alert("Fehler: " + ex.message); });
}
function reopenEntry(id) {
  var pk = encodeURIComponent(state.order.primary_key);
  api("/api/orders/" + pk + "/diary/" + encodeURIComponent(id) + "/reopen", { method: "POST" })
    .then(function(){ loadDiary(); loadTrupps(); })
    .catch(function(ex){ alert("Fehler: " + ex.message); });
}
function deleteEntry(id) {
  if (!confirm("Diesen Eintrag wirklich löschen?")) return;
  var pk = encodeURIComponent(state.order.primary_key);
  api("/api/orders/" + pk + "/diary/" + encodeURIComponent(id), { method: "DELETE" })
    .then(function(){ loadDiary(); loadTrupps(); })
    .catch(function(ex){ alert("Fehler: " + ex.message); });
}

// ---- Trupp CRUD --------------------------------------------------------
function openTruppModal(trupp) {
  var isEdit = !!trupp;
  var members = isEdit ? (trupp.members || []).slice() : [];
  while (members.length < 4) members.push("");
  var modal = $(
    '<div class="modal-bg"><div class="modal-card">' +
      '<h3>' + (isEdit ? "Trupp bearbeiten" : "Neuen Trupp anlegen") + '</h3>' +
      '<label>Name (leer = Auto-Nummerierung)</label>' +
      '<input type="text" id="t-name" value="' + esc(isEdit ? trupp.name : "") + '" placeholder="z.B. Trupp 1, Lager-Team..." />' +
      '<label>Mitglieder (max. 4)</label>' +
      [0,1,2,3].map(function(i){
        return '<input type="text" id="t-m'+i+'" value="' + esc(members[i] || "") + '" placeholder="Mitglied ' + (i+1) + '" style="margin-bottom:6px;" />';
      }).join("") +
      '<div id="t-err"></div>' +
      '<div class="actions">' +
        '<button class="btn" id="t-cancel">Abbrechen</button>' +
        '<button class="btn primary" id="t-save">' + (isEdit ? "Speichern" : "Anlegen") + '</button>' +
      '</div>' +
    '</div></div>'
  );
  document.body.appendChild(modal);
  modal.querySelector("#t-cancel").addEventListener("click", function(){ modal.remove(); });
  modal.querySelector("#t-save").addEventListener("click", function() {
    var name = modal.querySelector("#t-name").value.trim();
    var ms = [0,1,2,3].map(function(i){ return modal.querySelector("#t-m"+i).value.trim(); }).filter(Boolean);
    var pk = encodeURIComponent(state.order.primary_key);
    var url = "/api/orders/" + pk + "/trupps" + (isEdit ? "/" + encodeURIComponent(trupp.id) : "");
    var method = isEdit ? "PUT" : "POST";
    var payload = { members: ms };
    if (isEdit || name) payload.name = name;
    api(url, { method: method, body: payload })
      .then(function(){ modal.remove(); loadTrupps(); })
      .catch(function(ex){ modal.querySelector("#t-err").innerHTML = '<div class="alert error">' + esc(ex.message) + '</div>'; });
  });
}
function toggleTruppActive(t) {
  var pk = encodeURIComponent(state.order.primary_key);
  api("/api/orders/" + pk + "/trupps/" + encodeURIComponent(t.id), { method: "PUT", body: { is_active: !t.is_active } })
    .then(loadTrupps)
    .catch(function(ex){ alert("Fehler: " + ex.message); });
}
function deleteTrupp(t) {
  if (!confirm("Trupp „" + t.name + "\" wirklich löschen? Er wird aus allen Einträgen entfernt.")) return;
  var pk = encodeURIComponent(state.order.primary_key);
  api("/api/orders/" + pk + "/trupps/" + encodeURIComponent(t.id), { method: "DELETE" })
    .then(function(){ loadTrupps(); loadDiary(); })
    .catch(function(ex){ alert("Fehler: " + ex.message); });
}

// ---- CSV Export --------------------------------------------------------
function exportDiaryCsv() {
  var pk = encodeURIComponent(state.order.primary_key);
  var url = BACKEND + "/api/orders/" + pk + "/diary/export.csv";
  fetch(url, { headers: { "Authorization": "Bearer " + state.token } })
    .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.blob(); })
    .then(function(blob) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "einsatztagebuch_" + state.order.primary_key + ".csv";
      document.body.appendChild(a); a.click(); a.remove();
    })
    .catch(function(ex){ alert("CSV-Export fehlgeschlagen: " + ex.message); });
}

// ============================================================================
// ROUTER
// ============================================================================
function render() {
  switch (state.phase) {
    case "user_select": return renderUserSelect();
    case "password":    return renderPassword();
    case "order_select":return renderOrderSelect();
    case "workspace":   return renderWorkspace();
    case "tile":        return renderTilePanel();
    default:            return renderUserSelect();
  }
}
render();
</script>
</body>
