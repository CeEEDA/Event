[emu_sync]
# === Eventenergie EMU Sync Konfiguration ===
# Diese Werte erhalten Sie aus der Geraeteverwaltung im Portal

# Server-URL (ohne /api am Ende)
api_url = https://mqtt-monitor-hub.preview.emergentagent.com/api

# Geraeteschluessel (aus der Geraeteverwaltung -> Schluessel generieren)
device_key = HIER_GERAETESCHLUESSEL_EINTRAGEN

# Messkoffer Device-ID (aus der Geraeteverwaltung)
device_id = HIER_DEVICE_ID_EINTRAGEN

# Zaehler-ID (aus der Geraeteverwaltung -> Zaehler)
meter_id = HIER_METER_ID_EINTRAGEN

# Pfad zur lokalen SQLite-Datenbank
db_path = /home/pi/emu.db

# Anzahl Datensaetze pro Uebertragung
batch_size = 500

# Sekunden zwischen Sync-Versuchen
sync_interval = 10

# Sekunden Wartezeit bei Verbindungsfehler
retry_delay = 30
