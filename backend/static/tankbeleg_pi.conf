[tankbeleg]
# === Portal-Verbindung ===
# URL zum Eventenergie Portal (ohne /api am Ende)
api_url = https://BITTE_PORTAL_URL_EINTRAGEN

# === Serielle Schnittstelle ===
# USB-zu-RS232 Adapter (meist /dev/ttyUSB0)
serial_port = /dev/ttyUSB0
serial_baud = 9600
serial_bytesize = 8
serial_parity = N
serial_stopbits = 1

# === Lokale Datenbank ===
db_path = /var/lib/tankbeleg/tankbeleg.sqlite

# === Sync-Einstellungen ===
# Intervall in Sekunden fuer die Synchronisation mit dem Portal
sync_interval = 60
# Wartezeit bei Verbindungsfehlern
retry_delay = 30

# === GPS ===
# GPS aktivieren (erfordert gpsd)
gps_enabled = true
gps_host = 127.0.0.1
gps_port = 2947

# === Fahrer ===
# Standard-Fahrername (wird auf dem Beleg gespeichert)
fahrer_name =

# === Sening MultiFlow Status-Antwort ===
# Byte, das als Antwort auf 'ESC B3 FF'-Polls gesendet wird.
# 0x00 = alles OK (Papier eingelegt, Standardvorgabe)
# 0x01, 0x10, 0x12, 0x7F = alternative Werte falls MultiFlow 'Papier einlegen' meldet
sening_reply_byte = 0x00

# === Feste Zaehler-Nr ===
# Der Zaehler hat normalerweise eine feste 5-stellige Nummer. Da die MultiFlow
# die letzte Ziffer fett-gedruckt als Bitmap sendet (unlesbar), hinterlegen wir
# hier die komplette Nummer. Parser nimmt diese, wenn der erkannte Praefix passt.
fixed_zaehler_nr = 11461

# === Beleg-Nr Counter ===
# Die Beleg-Nr laeuft in der MultiFlow fortlaufend hoch, wird aber als Bitmap
# gedruckt (letzte 3 Ziffern unlesbar). Wir fuehren deshalb einen eigenen
# Counter: Startwert hier setzen, Pi zaehlt pro Beleg +1 hoch.
beleg_nr_start = 16935

# === Abgabezeit-Berechnung (Fallback da Minuten im Bitmap unlesbar) ===
# Start-Zeit wird aus Ende-Zeit (Pi-Uhrzeit) berechnet:
#   Start = Ende - (Menge_Liter * Sekunden_pro_Liter + Einrichtung)
abgabe_zeit_pro_liter_sek = 12
abgabe_zeit_einrichtung_sek = 240
