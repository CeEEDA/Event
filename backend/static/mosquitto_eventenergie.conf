# =====================================================
# Mosquitto MQTT Broker - Konfiguration
# Eventenergie Deutschland GmbH & Co. KG
# =====================================================
# Pfad: C:\Program Files\Mosquitto\mosquitto.conf
# =====================================================

# --- Listener 1: MQTTS (TLS) - Port 8883 ---
# Oeffentlich erreichbar fuer DSE Webnet Gateways (verschluesselt)
listener 8883 0.0.0.0
protocol mqtt
listener_allow_anonymous false
password_file C:/Program Files/Mosquitto/passwd
certfile C:/eventenergie/ssl/www.eventenergie.app_ssl_certificate.cer
keyfile C:/eventenergie/ssl/www.eventenergie.app_private_key.key
tls_version tlsv1.2

# --- Listener 2: MQTT ohne TLS - Port 1883 ---
# Oeffentlich erreichbar fuer DSE Gateways ohne TLS
listener 1883 0.0.0.0
protocol mqtt
listener_allow_anonymous false
password_file C:/Program Files/Mosquitto/passwd

# --- Listener 3: Lokal ohne Auth - Port 1884 ---
# Nur fuer lokale Dienste (Portal Backend auf gleichem Server)
listener 1884 127.0.0.1
protocol mqtt
listener_allow_anonymous true

# --- Persistenz ---
persistence true
persistence_file mosquitto.db

# --- Logging ---
log_dest stderr
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
