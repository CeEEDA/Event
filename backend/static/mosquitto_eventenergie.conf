# =====================================================
# Mosquitto MQTT Broker - Konfiguration
# Eventenergie Deutschland GmbH & Co. KG
# =====================================================
# Selbst-gehosteter Broker mit TLS (Let's Encrypt)
# Fuer DSE Webnet Gateways und Eventenergie Portal
#
# Erstellt durch: setup_mosquitto.sh
# Pfad: /etc/mosquitto/conf.d/eventenergie.conf
# =====================================================

# --- Allgemein ---
per_listener_settings true
max_connections -1
autosave_interval 300

# --- Listener 1: MQTTS (TLS) - Port 8883 ---
# Oeffentlich erreichbar fuer DSE Webnet Gateways
listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /etc/mosquitto/passwd

# TLS Zertifikate (Let's Encrypt)
# DOMAIN wird durch setup_mosquitto.sh ersetzt
certfile /etc/letsencrypt/live/DOMAIN/fullchain.pem
keyfile /etc/letsencrypt/live/DOMAIN/privkey.pem
cafile /etc/letsencrypt/live/DOMAIN/chain.pem
tls_version tlsv1.2

# --- Listener 2: Lokal ohne TLS - Port 1883 ---
# Nur fuer lokale Dienste (Portal Backend auf gleichem Server)
listener 1883 127.0.0.1
protocol mqtt
allow_anonymous true

# --- Listener 3: WebSockets mit TLS - Port 9883 ---
# Optional: Fuer Web-Dashboard Echtzeit-Updates
listener 9883 0.0.0.0
protocol websockets
allow_anonymous false
password_file /etc/mosquitto/passwd
certfile /etc/letsencrypt/live/DOMAIN/fullchain.pem
keyfile /etc/letsencrypt/live/DOMAIN/privkey.pem
cafile /etc/letsencrypt/live/DOMAIN/chain.pem
tls_version tlsv1.2

# --- Logging ---
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# --- Persistenz ---
persistence true
persistence_location /var/lib/mosquitto/
persistence_file mosquitto.db

# --- Limits ---
max_inflight_messages 40
max_queued_messages 1000
message_size_limit 262144
