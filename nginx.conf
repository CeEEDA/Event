worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # HTTPS -> Caddy Reverse Proxy
    server {
        listen 443 ssl;
        server_name eventenergie.app www.eventenergie.app;

        ssl_certificate      C:/eventenergie/ssl/www.eventenergie.app_fullchain.pem;
        ssl_certificate_key  C:/eventenergie/ssl/www.eventenergie.app_private_key.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;

        client_max_body_size 100M;

        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
        }
    }

    # HTTP -> HTTPS Redirect
    server {
        listen 80;
        server_name eventenergie.app www.eventenergie.app;
        return 301 https://eventenergie.app$request_uri;
    }
}
